<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>猫咪三消养成 V3.3</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f7e8cf; color: #4a3524; user-select: none; }
  .hidden { display: none !important; }

  #modeSelect {
    position: fixed; inset: 0; z-index: 900;
    background: linear-gradient(180deg, #b8e0f5 0%, #d9f0e0 45%, #86c269 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px; gap: 14px;
  }
  #modeSelect h1 { margin: 0 0 6px; font-size: 28px; color: #5a3a1a;
    text-shadow: 0 2px 0 #fff8e0; letter-spacing: 1.5px; }
  #modeSelect .sub { color: #6b5a44; font-size: 13px; margin-bottom: 18px; }
  .mode-card {
    width: min(92vw, 380px); padding: 16px 20px;
    background: linear-gradient(180deg, #fffdf5, #ffefd3);
    border-radius: 20px; border: 2px solid #f0cfa0;
    box-shadow: 0 8px 20px rgba(120, 80, 40, .2), inset 0 1px 0 rgba(255,255,255,.9);
    display: flex; align-items: center; gap: 14px;
    cursor: pointer; transition: transform .15s ease, box-shadow .15s ease;
  }
  .mode-card:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(120, 80, 40, .28); }
  .mode-icon { font-size: 36px; line-height: 1; flex: 0 0 auto; }
  .mode-text { flex: 1; }
  .mode-title { font-size: 18px; font-weight: 900; color: #5a3a1a; margin-bottom: 2px; }
  .mode-desc { font-size: 12px; color: #8a6a40; line-height: 1.3; }

  #game { height: 100vh; height: 100dvh; max-width: 520px; margin: 0 auto;
    display: flex; flex-direction: column; position: relative; background: #f7e8cf; overflow: hidden; }
  #topArea { flex: 0 0 auto; min-height: 260px; max-height: 50vh;
    position: relative; overflow: hidden;
    border-bottom-left-radius: 24px; border-bottom-right-radius: 24px;
    box-shadow: 0 8px 20px rgba(90, 120, 70, 0.22);
    background: linear-gradient(180deg, #b8e0f5 0%, #c8e8f0 15%, #d9f0e0 25%, #c8e8b0 32%, #a8d68e 45%, #86c269 100%); }
  #topArea.singleMode { height: 48vh; height: 48dvh; }
  #topArea.battleMode { height: 50vh; height: 50dvh; }
  .cloud { position: absolute; background: rgba(255,255,255,.95); border-radius: 999px; pointer-events: none; }
  .cloud::before, .cloud::after { content: ""; position: absolute; background: inherit; border-radius: 50%; }
  .cloud.c1 { top: 66px; left: 6%; width: 50px; height: 16px; }
  .cloud.c1::before { width: 24px; height: 24px; top: -13px; left: 6px; }
  .cloud.c1::after { width: 18px; height: 18px; top: -9px; left: 26px; }
  .cloud.c2 { top: 88px; left: 40%; width: 40px; height: 14px; opacity: .8; }
  .cloud.c2::before { width: 20px; height: 20px; top: -10px; left: 5px; }
  .cloud.c2::after { width: 14px; height: 14px; top: -7px; left: 21px; }
  #sun { position: absolute; top: 50px; right: 14px; width: 30px; height: 30px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff8c4, #ffd54f 55%, #f7b733);
    box-shadow: 0 0 26px rgba(255, 213, 79, .8); pointer-events: none; z-index: 2; }
  #grass { position: absolute; left: 0; right: 0; bottom: 0; height: 70%;
    background: linear-gradient(180deg, rgba(168, 214, 142, 0) 0%, #a8d68e 15%, #7dba63 100%); z-index: 1; pointer-events: none; }

  #hud { position: absolute; top: 0; left: 0; right: 0; height: 56px;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 6px 8px; z-index: 22; pointer-events: none; gap: 4px; }
  .hud-item { background: linear-gradient(180deg, #fffdf5, #ffeccf); border-radius: 999px;
    padding: 3px 10px 4px 8px; min-width: 78px; display: flex; align-items: center; gap: 5px;
    box-shadow: 0 3px 0 #d9a86c, 0 4px 10px rgba(120, 80, 40, .18);
    border: 1.5px solid #f0cfa0; }
  .hud-icon { font-size: 18px; line-height: 1; }
  .hud-text { display: flex; flex-direction: column; line-height: 1.05; }
  .hud-label { font-size: 8px; color: #a07a50; font-weight: 700; }
  .hud-value { font-size: 18px; font-weight: 900; color: #5a3a1a; font-variant-numeric: tabular-nums; }
  .hud-item.me { border-color: #7ed957; }
  .hud-item.opp { border-color: #ff7b8a; background: linear-gradient(180deg, #fff0f2, #ffe0e4); }
  .hud-item.opp .hud-value { color: #c0333f; }
  #scene { position: absolute; inset: 0; padding-top: 56px; z-index: 2; }

  #singleLayout { position: absolute; inset: 0; }
  #leftColumn { position: absolute; left: 6px; width: 70px;
    display: flex; flex-direction: column; align-items: center;
    gap: 6px; z-index: 30; pointer-events: none; }
  #foodMachine { position: relative; width: 62px; height: 78px;
    filter: drop-shadow(0 5px 8px rgba(60, 90, 120, .3));
    transform-origin: center bottom; pointer-events: auto; }
  #foodMachine.producing { animation: machineProduce .55s cubic-bezier(.3,1.4,.5,1); }
  @keyframes machineProduce { 0%{transform:scale(1)} 25%{transform:scale(1.08) rotate(-3deg)} 50%{transform:scale(1.12) rotate(3deg)} 100%{transform:scale(1)} }
  .machine-body { position: absolute; inset: 12px 0 0 0;
    background: linear-gradient(180deg, #f5e6cf 0%, #e8cfa8 45%, #d4b07a 100%);
    border-radius: 10px;
    box-shadow: inset 0 3px 0 rgba(255,255,255,.8), inset 0 -4px 8px rgba(0,0,0,.12); }
  .mach-slot { position: absolute; top: 8px; left: 10px; right: 10px; height: 8px; border-radius: 5px;
    background: rgba(60, 40, 20, .25); box-shadow: inset 0 2px 3px rgba(0,0,0,.4); }
  .mach-light { position: absolute; top: 22px; right: 10px; width: 7px; height: 7px; border-radius: 50%;
    background: #ffe082; box-shadow: 0 0 10px #ffd54f; animation: machBlink 1.6s ease-in-out infinite; }
  @keyframes machBlink { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  .mach-label { position: absolute; top: 16px; left: 0; right: 0; text-align: center;
    font-size: 7px; font-weight: 900; color: #8a6a40; }
  .mach-spout { position: absolute; top: 2px; left: 50%; transform: translateX(-50%);
    width: 22px; height: 12px;
    background: linear-gradient(180deg, #d8c8a8, #b8a888);
    border-radius: 6px 6px 2px 2px; z-index: 3; }
  .mach-spout::before { content: ""; position: absolute;
    top: 2px; left: 50%; transform: translateX(-50%);
    width: 12px; height: 4px; background: #7a6a4a; border-radius: 2px; }
  #progressTrack { position: relative; width: 20px; height: 260px;
    background: linear-gradient(180deg, rgba(120,80,40,.15), rgba(120,80,40,.3));
    border-radius: 11px; border: 2px solid #e8b87a; overflow: hidden; pointer-events: auto; }
  #progressFill { position: absolute; left: 0; right: 0; bottom: 0; height: 0%;
    background: linear-gradient(0deg, #e29a25 0%, #f6c34a 45%, #ffe082 100%);
    border-radius: 9px; transition: height .3s cubic-bezier(.3,.8,.4,1);
    box-shadow: 0 0 10px rgba(255,200,80,.7); z-index: 2; }

  #trough { position: absolute; z-index: 9; height: 34px; border-radius: 18px;
    background: linear-gradient(180deg, #e8c9a0 0%, #c9a06a 50%, #a87c48 100%);
    padding: 3px;
    box-shadow: 0 4px 10px rgba(90,60,30,.35), inset 0 2px 0 rgba(255,255,255,.5); }
  #troughInner { position: relative; width: 100%; height: 100%; border-radius: 15px;
    background: linear-gradient(180deg, #5a4630, #2f2318); overflow: hidden;
    box-shadow: inset 0 3px 6px rgba(0,0,0,.55); }
  #troughCells {
    position: absolute;
    inset: 0;
    padding: 2px;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 2px;
  }
  .trough-cell {
    position: relative;
    background: rgba(255, 255, 255, 0.06);
    border-radius: 3px;
    overflow: hidden;
    box-shadow: inset 0 1px 2px rgba(0,0,0,.35);
  }
  .trough-cell-fill {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 0%;
    background: linear-gradient(180deg, #f6c34a 0%, #e29a25 65%, #b8791a 100%);
    transition: height .3s cubic-bezier(.3,.8,.4,1);
    box-shadow: inset 0 -1px 0 rgba(0,0,0,.2);
  }
  .trough-cell.full .trough-cell-fill {
    background: linear-gradient(180deg, #ffe082 0%, #f6c34a 45%, #e29a25 100%);
    box-shadow: 0 0 6px rgba(255, 220, 120, .7), inset 0 -1px 0 rgba(0,0,0,.2);
  }

  #bigHome { position: absolute; z-index: 5; border-radius: 50% / 42%;
    background: radial-gradient(ellipse at 50% 20%, #f8d8a0 0%, #e8a860 35%, #c98840 70%, #a86b30 100%);
    box-shadow: inset 0 14px 24px rgba(255,240,200,.55), inset 0 -16px 30px rgba(80,40,10,.35),
      inset 0 0 0 6px rgba(210,160,90,.5), 0 12px 28px rgba(90,60,30,.48);
    overflow: hidden; }
  #bigHome::before { content: ""; position: absolute; inset: 0;
    background-image:
      repeating-linear-gradient(0deg, rgba(120,70,25,.12) 0 4px, transparent 4px 12px),
      repeating-linear-gradient(90deg, rgba(120,70,25,.08) 0 6px, transparent 6px 14px);
    border-radius: inherit; opacity: 0.7; pointer-events: none; }
  #bigHomeInner { position: absolute; left: 11%; right: 11%; top: 17%; bottom: 22%;
    border-radius: 50% / 38%;
    background: radial-gradient(ellipse at 50% 30%, #55402a, #2a1f14);
    box-shadow: inset 0 10px 22px rgba(0,0,0,.8); overflow: hidden; }
  #bigHomeCushion { position: absolute; left: 12%; right: 12%; top: 22%; bottom: 26%;
    border-radius: 50% / 42%;
    background: radial-gradient(ellipse at 50% 25%, #fff1c8 0%, #ffd88a 45%, #e8a860 100%);
    box-shadow: inset 0 -5px 12px rgba(150,90,30,.45); }
  #bigHomeLabel { position: absolute; top: 5%; left: 0; right: 0; text-align: center;
    font-size: 10px; font-weight: 900; color: #7a4d1f; letter-spacing: 1px; z-index: 3; }

  /* ============ 对战模式布局 ============ */
  #battleLayout { position: absolute; inset: 0; display: none; }
  #topArea.battleMode #battleLayout { display: block; }
  #topArea.singleMode #singleLayout { display: block; }
  #topArea.singleMode #battleLayout { display: none; }
  #topArea.battleMode #singleLayout { display: none; }

  #battleHud {
    position: absolute; top: 0; left: 0; right: 0; height: 52px;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 4px 6px; z-index: 22; gap: 4px;
  }

  /* 中栏：等待区（只有 2 列猫的宽度，居中） */
  #battlePool {
    position: absolute;
    left: 50%; transform: translateX(-50%);
    width: 140px;
    top: 58px; bottom: 8px;
    background: rgba(255, 255, 255, .35);
    border: 2px dashed rgba(255, 255, 255, .8);
    border-radius: 16px; z-index: 7;
    box-shadow: inset 0 2px 8px rgba(90, 120, 70, .15);
    overflow: hidden;
  }
  #battlePoolLabel {
    position: absolute; top: -2px; left: 50%; transform: translateX(-50%);
    background: linear-gradient(180deg, #fffdf5, #ffeccf);
    padding: 1px 8px; border-radius: 8px;
    font-size: 9px; font-weight: 900; color: #8a6a40;
    border: 1.5px solid #f0cfa0; white-space: nowrap;
    box-shadow: 0 1px 3px rgba(120, 80, 40, .15);
    z-index: 3;
  }

  /* 左栏：宽 = (总宽 - 中栏) / 2 */
  #battleLeftCol {
    position: absolute;
    left: 6px;
    right: calc(50% + 76px);
    top: 58px; bottom: 8px;
    display: flex; flex-direction: column;
    gap: 0;
    z-index: 8;
  }
  #battleRightCol {
    position: absolute;
    left: calc(50% + 76px);
    right: 6px;
    top: 58px; bottom: 8px;
    display: flex; flex-direction: column;
    gap: 0;
    z-index: 8;
  }
  #battleLeftCol > .battleSpacer,
  #battleRightCol > .battleSpacer { flex: 1 1 auto; }

  #battleCats { position: absolute; inset: 0; z-index: 10; pointer-events: none; }

  /* 迷你猫窝 */
  .miniHome {
    position: relative;
    height: 88px;
    border-radius: 50% / 42%;
    background: radial-gradient(ellipse at 50% 20%, #f8d8a0 0%, #e8a860 35%, #c98840 70%, #a86b30 100%);
    box-shadow: inset 0 8px 16px rgba(255,240,200,.55),
                inset 0 -10px 18px rgba(80,40,10,.35),
                inset 0 0 0 4px rgba(210,160,90,.5),
                0 6px 14px rgba(90,60,30,.42);
    overflow: hidden;
    flex: 0 0 auto;
    margin-bottom: 6px;
  }
  .miniHome::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      repeating-linear-gradient(0deg, rgba(120,70,25,.12) 0 3px, transparent 3px 9px),
      repeating-linear-gradient(90deg, rgba(120,70,25,.08) 0 5px, transparent 5px 11px);
    border-radius: inherit; opacity: 0.7; pointer-events: none;
  }
  .miniHomeInner {
    position: absolute; left: 12%; right: 12%; top: 18%; bottom: 22%;
    border-radius: 50% / 38%;
    background: radial-gradient(ellipse at 50% 30%, #55402a, #2a1f14);
    box-shadow: inset 0 6px 14px rgba(0,0,0,.8); overflow: hidden;
  }
  .miniHomeCushion {
    position: absolute; left: 14%; right: 14%; top: 24%; bottom: 26%;
    border-radius: 50% / 42%;
    background: radial-gradient(ellipse at 50% 25%, #fff1c8 0%, #ffd88a 45%, #e8a860 100%);
    box-shadow: inset 0 -3px 8px rgba(150,90,30,.45);
  }
  .miniHomeLabel {
    position: absolute; top: 3%; left: 0; right: 0; text-align: center;
    font-size: 9px; font-weight: 900; color: #7a4d1f;
    letter-spacing: .5px; z-index: 3;
    text-shadow: 0 1px 0 rgba(255,255,255,.7);
  }
  .miniHomeCats {
    position: absolute; inset: 15% 10% 20% 10%;
    z-index: 2; pointer-events: none;
    overflow: hidden;
  }

  /* 迷你食槽（更长） */
  .miniTrough {
    position: relative;
    height: 32px;
    border-radius: 16px;
    background: linear-gradient(180deg, #e8c9a0 0%, #c9a06a 50%, #a87c48 100%);
    padding: 3px;
    box-shadow: 0 3px 8px rgba(90,60,30,.32), inset 0 1px 0 rgba(255,255,255,.4);
    flex: 0 0 auto;
    margin-bottom: 0;
    width: 100%;
  }
  .miniTroughInner {
    position: relative; width: 100%; height: 100%; border-radius: 13px;
    background: linear-gradient(180deg, #5a4630, #2f2318); overflow: hidden;
    box-shadow: inset 0 2px 4px rgba(0,0,0,.5);
  }
  .miniTroughCells {
    position: absolute;
    inset: 0;
    padding: 2px;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 1px;
  }
  .miniTroughCells .trough-cell {
    position: relative;
    background: rgba(255, 255, 255, 0.06);
    border-radius: 3px;
    overflow: hidden;
    box-shadow: inset 0 1px 2px rgba(0,0,0,.35);
  }
  .miniTroughCells .trough-cell-fill {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 0%;
    background: linear-gradient(180deg, #f6c34a 0%, #e29a25 65%, #b8791a 100%);
    transition: height .3s cubic-bezier(.3,.8,.4,1);
  }
  .miniTroughCells .trough-cell.full .trough-cell-fill {
    background: linear-gradient(180deg, #ffe082 0%, #f6c34a 45%, #e29a25 100%);
    box-shadow: 0 0 4px rgba(255, 220, 120, .7);
  }

  /* 迷你猫粮机（和个人模式一样大：62×78） */
  .miniMachine {
    position: relative;
    height: 78px;
    flex: 0 0 auto;
    margin-top: -2px;
  }
   .miniMachine.producing { animation: machineProduce .55s cubic-bezier(.3,1.4,.5,1); }
  .miniMachineBody {
    position: absolute;
    left: 50%; transform: translateX(-50%);
    top: 12px;
    width: 62px;
    height: 66px;
    background: linear-gradient(180deg, #f5e6cf 0%, #e8cfa8 45%, #d4b07a 100%);
    border-radius: 10px;
    box-shadow: inset 0 2px 0 rgba(255,255,255,.8), inset 0 -3px 6px rgba(0,0,0,.12);
  }
  .miniMachineSpout {
    position: absolute; top: 2px; left: 50%; transform: translateX(-50%);
    width: 22px; height: 14px;
    background: linear-gradient(180deg, #d8c8a8, #b8a888);
    border-radius: 6px 6px 2px 2px; z-index: 3;
    box-shadow: 0 1px 2px rgba(0,0,0,.15);
  }
  .miniMachineSpout::before {
    content: ""; position: absolute;
    top: 2px; left: 50%; transform: translateX(-50%);
    width: 12px; height: 4px; background: #7a6a4a; border-radius: 2px;
  }
  .miniMachineLabel {
    position: absolute; top: 18px; left: 0; right: 0;
    text-align: center; font-size: 7px; font-weight: 900; color: #8a6a40;
    z-index: 4;
  }

  .miniStock {
    text-align: center; font-size: 10px; font-weight: 900;
    color: #5a3a1a; padding: 3px 4px;
    background: rgba(255,253,245,.8);
    border-radius: 8px;
    text-shadow: 0 1px 0 rgba(255,255,255,.6);
    flex: 0 0 auto;
    margin: 4px 8px 0 8px;
  }

  /* ============ 猫咪 ============ */
  .cat { position: absolute; width: 68px; height: 60px;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    transition: left 1.05s cubic-bezier(.45,.05,.55,.95), top 1.05s cubic-bezier(.45,.05,.55,.95), opacity .4s ease;
    z-index: 10; pointer-events: none; }
  .cat-svg-wrap { width: 68px; height: 56px;
    display: flex; align-items: flex-end; justify-content: center;
    position: relative; transition: transform .3s; }
  .cat.facing-left .cat-svg-wrap { transform: scaleX(-1); }
  .cat-svg-wrap svg { width: 65px; height: 53px; overflow: visible;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,.18)); }
  .cat-chip { font-size: 8px; font-weight: 800; padding: 0px 6px; border-radius: 7px;
    background: rgba(255,255,255,.9); color: #4a3524;
    margin-top: -4px; white-space: nowrap; border: 1px solid rgba(255,255,255,.8); }
  .cat.state-waiting .cat-chip { background: #f0e2c8; color: #8a6a40; }
  .cat.state-waiting_walk .cat-chip { background: #e6f0d0; color: #5a7a30; }
  .cat.state-walking_to_food .cat-chip,
  .cat.state-walking_to_home .cat-chip { background: #d6f5cf; color: #2f7a3e; }
  .cat.state-eating .cat-chip { background: #ffe0b0; color: #a15a1a; }
  .cat.state-cleaning .cat-chip { background: #cfe9ff; color: #25628f; }
  .cat.state-happy .cat-chip { background: #ffe2ef; color: #b8456f; }
  .cat.state-sleeping .cat-chip { background: #dcd6f5; color: #4a3d8a; }

  .cat.state-walking_to_food .cat-svg-wrap svg,
  .cat.state-walking_to_home .cat-svg-wrap svg,
  .cat.state-waiting_walk .cat-svg-wrap svg {
    animation: walkBob .48s ease-in-out infinite;
  }
  @keyframes walkBob {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    50% { transform: translateY(-3px) rotate(1deg); }
  }
  .cat .leg { transform-box: fill-box; transform-origin: center top; }
  .cat.state-walking_to_food .leg-fl,
  .cat.state-walking_to_home .leg-fl,
  .cat.state-waiting_walk .leg-fl { animation: legSwingF .48s ease-in-out infinite; }
  .cat.state-walking_to_food .leg-fr,
  .cat.state-walking_to_home .leg-fr,
  .cat.state-waiting_walk .leg-fr { animation: legSwingF .48s ease-in-out infinite reverse; }
  .cat.state-walking_to_food .leg-bl,
  .cat.state-walking_to_home .leg-bl,
  .cat.state-waiting_walk .leg-bl { animation: legSwingF .48s ease-in-out infinite reverse; }
  .cat.state-walking_to_food .leg-br,
  .cat.state-walking_to_home .leg-br,
  .cat.state-waiting_walk .leg-br { animation: legSwingF .48s ease-in-out infinite; }
  @keyframes legSwingF { 0%, 100% { transform: rotate(-14deg); } 50% { transform: rotate(14deg); } }

  .cat.state-eating .cat-svg-wrap svg { animation: eatBob .55s ease-in-out infinite; }
  @keyframes eatBob { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-2px) rotate(-4deg); } }
  .cat.state-cleaning .cat-svg-wrap svg { animation: cleanSway 1.1s ease-in-out infinite; }
  @keyframes cleanSway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
  .cat.state-happy .cat-svg-wrap svg { animation: happyHop .55s ease-in-out infinite; }
  @keyframes happyHop { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-5px) scale(1.05); } }
  .cat.state-sleeping .cat-svg-wrap svg { animation: sleepBreathe 2.6s ease-in-out infinite; }
  @keyframes sleepBreathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  .meow-bubble { transform-box: fill-box; transform-origin: center;
    animation: meowPulse 1.8s ease-in-out infinite; }
  @keyframes meowPulse { 0%, 100% { opacity: 0.55; transform: scale(0.92); } 50% { opacity: 1; transform: scale(1.05); } }

  /* ============ 棋盘 ============ */
  #boardArea { flex: 1 1 auto; min-height: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 6px 8px 8px 82px;
    position: relative;

<script>
(function () {
  "use strict";

  const SoundManager = (function () {
    let ctx = null, enabled = true, masterGain = null;
    function init() {
      if (ctx) return;
      try {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = ctx.createGain();
        masterGain.gain.value = 0.35;
        masterGain.connect(ctx.destination);
      } catch (e) { enabled = false; }
    }
    function tone(freq, dur, type, vol, delay) {
      type = type || 'sine'; vol = vol || 0.5; delay = delay || 0;
      if (!ctx || !enabled) return;
      const t0 = ctx.currentTime + delay;
      const osc = ctx.createOscillator(); const g = ctx.createGain();
      osc.type = type; osc.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(vol, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      osc.connect(g); g.connect(masterGain);
      osc.start(t0); osc.stop(t0 + dur + 0.02);
    }
    function slide(f1, f2, dur, type, vol, delay) {
      type = type || 'sine'; vol = vol || 0.5; delay = delay || 0;
      if (!ctx || !enabled) return;
      const t0 = ctx.currentTime + delay;
      const osc = ctx.createOscillator(); const g = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(f1, t0);
      osc.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(vol, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      osc.connect(g); g.connect(masterGain);
      osc.start(t0); osc.stop(t0 + dur + 0.02);
    }
    return {
      init,
      match(n) { tone(660 * Math.pow(1.12, Math.min(n - 3, 3)), 0.12, 'triangle', 0.45); },
      chain(l) { const steps = [0, 2, 4, 7, 9, 12]; const freq = 523.25 * Math.pow(2, steps[Math.min(l, 5)] / 12);
        tone(freq, 0.16, 'triangle', 0.5); },
      feed() { tone(120, 0.06, 'square', 0.4); tone(180, 0.08, 'square', 0.3, 0.06); tone(90, 0.1, 'sine', 0.35, 0.12); },
      meow() { slide(880, 660, 0.18, 'sine', 0.35); slide(1320, 990, 0.16, 'triangle', 0.15, 0.03); },
      returnHome() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, 0.14, 'triangle', 0.4, i * 0.08)); },
      invalid() { tone(220, 0.12, 'sawtooth', 0.3); tone(180, 0.14, 'sawtooth', 0.25, 0.05); },
      start() { [523.25, 659.25, 783.99].forEach((f, i) => tone(f, 0.16, 'triangle', 0.5, i * 0.1)); },
      end() { [783.99, 659.25, 523.25, 392].forEach((f, i) => tone(f, 0.22, 'triangle', 0.4, i * 0.12)); },
      tick() { tone(880, 0.05, 'square', 0.2); }
    };
  })();

  const TILE_EMOJI = { paw: "🐾", fish: "🐟", yarn: "🧶", cookie: "🍪", milk: "🥛" };
  const TILE_TYPES = ["paw", "fish", "yarn", "cookie", "milk"];
  const CAT_PALETTES = [
    { body: "#f5a352", dark: "#d97d2e", belly: "#ffe8c7", inner: "#f5a8b8", blush: "#ffb8a0" },
    { body: "#c5cdd6", dark: "#96a1ad", belly: "#f2f5f8", inner: "#f0a6b8", blush: "#ffc0c8" },
    { body: "#a87b5b", dark: "#7d563a", belly: "#f0dcc4", inner: "#e9a5b5", blush: "#e8a898" },
    { body: "#f6f2ea", dark: "#cfc8bc", belly: "#ffffff", inner: "#f0a6b8", blush: "#ffd0d0" },
    { body: "#8a7c6a", dark: "#6a5e50", belly: "#d9cfbf", inner: "#e9a5b5", blush: "#d0a898" }
  ];

  // 时长常量
  const DUR = {

    cleaning: 4500,

  const $ = (id) => document.getElementById(id);

  let mode = 'single';

  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const rand = (a, b) => a + Math.random() * (b - a);
  function getTileEl(r, c) { return boardEl.querySelector(`.tile[data-r="${r}"][data-c="${c}"]`); }

  function clearTimers() {

  // ===================== 棋盘逻辑（与之前相同） =====================
  function swap(b, r1, c1, r2, c2) { const t = b[r1][c1]; b[r1][c1] = b[r2][c2]; b[r2][c2] = t; }
  function randomTile() { return TILE_TYPES[Math.floor(Math.random() * TILE_TYPES.length)]; }
  function findMatches(b) {
    const groups = []; const size = 8;
    for (let r = 0; r < size; r++) {
      let c = 0;
      while (c < size) {
        const t = b[r][c]; let len = 1;
        while (c + len < size && b[r][c + len] === t) len++;
        if (len >= 3) { const cells = []; for (let i = 0; i < len; i++) cells.push([r, c + i]);
          groups.push({ cells, length: len }); }
        c += len;
      }
    }
    for (let c = 0; c < size; c++) {
      let r = 0;
      while (r < size) {
        const t = b[r][c]; let len = 1;
        while (r + len < size && b[r + len][c] === t) len++;
        if (len >= 3) { const cells = []; for (let i = 0; i < len; i++) cells.push([r + i, c]);
          groups.push({ cells, length: len }); }
        r += len;
      }
    }
    return groups;
  }
  function hasMove(b) {
    const size = 8;
    for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) {
      if (c < size - 1) { swap(b, r, c, r, c + 1); const ok = findMatches(b).length > 0;
        swap(b, r, c, r, c + 1); if (ok) return true; }
      if (r < size - 1) { swap(b, r, c, r + 1, c); const ok = findMatches(b).length > 0;
        swap(b, r, c, r + 1, c); if (ok) return true; }
    }
    return false;
  }
  function generateBoard() {
    for (let attempt = 0; attempt < 200; attempt++) {
      const b = Array.from({ length: 8 }, () => Array(8).fill(null));
      for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
        const forbid = new Set();
        if (c >= 2 && b[r][c - 1] === b[r][c - 2]) forbid.add(b[r][c - 1]);
        if (r >= 2 && b[r - 1][c] === b[r - 2][c]) forbid.add(b[r - 1][c]);
        const opts = TILE_TYPES.filter(t => !forbid.has(t));
        b[r][c] = opts[Math.floor(Math.random() * opts.length)];
      }
      if (hasMove(b)) return b;
    }
    return Array.from({ length: 8 }, () => Array.from({ length: 8 }, () => randomTile()));
  }
  function applyGravity(b) {
    const size = 8;
    for (let c = 0; c < size; c++) {
      let write = size - 1;
      for (let r = size - 1; r >= 0; r--) {
        if (b[r][c] !== null) { b[write][c] = b[r][c];
          if (write !== r) b[r][c] = null; write--; }
      }
      while (write >= 0) { b[write][c] = randomTile(); write--; }
    }
  }
  function scoreForLength(len) {
    if (len === 3) return 30;
    if (len === 4) return 45;
    if (len === 5) return 60;
    return 60 + (len - 6) * 10;
  }

  function renderBoard() {
    boardEl.innerHTML = "";
    for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
      const tile = document.createElement("div");
      tile.className = "tile";
      tile.dataset.r = r; tile.dataset.c = c;
      tile.dataset.type = board[r][c];
      tile.textContent = TILE_EMOJI[board[r][c]];
      tile.addEventListener("click", () => onTileClick(r, c));
      boardEl.appendChild(tile);
    }
    updateSelection();
    resizeBoard();
  }
  function updateSelection() {
    boardEl.querySelectorAll(".tile.selected").forEach(el => el.classList.remove("selected"));
    if (selected) { const el = getTileEl(selected.r, selected.c); if (el) el.classList.add("selected"); }
  }
  function resizeBoard() {
    const rect = boardArea.getBoundingClientRect();
    const style = getComputedStyle(boardArea);
    const padLeft = parseFloat(style.paddingLeft) || 0;
    const padRight = parseFloat(style.paddingRight) || 0;
    const padTop = parseFloat(style.paddingTop) || 0;
    const padBottom = parseFloat(style.paddingBottom) || 0;
    const availW = rect.width - padLeft - padRight - 4;
    const used = 40;
    const availH = rect.height - padTop - padBottom - used;
    const size = Math.max(140, Math.min(availW, availH));
    boardEl.style.width = size + "px";
    boardEl.style.height = size + "px";
    boardEl.style.setProperty("--tile-size", size / 8 + "px");
    const pt = document.getElementById('progressTrack');
    if (pt) pt.style.height = size + "px";
  }

  async function onTileClick(r, c) {
    SoundManager.init();
    if (!gameActive || isAnimating || timeLeft <= 0) return;
    if (mode === 'online') {
      if (selected === null) { selected = { r, c }; updateSelection(); return; }
      const s = selected;
      if (s.r === r && s.c === c) { selected = null; updateSelection(); return; }
      if (Math.abs(s.r - r) + Math.abs(s.c - c) !== 1) { selected = { r, c }; updateSelection(); return; }
      selected = null; updateSelection();
      sendWS({ type: 'swap', r1: s.r, c1: s.c, r2: r, c2: c });
      return;
    }
    if (selected === null) { selected = { r, c }; updateSelection(); return; }
    const s = selected;
    if (s.r === r && s.c === c) { selected = null; updateSelection(); return; }
    if (Math.abs(s.r - r) + Math.abs(s.c - c) !== 1) { selected = { r, c }; updateSelection(); return; }
    selected = null; updateSelection();
    await trySwap(s.r, s.c, r, c);
  }

  async function trySwap(r1, c1, r2, c2) {
    if (!gameActive) return;
    isAnimating = true;
    swap(board, r1, c1, r2, c2);
    const first = findMatches(board);
    if (first.length === 0) {
      swap(board, r1, c1, r2, c2); renderBoard();
      SoundManager.invalid();
      const el = getTileEl(r1, c1);
      if (el) { el.classList.add("invalid"); setTimeout(() => el.classList.remove("invalid"), 320); }
      isAnimating = false;
      return;
    }
    let chainLevel = 0, current = first;
    while (current.length > 0) {
      const removeSet = new Set(); let base = 0;
      for (const g of current) {
        base += scoreForLength(g.length);
        for (const [r, c] of g.cells) removeSet.add(`${r},${c}`);
      }
      const chainMul = 1 + Math.min(chainLevel * 0.25, 0.75);
      const gained = Math.round(base * chainMul);
      addScore(gained);
      SoundManager.match(current[0].length);
      const cells = [...removeSet].map(k => k.split(",").map(Number));
      spawnParticles(cells); shakeBoard();
      removeSet.forEach(k => {
        const [r, c] = k.split(",").map(Number);
        const el = getTileEl(r, c); if (el) el.classList.add("pop");
      });
      await sleep(280);
      removeSet.forEach(k => {
        const [r, c] = k.split(",").map(Number);
        board[r][c] = null;
      });
      applyGravity(board); renderBoard(); await sleep(160);
      current = findMatches(board); chainLevel++;
      if (current.length > 0) { showChainBanner(chainLevel); await sleep(400); }
    }
    isAnimating = false;
    updateHUD();
  }

  function addScore(points) {
    score += points; foodProgress += points;
    let produced = false;
    while (foodProgress >= 90 && foodStock < 24) { foodStock++; foodProgress -= 90; produced = true; }
    maxFoodStockThisRound = Math.max(maxFoodStockThisRound, foodStock);
    if (produced) animateMachineProduce();
    updateProgressBar();
    updateHUD();
    showFloatingScore(points);
  }
  function updateProgressBar() {
    if (progressAnimating) return;
    const pt = document.getElementById('progressTrack');
    const pf = document.getElementById('progressFill');
    if (!pt || !pf) return;
    let pct;
    if (foodStock >= 24) pct = 100;
    else pct = Math.min(100, (foodProgress / 90) * 100);
    pf.style.height = pct + "%";
    pt.classList.toggle("full", foodStock >= 24);
  }
  function animateMachineProduce() {
    SoundManager.feed();
    if (mode === 'single') {
      const m = document.getElementById('foodMachine');
      if (m) {
        m.classList.remove("producing");
        void m.offsetWidth;
        m.classList.add("producing");
        setTimeout(() => m.classList.remove("producing"), 600);
      }
    } else {
      // 对战/联机模式：动我方猫粮机
      const m = document.getElementById('myMiniMachine');
      if (m) {
        m.classList.remove("producing");
        void m.offsetWidth;
        m.classList.add("producing");
        setTimeout(() => m.classList.remove("producing"), 600);
      }
    }
    {
      progressAnimating = true;
      const pf = document.getElementById('progressFill');
      const pt = document.getElementById('progressTrack');
      if (pf && pt) {
        pf.style.transition = "height .25s cubic-bezier(.3,.8,.4,1)";
        pf.style.height = "100%";
        pt.classList.add("full");
        setTimeout(() => {
          pt.classList.remove("full");
          pf.style.transition = "height .5s cubic-bezier(.3,.8,.4,1)";
          const pct = foodStock >= 24 ? 100 : Math.min(100, (foodProgress / 90) * 100);
          pf.style.height = pct + "%";
          progressAnimating = false;
        }, 400);
      }
    }
  }

  function spawnParticles(cells) {
    if (!cells || !cells.length) return;
    const m = mode === 'single' ? document.getElementById('foodMachine') : document.querySelector('.miniMachine');
    if (!m) return;
    const mRect = m.getBoundingClientRect();
    const endX = mRect.left + mRect.width / 2;
    const endY = mRect.top + mRect.height / 2;
    const chosen = [...cells].sort(() => Math.random() - 0.5).slice(0, Math.min(5, cells.length));
    chosen.forEach(([r, c], i) => {
      const el = getTileEl(r, c); if (!el) return;
      const rect = el.getBoundingClientRect();
      const sx = rect.left + rect.width / 2, sy = rect.top + rect.height / 2;
      const sp = document.createElement("div");
      sp.className = "spark"; sp.style.left = sx + "px"; sp.style.top = sy + "px";
      document.body.appendChild(sp); setTimeout(() => sp.remove(), 420);
      setTimeout(() => {
        const p = document.createElement("div");
        p.className = "feed-particle";
        p.style.left = sx + "px"; p.style.top = sy + "px";
        p.style.transform = "translate(-50%, -50%) scale(1)";
        document.body.appendChild(p);
        requestAnimationFrame(() => {
          p.style.transform = `translate(calc(-50% + ${endX - sx}px), calc(-50% + ${endY - sy}px)) scale(0.35)`;
          p.style.opacity = "0";
        });
        setTimeout(() => p.remove(), 780);
      }, i * 40);
    });
  }
  function shakeBoard() { boardEl.classList.add("shake"); setTimeout(() => boardEl.classList.remove("shake"), 220); }
  function showChainBanner(level) {
    const el = document.createElement("div");

    document.body.appendChild(el); setTimeout(() => el.remove(), 950);

  function showFloatingScore(points) {

    // ============ 排行榜 ============
  const LB_KEY_BEST = 'cat_match3_best';
  const LB_KEY_NAME = 'cat_match3_name';

  function getLocalBest() {
    try { const raw = localStorage.getItem(LB_KEY_BEST); if (raw) return JSON.parse(raw); } catch (e) {}
    return { returnedCats: 0, maxFoodStock: 0 };
  }
  function setLocalBest(b) {
    try { localStorage.setItem(LB_KEY_BEST, JSON.stringify(b)); } catch (e) {}
  }
  function getSavedName() {
    try { return localStorage.getItem(LB_KEY_NAME) || ''; } catch (e) { return ''; }
  }
  function saveName(n) {
    try { localStorage.setItem(LB_KEY_NAME, n); } catch (e) {}
  }
  function wsUrlForLeaderboard() {
    if (location.protocol === 'file:') return 'ws://localhost:8080';
    return 'wss://sanxiao.onrender.com';
  }

  function requestLeaderboard() {
    return new Promise((resolve, reject) => {
      let s;
      try { s = new WebSocket(wsUrlForLeaderboard()); } catch (e) { return reject(e); }
      const t = setTimeout(() => { try { s.close(); } catch (e) {} reject(new Error('连接超时')); }, 12000);
      s.onopen = () => { s.send(JSON.stringify({ type: 'get_leaderboard' })); };
      s.onmessage = (e) => {
        try {
          const m = JSON.parse(e.data);
          if (m.type === 'leaderboard') {
            clearTimeout(t); try { s.close(); } catch (e) {}
            resolve(m.list || []);
          }
        } catch (err) {}
      };
      s.onerror = () => { clearTimeout(t); reject(new Error('连接失败')); };
    });
  }

  function uploadScoreToServer(name, returnedCats, maxFoodStock) {
    return new Promise((resolve, reject) => {
      let s;
      try { s = new WebSocket(wsUrlForLeaderboard()); } catch (e) { return reject(e); }
      const t = setTimeout(() => { try { s.close(); } catch (e) {} reject(new Error('连接超时')); }, 12000);
      s.onopen = () => { s.send(JSON.stringify({ type: 'submit_score', name, returnedCats, maxFoodStock })); };
      s.onmessage = (e) => {
        try {
          const m = JSON.parse(e.data);
          if (m.type === 'score_result') {
            clearTimeout(t); try { s.close(); } catch (e) {}
            resolve(m);
          }
        } catch (err) {}
      };
      s.onerror = () => { clearTimeout(t); reject(new Error('连接失败')); };
    });
  }

  function showUploadSection() {
    const sec = document.getElementById('uploadSection');
    if (!sec) return;
    const best = getLocalBest();
    const isNew = (returnedCats > best.returnedCats) ||
                  (returnedCats === best.returnedCats && maxFoodStockThisRound > best.maxFoodStock);
    if (isNew) {
      setLocalBest({
        returnedCats: Math.max(returnedCats, best.returnedCats),
        maxFoodStock: Math.max(maxFoodStockThisRound, best.maxFoodStock)
      });
    }
    sec.classList.remove('hidden');
    const info = sec.querySelector('.upload-info');
    const bestShown = getLocalBest();
    info.innerHTML = `
      <div>本次：回窝 <b>${returnedCats}</b> 只 · 最大猫粮 <b>${maxFoodStockThisRound}</b> 份</div>
      <div>历史最佳：回窝 <b>${bestShown.returnedCats}</b> 只 · 最大猫粮 <b>${bestShown.maxFoodStock}</b> 份</div>
      ${isNew ? '<div style="color:#e67e22;font-weight:900;margin-top:4px;">🎉 刷新最佳成绩！</div>' : ''}
    `;
    const btn = document.getElementById('btnUploadScore');
    if (isNew) {
      btn.classList.remove('hidden');
      btn.textContent = '上传到排行榜';
      btn.disabled = false;
      btn.onclick = onUploadClick;
    } else {
      btn.classList.add('hidden');
    }
  }

  function onUploadClick() {
    const btn = document.getElementById('btnUploadScore');
    let name = getSavedName();
    if (!name) {
      const input = prompt('请输入你的昵称（最多 16 字）', '');
      if (!input) return;
      name = input.trim().slice(0, 16);
      if (!name) return;
      saveName(name);
    }
    btn.disabled = true;
    btn.textContent = '上传中…';
    uploadScoreToServer(name, returnedCats, maxFoodStockThisRound).then((res) => {
      if (res.ok) {
        btn.textContent = res.rank ? `✅ 已上传（排名第 ${res.rank}）` : '✅ 已上传';
        showToast(res.rank ? `上传成功！你排第 ${res.rank} 名` : '上传成功！');
        // 延迟 1 秒打开排行榜，让玩家先看到成功提示
        setTimeout(() => {
          document.getElementById('resultOverlay').classList.add('hidden');
          openLeaderboard();
        }, 900);
      } else {
        btn.textContent = '上传失败，点击重试';
        btn.disabled = false;
      }
    }).catch(() => {
      btn.textContent = '上传失败，点击重试';
      btn.disabled = false;
    });
  }

  function openLeaderboard() {
    const ov = document.getElementById('leaderboardOverlay');
    const content = document.getElementById('leaderboardContent');
    const myRec = document.getElementById('leaderboardMyRecord');
    ov.classList.remove('hidden');
    content.innerHTML = '<div class="lb-empty">加载中…</div>';
    if (myRec) myRec.classList.add('hidden');
    requestLeaderboard().then(renderLeaderboard).catch(() => {
      content.innerHTML = '<div class="lb-empty">加载失败，请稍后重试</div>';
    });
  }

  function renderLeaderboard(list) {
    const content = document.getElementById('leaderboardContent');
    const myRecEl = document.getElementById('leaderboardMyRecord');
    const myName = getSavedName();

    // 1) 前 10 名
    const top10 = (list || []).slice(0, 10);
    if (top10.length === 0) {
      content.innerHTML = '<div class="lb-empty-virtual"><span class="star">🏆</span>虚位以待<br><span style="font-size:12px;font-weight:600;">快来成为第一个上榜的玩家吧！</span></div>';
    } else {
      const rows = ['<div class="lb-row head"><div class="rank">#</div><div class="name">玩家</div><div class="val">回窝</div><div class="val2">猫粮</div></div>'];
      top10.forEach((entry, idx) => {
        let rankCls = '';
        if (idx === 0) rankCls = 'top1';
        else if (idx === 1) rankCls = 'top2';
        else if (idx === 2) rankCls = 'top3';
        const isMe = myName && entry.name === myName;
        const rowCls = isMe ? ' me' : '';
        const name = (entry.name || '匿名').slice(0, 16);
        rows.push(`<div class="lb-row${rowCls}">
          <div class="rank ${rankCls}">${idx + 1}</div>
          <div class="name">${escapeHtml(name)}${isMe ? ' 👈' : ''}</div>
          <div class="val">${entry.returnedCats || 0}</div>
          <div class="val2">${entry.maxFoodStock || 0}</div>
        </div>`);
      });
      content.innerHTML = rows.join('');
    }

    // 2) 底部显示玩家自己的最佳记录
    if (!myRecEl) return;
    const myEntry = myName ? (list || []).find(e => e.name === myName) : null;
    const localBest = getLocalBest();
    let recReturns = localBest.returnedCats || 0;
    let recFood = localBest.maxFoodStock || 0;
    let rankText = '';
    if (myEntry) {
      recReturns = Math.max(recReturns, myEntry.returnedCats || 0);
      recFood = Math.max(recFood, myEntry.maxFoodStock || 0);
      const rank = (list || []).findIndex(e => e.name === myName) + 1;
      rankText = rank > 0 ? ` · 排名第 ${rank}` : '';
    }
    if (!myName) {
      myRecEl.innerHTML = `
        <div class="rec-title">📌 我的最佳记录</div>
        <div class="rec-stats">
          <div><b>${recReturns}</b><br><span>回窝</span></div>
          <div><b>${recFood}</b><br><span>最大猫粮</span></div>
        </div>
        <div style="font-size:11px;color:#a08a6a;margin-top:6px;">上传成绩后可以显示昵称</div>
      `;
    } else {
      myRecEl.innerHTML = `
        <div class="rec-title">📌 我的最佳记录${rankText}</div>
        <div class="rec-stats">
          <div><b>${recReturns}</b><br><span>回窝</span></div>
          <div><b>${recFood}</b><br><span>最大猫粮</span></div>
        </div>
      `;
    }
    myRecEl.classList.remove('hidden');
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function showStartBanner() {
    startBanner.classList.remove("show");
    void startBanner.offsetWidth;
    startBanner.classList.add("show");
  }
