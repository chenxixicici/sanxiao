<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>猫咪三消养成 V3.3</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f7e8cf; color: #4a3524; user-select: none; }
  .hidden { display: none !important; }

  #modeSelect {
    position: fixed; inset: 0; z-index: 900;
    background: linear-gradient(180deg, #b8e0f5 0%, #d9f0e0 45%, #86c269 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px; gap: 14px;
  }
  #modeSelect h1 { margin: 0 0 6px; font-size: 28px; color: #5a3a1a;
    text-shadow: 0 2px 0 #fff8e0; letter-spacing: 1.5px; }
  #modeSelect .sub { color: #6b5a44; font-size: 13px; margin-bottom: 18px; }
  .mode-card {
    width: min(92vw, 380px); padding: 16px 20px;
    background: linear-gradient(180deg, #fffdf5, #ffefd3);
    border-radius: 20px; border: 2px solid #f0cfa0;
    box-shadow: 0 8px 20px rgba(120, 80, 40, .2), inset 0 1px 0 rgba(255,255,255,.9);
    display: flex; align-items: center; gap: 14px;
    cursor: pointer; transition: transform .15s ease, box-shadow .15s ease;
  }
  .mode-card:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(120, 80, 40, .28); }
  .mode-icon { font-size: 36px; line-height: 1; flex: 0 0 auto; }
  .mode-text { flex: 1; }
  .mode-title { font-size: 18px; font-weight: 900; color: #5a3a1a; margin-bottom: 2px; }
  .mode-desc { font-size: 12px; color: #8a6a40; line-height: 1.3; }

  #game { height: 100vh; height: 100dvh; max-width: 520px; margin: 0 auto;
    display: flex; flex-direction: column; position: relative; background: #f7e8cf; overflow: hidden; }
  #topArea { flex: 0 0 auto; min-height: 260px; max-height: 50vh;
    position: relative; overflow: hidden;
    border-bottom-left-radius: 24px; border-bottom-right-radius: 24px;
    box-shadow: 0 8px 20px rgba(90, 120, 70, 0.22);
    background: linear-gradient(180deg, #b8e0f5 0%, #c8e8f0 15%, #d9f0e0 25%, #c8e8b0 32%, #a8d68e 45%, #86c269 100%); }
  #topArea.singleMode { height: 48vh; height: 48dvh; }
  #topArea.battleMode { height: 50vh; height: 50dvh; }
  .cloud { position: absolute; background: rgba(255,255,255,.95); border-radius: 999px; pointer-events: none; }
  .cloud::before, .cloud::after { content: ""; position: absolute; background: inherit; border-radius: 50%; }
  .cloud.c1 { top: 66px; left: 6%; width: 50px; height: 16px; }
  .cloud.c1::before { width: 24px; height: 24px; top: -13px; left: 6px; }
  .cloud.c1::after { width: 18px; height: 18px; top: -9px; left: 26px; }
  .cloud.c2 { top: 88px; left: 40%; width: 40px; height: 14px; opacity: .8; }
  .cloud.c2::before { width: 20px; height: 20px; top: -10px; left: 5px; }
  .cloud.c2::after { width: 14px; height: 14px; top: -7px; left: 21px; }
  #sun { position: absolute; top: 50px; right: 14px; width: 30px; height: 30px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff8c4, #ffd54f 55%, #f7b733);
    box-shadow: 0 0 26px rgba(255, 213, 79, .8); pointer-events: none; z-index: 2; }
  #grass { position: absolute; left: 0; right: 0; bottom: 0; height: 70%;
    background: linear-gradient(180deg, rgba(168, 214, 142, 0) 0%, #a8d68e 15%, #7dba63 100%); z-index: 1; pointer-events: none; }

  #hud { position: absolute; top: 0; left: 0; right: 0; height: 56px;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 6px 8px; z-index: 22; pointer-events: none; gap: 4px; }
  .hud-item { background: linear-gradient(180deg, #fffdf5, #ffeccf); border-radius: 999px;
    padding: 3px 10px 4px 8px; min-width: 78px; display: flex; align-items: center; gap: 5px;
    box-shadow: 0 3px 0 #d9a86c, 0 4px 10px rgba(120, 80, 40, .18);
    border: 1.5px solid #f0cfa0; }
  .hud-icon { font-size: 18px; line-height: 1; }
  .hud-text { display: flex; flex-direction: column; line-height: 1.05; }
  .hud-label { font-size: 8px; color: #a07a50; font-weight: 700; }
  .hud-value { font-size: 18px; font-weight: 900; color: #5a3a1a; font-variant-numeric: tabular-nums; }
  .hud-item.me { border-color: #7ed957; }
  .hud-item.opp { border-color: #ff7b8a; background: linear-gradient(180deg, #fff0f2, #ffe0e4); }
  .hud-item.opp .hud-value { color: #c0333f; }
  #scene { position: absolute; inset: 0; padding-top: 56px; z-index: 2; }

  #singleLayout { position: absolute; inset: 0; }
  #leftColumn { position: absolute; left: 6px; width: 70px;
    display: flex; flex-direction: column; align-items: center;
    gap: 6px; z-index: 30; pointer-events: none;
    max-height: calc(100vh - 40px); overflow: visible; }

  /* ============ 通用猫粮机样式（三个模式统一） ============ */
.cat-feeder {
  position: relative;
  width: 64px;
  height: 80px;
  filter: drop-shadow(0 5px 8px rgba(60, 90, 120, .3));
  transform-origin: center bottom;
  pointer-events: auto;
  z-index: 25;
  flex: 0 0 auto;
}
.cat-feeder .feeder-body {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, #fdf8f0 0%, #e8dcc8 50%, #d0bca0 100%);
  border-radius: 12px;
  box-shadow:
    inset 0 2px 0 rgba(255, 255, 255, 0.9),
    inset 0 -6px 12px rgba(80, 50, 20, 0.15),
    0 4px 10px rgba(90, 60, 30, 0.25);
  border: 1.5px solid rgba(200, 170, 130, 0.6);
  overflow: hidden;
}
.cat-feeder .feeder-body::before {
  content: "";
  position: absolute;
  top: 6px; left: 8px; right: 8px; height: 3px;
  background: rgba(255, 255, 255, 0.8);
  border-radius: 2px;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
}
.cat-feeder .feeder-spout {
  position: absolute;
  bottom: 12px; left: 50%;
  transform: translateX(-50%);
  width: 16px; height: 16px;
  background: radial-gradient(circle at 50% 30%, #3a2408, #1a0d02);
  border-radius: 50%;
  box-shadow:
    inset 0 3px 6px rgba(0, 0, 0, 0.8),
    0 1px 2px rgba(255, 255, 255, 0.3);
}
.cat-feeder .feeder-light {
  position: absolute;
  top: 12px; right: 10px;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #7ed957;
  box-shadow: 0 0 6px #7ed957;
  animation: feeder-light-breathe 2s ease-in-out infinite;
}
@keyframes feeder-light-breathe {
  0%, 100% { opacity: 1; box-shadow: 0 0 6px #7ed957; }
  50%      { opacity: .4; box-shadow: 0 0 2px #7ed957; }
}
  .cat-feeder .feeder-label {
    position: absolute;
    bottom: 28px; left: 0; right: 0;
    text-align: center;
    font-size: 9px;
    font-weight: 900;
    color: #6b4a28;
    letter-spacing: 0;
    text-shadow:
      0 1px 0 rgba(255, 255, 255, 0.95),
      0 0 2px rgba(255, 255, 255, 0.8);
  }
.cat-feeder.mini {
  width: 52px;
  height: 68px;
}
.cat-feeder.mini .feeder-spout {
  width: 13px; height: 13px; bottom: 10px;
}
.cat-feeder.mini .feeder-light {
  top: 10px; right: 8px; width: 5px; height: 5px;
}
  .cat-feeder.mini .feeder-label {
    bottom: 24px;
    font-size: 8px;
  }
.cat-feeder.producing {
  animation: feeder-produce .6s cubic-bezier(.34,1.56,.64,1);
}
@keyframes feeder-produce {
  0%   { transform: scale(1) translateY(0); }
  35%  { transform: scale(1.12) translateY(-3px); }
  70%  { transform: scale(0.98) translateY(1px); }
  100% { transform: scale(1) translateY(0); }
}
    /* 进度条轨道：内凹 + 刻度 + 外圈柔光 */
  #progressTrack { position: relative; width: 22px; height: 260px;
    background: linear-gradient(180deg, rgba(80,120,60,.12), rgba(80,120,60,.28));
    border-radius: 12px; border: 2px solid #a8d68e;
    overflow: visible; pointer-events: auto;
    box-shadow: inset 0 2px 6px rgba(60,90,40,.28), 0 2px 6px rgba(0,0,0,.08);
    transition: border-color .25s ease, box-shadow .25s ease; }
  /* 6 等分刻度线，每 3 份粮对应一格 */
  #progressTrack::before {
    content: ""; position: absolute; inset: 4px 3px;
    background-image: repeating-linear-gradient(0deg,
      transparent 0,
      transparent calc(100% / 6 - 1.5px),
      rgba(60,90,40,.22) calc(100% / 6 - 1.5px),
      rgba(60,90,40,.22) calc(100% / 6));
    border-radius: 8px; pointer-events: none; z-index: 3; }

  /* 进度填充：绿色渐变 + 内发光 + 柔光外溢 */
  #progressFill { position: absolute; left: 2px; right: 2px; bottom: 2px; height: 0%;
    background: linear-gradient(0deg, #3fa020 0%, #7ed957 40%, #b8f088 75%, #e0ffb8 100%);
    border-radius: 9px;
    transition: height .3s cubic-bezier(.3,.8,.4,1), background .3s ease;
    box-shadow: 0 0 12px rgba(126,217,87,.9), inset 0 0 10px rgba(255,255,255,.35);
    z-index: 2; overflow: hidden; }
  /* 填充上的流光：默认隐藏，只在满状态时才播放 */
  #progressFill::after {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 30%;
    background: linear-gradient(180deg, rgba(255,255,255,.7), transparent);
    pointer-events: none; opacity: 0; }
  #progressTrack.full #progressFill::after {
    animation: fillShine 1.8s ease-in-out infinite; }
  @keyframes fillShine {
    0%, 100% { opacity: 0;    transform: translateY(-100%); }
    50%      { opacity: .95;  transform: translateY(330%); }
  }
  /* 出粮瞬间的轨道闪光 */
  #progressTrack.feeding {
    animation: trackFeedFlash .5s ease-out;
  }
  @keyframes trackFeedFlash {
    0%   { filter: brightness(1); }
    30%  { filter: brightness(1.8) drop-shadow(0 0 8px rgba(126,217,87,.9)); }
    100% { filter: brightness(1); }
  }
  /* ======= 满状态：轨道发光脉冲 + 填充高亮 + 外圈光晕呼吸 ======= */
  #progressTrack.full {
    border-color: #7ed957;
    animation: trackFullPulse 1.4s ease-in-out infinite; }
  #progressTrack.full::after {
    content: ""; position: absolute; inset: -8px;
    border-radius: 18px; pointer-events: none; z-index: 0;
    background: radial-gradient(ellipse at center,
      rgba(126,217,87,.55) 0%, rgba(126,217,87,.15) 45%, transparent 70%);
    animation: fullGlow 1.4s ease-in-out infinite; }
  #progressTrack.full #progressFill {
    background: linear-gradient(0deg, #2f9010 0%, #7ed957 30%, #c8f5a0 65%, #f0ffd8 100%);
    box-shadow: 0 0 22px rgba(126,217,87,1),
                0 0 40px rgba(126,217,87,.6),
                inset 0 0 14px rgba(255,255,255,.6); }
  @keyframes trackFullPulse {
    0%, 100% { box-shadow: inset 0 2px 6px rgba(60,90,40,.28),
                          0 0 10px rgba(126,217,87,.5); }
    50%      { box-shadow: inset 0 2px 6px rgba(60,90,40,.28),
                          0 0 24px rgba(126,217,87,1),
                          0 0 40px rgba(126,217,87,.55); }
  }
  @keyframes fullGlow {
    0%, 100% { opacity: .55; transform: scale(1); }
    50%      { opacity: 1;   transform: scale(1.1); }
  }
  #trough { position: absolute; z-index: 9; height: 54px; border-radius: 24px;
    background: linear-gradient(180deg, #e8c9a0 0%, #c9a06a 50%, #a87c48 100%);
    padding: 2px;
    box-shadow: 0 4px 10px rgba(90,60,30,.35), inset 0 2px 0 rgba(255,255,255,.5); }
  .miniTroughInner {
    position: relative; width: 100%; height: 100%; border-radius: 22px;
    background: linear-gradient(180deg, #4a3828, #2a1c10); overflow: hidden;
    box-shadow: inset 0 2px 4px rgba(0,0,0,.5);
  }
  #troughCells {
    position: absolute;
    inset: 0;
    padding: 1px;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 2px;
  }

  /* ============ 喂食碗 ============ */
  /* 外层 cell 只是 grid 槽位 */
  .trough-cell {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    min-height: 0;
  }
  /* 白瓷圆碗 */
  .trough-cell .bowl {
    position: relative;
    aspect-ratio: 1 / 1;
    height: 100%;
    width: auto;
    max-width: 100%;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 38%, #ffffff 0%, #f2ead8 45%, #d8ccb0 78%, #b8a888 100%);
    box-shadow:
      inset 0 -2px 3px rgba(120,90,50,.28),
      inset 0 2px 3px rgba(255,255,255,.85),
      0 1px 2px rgba(0,0,0,.28);
    overflow: hidden;
    transition: box-shadow .25s ease;
  }
  /* 碗内凹陷 */
  .trough-cell .bowl::before {
    content: "";
    position: absolute;
    inset: 14%;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 42%, #4a3828 0%, #2a1c10 70%, #1a1008 100%);
    box-shadow: inset 0 2px 3px rgba(0,0,0,.75);
    pointer-events: none;
  }
  /* 散落的猫粮：12 颗小金圆点铺在碗里 */
  /* 散落的猫粮：分内中外三圈，独立控制 */
  .trough-cell .scatter {
    position: absolute;
    inset: 14%;
    border-radius: 50%;
    pointer-events: none;
    opacity: 0;
    transform: scale(0.6);
    transition: opacity .35s ease, transform .35s ease;
    z-index: 2;
    filter: drop-shadow(0 1px 1px rgba(80,50,10,.55));
  }
  /* 碗有粮：整体出现 */
  .trough-cell .bowl.filled .scatter {
    opacity: 1;
    transform: scale(1);
  }
  /* 外圈 10 颗 */
  .trough-cell .scatter.outer {
    background-image:
      radial-gradient(circle at 92% 50%, #e8b850 0 3px, transparent 3px),
      radial-gradient(circle at 84% 24%, #f5cc70 0 3px, transparent 3px),
      radial-gradient(circle at 63% 9%,  #e0a840 0 3px, transparent 3px),
      radial-gradient(circle at 37% 9%,  #ffd980 0 3px, transparent 3px),
      radial-gradient(circle at 16% 24%, #e8b850 0 3px, transparent 3px),
      radial-gradient(circle at 8%  50%, #f5cc70 0 3px, transparent 3px),
      radial-gradient(circle at 16% 76%, #e0a840 0 3px, transparent 3px),
      radial-gradient(circle at 37% 91%, #ffd980 0 3px, transparent 3px),
      radial-gradient(circle at 63% 91%, #e8b850 0 3px, transparent 3px),
      radial-gradient(circle at 84% 76%, #f5cc70 0 3px, transparent 3px);
  }
  /* 中圈 6 颗 */
  .trough-cell .scatter.mid {
    background-image:
      radial-gradient(circle at 80% 50%, #e0a840 0 3px, transparent 3px),
      radial-gradient(circle at 65% 24%, #ffd980 0 3px, transparent 3px),
      radial-gradient(circle at 35% 24%, #e8b850 0 3px, transparent 3px),
      radial-gradient(circle at 20% 50%, #f5cc70 0 3px, transparent 3px),
      radial-gradient(circle at 35% 76%, #e0a840 0 3px, transparent 3px),
      radial-gradient(circle at 65% 76%, #ffd980 0 3px, transparent 3px);
  }
  /* 内圈 4 颗 */
  .trough-cell .scatter.inner {
    background-image:
      radial-gradient(circle at 65% 50%, #ffd980 0 3px, transparent 3px),
      radial-gradient(circle at 50% 65%, #e8b850 0 3px, transparent 3px),
      radial-gradient(circle at 35% 50%, #f5cc70 0 3px, transparent 3px),
      radial-gradient(circle at 50% 35%, #e0a840 0 3px, transparent 3px);
  }
  /* 吃粮进度：外圈先没，然后中圈 */
  .trough-cell .bowl.filled.eaten-1 .scatter.outer { opacity: 0; }
  .trough-cell .bowl.filled.eaten-2 .scatter.outer,
  .trough-cell .bowl.filled.eaten-2 .scatter.mid   { opacity: 0; }
  /* 有粮时：散落颗粒放大淡入 */
  .trough-cell .bowl.filled .bowl-scatter {
    opacity: 1;
    transform: scale(1);
  }
  /* 有粮时碗沿金色描边 */
  .trough-cell .bowl.filled {
    box-shadow:
      inset 0 -2px 3px rgba(120,90,50,.28),
      inset 0 2px 3px rgba(255,255,255,.85),
      0 0 0 1.5px rgba(255,200,80,.85),
      0 0 7px rgba(255,200,80,.55);
  }

  /* ============ 大猫窝：露天猫抓板造型 ============ */
  /* ============ 大猫窝：藤编碗形 ============ */
  #bigHome {
    position: absolute; z-index: 5;
    border-radius: 50% / 42%;
    /* 外圈藤编：一圈圈的编织绳纹 */
    background: repeating-radial-gradient(ellipse at 50% 50%,
      #d8b080 0 2.5px,
      #a87c48 2.5px 4px,
      #c9a06a 4px 6px,
      #e0b888 6px 8px);
    box-shadow:
      0 10px 24px rgba(90,60,30,.42),
      inset 0 -8px 14px rgba(80,40,10,.38),
      inset 0 8px 12px rgba(255,220,160,.4);
    overflow: visible;
  }
  /* 内圈软垫 */
  #bigHomeInner {
    position: absolute;
    inset: 16%;
    border-radius: 50% / 45%;
    background: radial-gradient(ellipse at 50% 38%,
      #fff8e0 0%,
      #f5e8c8 45%,
      #e8d0a0 85%,
      #d8bc88 100%);
    box-shadow:
      inset 0 10px 18px rgba(140,90,40,.4),
      inset 0 -6px 10px rgba(255,255,255,.45),
      0 0 0 3px rgba(150,100,50,.3);
    overflow: visible;
  }
  /* 垫子上的蓬松高光 */
  #bigHomeCushion {
    position: absolute;
    inset: 22%;
    border-radius: 50%;
    background:
      radial-gradient(ellipse at 38% 32%, rgba(255,255,255,.55) 0%, transparent 55%),
      radial-gradient(ellipse at 65% 72%, rgba(180,140,90,.2) 0%, transparent 60%);
    pointer-events: none;
  }
  #bigHomeLabel {
    position: absolute;
    top: 2%; left: 0; right: 0;
    text-align: center;
    font-size: 10px; font-weight: 900;
    color: #7a4a1a;
    letter-spacing: 1.5px; z-index: 3;
    text-shadow:
      0 1px 0 rgba(255,240,200,.95),
      0 -1px 1px rgba(120,80,40,.4);
  }
  /* ============ 对战模式布局 ============ */
  #battleLayout { position: absolute; inset: 0; display: none; }
  #topArea.battleMode #battleLayout { display: block; }
  #topArea.singleMode #singleLayout { display: block; }
  #topArea.singleMode #battleLayout { display: none; }
  #topArea.battleMode #singleLayout { display: none; }

  #battleHud {
    position: absolute; top: 0; left: 0; right: 0; height: 52px;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 4px 6px; z-index: 22; gap: 4px;
  }

  /* 中栏：等待区（只有 2 列猫的宽度，居中） */
  #battlePool {
    position: absolute;
    left: 50%; transform: translateX(-50%);
    width: 140px;
    top: 58px;
    height: calc(48% - 30px);
    background: rgba(255, 255, 255, .35);
    border: 2px dashed rgba(255, 255, 255, .8);
    border-radius: 16px; z-index: 7;
    box-shadow: inset 0 2px 8px rgba(90, 120, 70, .15);
    overflow: hidden;
  }
  #battlePoolLabel {
    position: absolute; top: -2px; left: 50%; transform: translateX(-50%);
    background: linear-gradient(180deg, #fffdf5, #ffeccf);
    padding: 1px 8px; border-radius: 8px;
    font-size: 9px; font-weight: 900; color: #8a6a40;
    border: 1.5px solid #f0cfa0; white-space: nowrap;
    box-shadow: 0 1px 3px rgba(120, 80, 40, .15);
    z-index: 3;
  }

  /* 左栏：宽 = (总宽 - 中栏) / 2 */
  #battleLeftCol {
    position: absolute;
    left: 6px;
    right: calc(50% + 76px);
    top: 58px; bottom: 8px;
    display: flex; flex-direction: column;
    gap: 0;
    z-index: 8;
    overflow: visible;
  }
  /* 只让喂食盆横向延伸，猫粮机 / 库存保持原样 */
  #battleLeftCol > .miniTrough {
    width: calc(100% + 76px);
    flex-shrink: 0;
  }
  #battleLeftCol > .cat-feeder.mini {
    align-self: center;
    flex: 0 0 auto;
    width: 52px;
    height: 68px;
    max-width: 52px;
    max-height: 68px;
  }
  #battleRightCol {
    position: absolute;
    left: calc(50% + 76px);
    right: 6px;
    top: 58px; bottom: 8px;
    display: flex; flex-direction: column;
    gap: 0;
    z-index: 8;
    overflow: visible;
  }
  #battleRightCol > .miniTrough {
    width: calc(100% + 76px);
    flex-shrink: 0;
    margin-left: -76px;
  }
  #battleRightCol > .cat-feeder.mini {
    align-self: center;
    flex: 0 0 auto;
    width: 52px;
    height: 68px;
    max-width: 52px;
    max-height: 68px;
  }
  #battleLeftCol > .battleSpacer,
  #battleRightCol > .battleSpacer { flex: 1 1 auto; }

  #battleCats { position: absolute; inset: 0; z-index: 10; pointer-events: none; }

  /* 迷你猫窝 */

<script>
(function () {
  "use strict";

  const SoundManager = (function () {
    let ctx = null, enabled = true, masterGain = null;
    function init() {
      if (ctx) return;
      try {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = ctx.createGain();
        masterGain.gain.value = 0.35;
        masterGain.connect(ctx.destination);
      } catch (e) { enabled = false; }
    }
    function tone(freq, dur, type, vol, delay) {
      type = type || 'sine'; vol = vol || 0.5; delay = delay || 0;
      if (!ctx || !enabled) return;
      const t0 = ctx.currentTime + delay;
      const osc = ctx.createOscillator(); const g = ctx.createGain();
      osc.type = type; osc.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(vol, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      osc.connect(g); g.connect(masterGain);
      osc.start(t0); osc.stop(t0 + dur + 0.02);
    }
    function slide(f1, f2, dur, type, vol, delay) {
      type = type || 'sine'; vol = vol || 0.5; delay = delay || 0;
      if (!ctx || !enabled) return;
      const t0 = ctx.currentTime + delay;
      const osc = ctx.createOscillator(); const g = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(f1, t0);
      osc.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(vol, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      osc.connect(g); g.connect(masterGain);
      osc.start(t0); osc.stop(t0 + dur + 0.02);
    }
    return {
      init,
      match(n) { tone(660 * Math.pow(1.12, Math.min(n - 3, 3)), 0.12, 'triangle', 0.45); },
      chain(l) { const steps = [0, 2, 4, 7, 9, 12]; const freq = 523.25 * Math.pow(2, steps[Math.min(l, 5)] / 12);
        tone(freq, 0.16, 'triangle', 0.5); },
      feed() { tone(120, 0.06, 'square', 0.4); tone(180, 0.08, 'square', 0.3, 0.06); tone(90, 0.1, 'sine', 0.35, 0.12); },
      meow() { slide(880, 660, 0.18, 'sine', 0.35); slide(1320, 990, 0.16, 'triangle', 0.15, 0.03); },
      returnHome() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, 0.14, 'triangle', 0.4, i * 0.08)); },
      invalid() { tone(220, 0.12, 'sawtooth', 0.3); tone(180, 0.14, 'sawtooth', 0.25, 0.05); },
      start() { [523.25, 659.25, 783.99].forEach((f, i) => tone(f, 0.16, 'triangle', 0.5, i * 0.1)); },
      end() { [783.99, 659.25, 523.25, 392].forEach((f, i) => tone(f, 0.22, 'triangle', 0.4, i * 0.12)); },
      tick() { tone(880, 0.05, 'square', 0.2); }
    };
  })();

  const TILE_EMOJI = { paw: "🐾", fish: "🐟", yarn: "🧶", cookie: "🍪", milk: "🥛" };
  const TILE_TYPES = ["paw", "fish", "yarn", "cookie", "milk"];
  const CAT_PALETTES = [
    { body: "#f5a352", dark: "#d97d2e", belly: "#ffe8c7", inner: "#f5a8b8", blush: "#ffb8a0" },
    { body: "#c5cdd6", dark: "#96a1ad", belly: "#f2f5f8", inner: "#f0a6b8", blush: "#ffc0c8" },
    { body: "#a87b5b", dark: "#7d563a", belly: "#f0dcc4", inner: "#e9a5b5", blush: "#e8a898" },
    { body: "#f6f2ea", dark: "#cfc8bc", belly: "#ffffff", inner: "#f0a6b8", blush: "#ffd0d0" },
    { body: "#8a7c6a", dark: "#6a5e50", belly: "#d9cfbf", inner: "#e9a5b5", blush: "#d0a898" }
  ];

  // 时长常量
  const DUR = {
    walkingToFood: 1300,
    eating: 4500,
    cleaning: 4500,
    happy: 3000,        // ← 改成 3 秒
    walkingToHome: 1700,
    sleepFade: 2000
  };

  const $ = (id) => document.getElementById(id);
  const modeSelect = $('modeSelect'), gameRoot = $('game');
  const topArea = $('topArea'), boardArea = $('boardArea'), leftColumn = $('leftColumn');
  const boardEl = $('board');
  const timeText = $('timeText'), returnText = $('returnText');
  const scoreText = $('scoreText');
  const battleTimeText = $('battleTimeText'), myReturnText = $('myReturnText');
  const oppReturnText = $('oppReturnText'), oppNameLabel = $('oppNameLabel');
  const myMiniHomeCats = $('myMiniHomeCats'), oppMiniHomeCats = $('oppMiniHomeCats');
  const battleCatsEl = $('battleCats');
  const waitOverlay = $('waitOverlay'), waitTimer = $('waitTimer');
  const resultOverlay = $('resultOverlay');
  const startBanner = $('startBanner');

  let mode = 'single';
  let gameActive = false;
  let board = [], selected = null, isAnimating = false;
  let pendingSwap = null;
  let score = 0, foodStock = 0, foodProgress = 0;
  let timeLeft = 90, returnedCats = 0;
  let cats = [], catIdSeq = 1;
  let myBowlState = [];
  let oppBowlState = [];

  function makeEmptyBowls() {
    return Array.from({ length: 6 }, () => ({ filled: false, eaten: 0, eaterCatId: null }));
  }
  let tickSecond = -1;
  const timers = { countdown: null, gameTick: null, spawnTimer: null };

  let opponent = { name: '对手', score: 0, foodStock: 0, returnedCats: 0, isBot: false,
    board: [], foodProgress: 0 };
  let aiTimer = null;
  let ws = null, myPlayerId = null, roomId = null;
  let waitStartTime = 0, waitTimerId = null;

  const POS = { W: 0, H: 0, eating: [], waiting: [], sleepSpots: [] };
  const BATTLE_POS = {
    pool: [],       // 中栏等待位
    myEat: [],      // 我的进食位
    oppEat: [],     // 对手的进食位
    myHome: null,   // 我的猫窝区域
    oppHome: null,  // 对手的猫窝区域
    myHomeSlot: 0,  // 我的猫窝内已睡猫数
    oppHomeSlot: 0
  };

  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const rand = (a, b) => a + Math.random() * (b - a);
  function getTileEl(r, c) { return boardEl.querySelector(`.tile[data-r="${r}"][data-c="${c}"]`); }

  function clearTimers() {
    if (timers.countdown) clearInterval(timers.countdown);
    if (timers.gameTick) clearInterval(timers.gameTick);
    if (timers.spawnTimer) clearInterval(timers.spawnTimer);
    if (aiTimer) { clearInterval(aiTimer); aiTimer = null; }
    if (sharedSpawnTimer) { clearInterval(sharedSpawnTimer); sharedSpawnTimer = null; }
    timers.countdown = timers.gameTick = timers.spawnTimer = null;
  }

  // ===================== 棋盘逻辑（与之前相同） =====================
  function swap(b, r1, c1, r2, c2) { const t = b[r1][c1]; b[r1][c1] = b[r2][c2]; b[r2][c2] = t; }
  function randomTile() { return TILE_TYPES[Math.floor(Math.random() * TILE_TYPES.length)]; }
  function findMatches(b) {
    const groups = []; const size = 8;
    for (let r = 0; r < size; r++) {
      let c = 0;
      while (c < size) {
        const t = b[r][c]; let len = 1;
        while (c + len < size && b[r][c + len] === t) len++;
        if (len >= 3) { const cells = []; for (let i = 0; i < len; i++) cells.push([r, c + i]);
          groups.push({ cells, length: len }); }
        c += len;
      }
    }
    for (let c = 0; c < size; c++) {
      let r = 0;
      while (r < size) {
        const t = b[r][c]; let len = 1;
        while (r + len < size && b[r + len][c] === t) len++;
        if (len >= 3) { const cells = []; for (let i = 0; i < len; i++) cells.push([r + i, c]);
          groups.push({ cells, length: len }); }
        r += len;
      }
    }
    return groups;
  }
  function hasMove(b) {
    const size = 8;
    for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) {
      if (c < size - 1) { swap(b, r, c, r, c + 1); const ok = findMatches(b).length > 0;
        swap(b, r, c, r, c + 1); if (ok) return true; }
      if (r < size - 1) { swap(b, r, c, r + 1, c); const ok = findMatches(b).length > 0;
        swap(b, r, c, r + 1, c); if (ok) return true; }
    }
    return false;
  }
  function generateBoard() {
    for (let attempt = 0; attempt < 200; attempt++) {
      const b = Array.from({ length: 8 }, () => Array(8).fill(null));
      for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
        const forbid = new Set();
        if (c >= 2 && b[r][c - 1] === b[r][c - 2]) forbid.add(b[r][c - 1]);
        if (r >= 2 && b[r - 1][c] === b[r - 2][c]) forbid.add(b[r - 1][c]);
        const opts = TILE_TYPES.filter(t => !forbid.has(t));
        b[r][c] = opts[Math.floor(Math.random() * opts.length)];
      }
      if (hasMove(b)) return b;
    }
    return Array.from({ length: 8 }, () => Array.from({ length: 8 }, () => randomTile()));
  }
  function applyGravity(b) {
    const size = 8;
    for (let c = 0; c < size; c++) {
      let write = size - 1;
      for (let r = size - 1; r >= 0; r--) {
        if (b[r][c] !== null) { b[write][c] = b[r][c];
          if (write !== r) b[r][c] = null; write--; }
      }
      while (write >= 0) { b[write][c] = randomTile(); write--; }
    }
  }
  function scoreForLength(len) {
    if (len === 3) return 20;
    if (len === 4) return 30;
    if (len === 5) return 40;
    if (len === 6) return 40;
    return 40 + (len - 6) * 8;
  }

  function renderBoard() {
    boardEl.innerHTML = "";
    for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
      const tile = document.createElement("div");
      tile.className = "tile";
      tile.dataset.r = r; tile.dataset.c = c;
      tile.dataset.type = board[r][c];
      tile.textContent = TILE_EMOJI[board[r][c]];
      tile.addEventListener("click", () => onTileClick(r, c));
      boardEl.appendChild(tile);
    }
    updateSelection();
    resizeBoard();
  }
  function updateSelection() {
    boardEl.querySelectorAll(".tile.selected").forEach(el => el.classList.remove("selected"));
    if (selected) { const el = getTileEl(selected.r, selected.c); if (el) el.classList.add("selected"); }
  }
  function resizeBoard() {
    const rect = boardArea.getBoundingClientRect();
    const style = getComputedStyle(boardArea);
    const padLeft = parseFloat(style.paddingLeft) || 0;
    const padRight = parseFloat(style.paddingRight) || 0;
    const padTop = parseFloat(style.paddingTop) || 0;
    const padBottom = parseFloat(style.paddingBottom) || 0;
    const availW = rect.width - padLeft - padRight - 4;
    const used = 40;
    const availH = rect.height - padTop - padBottom - used;
    const size = Math.max(140, Math.min(availW, availH));
    boardEl.style.width = size + "px";
    boardEl.style.height = size + "px";
    boardEl.style.setProperty("--tile-size", size / 8 + "px");
    const pt = document.getElementById('progressTrack');
    if (pt) pt.style.height = size + "px";
  }

  async function onTileClick(r, c) {
    SoundManager.init();
    if (!gameActive || isAnimating || timeLeft <= 0) return;
    if (mode === 'online') {
      if (selected === null) { selected = { r, c }; updateSelection(); return; }
      const s = selected;
      if (s.r === r && s.c === c) { selected = null; updateSelection(); return; }
      if (Math.abs(s.r - r) + Math.abs(s.c - c) !== 1) { selected = { r, c }; updateSelection(); return; }
      selected = null; updateSelection();
      if (isAnimating) return;
      isAnimating = true;
      pendingSwap = { r1: s.r, c1: s.c, r2: r, c2: c };
      sendWS({ type: 'swap', r1: s.r, c1: s.c, r2: r, c2: c });
      return;
    }
    if (selected === null) { selected = { r, c }; updateSelection(); return; }
    const s = selected;
    if (s.r === r && s.c === c) { selected = null; updateSelection(); return; }
    if (Math.abs(s.r - r) + Math.abs(s.c - c) !== 1) { selected = { r, c }; updateSelection(); return; }
    selected = null; updateSelection();
    await trySwap(s.r, s.c, r, c);
  }

  async function trySwap(r1, c1, r2, c2) {
    if (!gameActive) return;
    isAnimating = true;

    // 清除选中
    selected = null;
    updateSelection();

    const el1 = getTileEl(r1, c1);
    const el2 = getTileEl(r2, c2);
    if (!el1 || !el2) { isAnimating = false; return; }

    // === 交换动画：两个方块在视觉上飞向对方 ===
    const rect1 = el1.getBoundingClientRect();
    const rect2 = el2.getBoundingClientRect();
    const dx = rect2.left - rect1.left;
    const dy = rect2.top - rect1.top;

    el1.style.transition = 'transform .2s cubic-bezier(.4,0,.2,1)';
    el2.style.transition = 'transform .2s cubic-bezier(.4,0,.2,1)';
    el1.style.zIndex = '5';
    el2.style.zIndex = '5';
    el1.style.transform = `translate(${dx}px, ${dy}px)`;
    el2.style.transform = `translate(${-dx}px, ${-dy}px)`;
    await sleep(200);

    // === 数据层交换，判断是否能消除 ===
    swap(board, r1, c1, r2, c2);
    const first = findMatches(board);

    if (first.length === 0) {
      // 不能消除：动画返位，数据也还原
      swap(board, r1, c1, r2, c2);
      el1.style.transform = '';
      el2.style.transform = '';
      await sleep(200);
      el1.style.transition = '';
      el2.style.transition = '';
      el1.style.zIndex = '';
      el2.style.zIndex = '';
      SoundManager.invalid();
      el1.classList.add("invalid");
      el2.classList.add("invalid");
      setTimeout(() => {
        el1.classList.remove("invalid");
        el2.classList.remove("invalid");
      }, 320);
      isAnimating = false;
      return;
    }

    // 交换成功：清掉 transform，然后直接 renderBoard 全量重建，
    // DOM 与 board 数据完全同步，后续 getTileEl / getBoundingClientRect 一定正确。
    el1.style.transition = 'none';
    el2.style.transition = 'none';
    el1.style.transform = '';
    el2.style.transform = '';
    el1.style.zIndex = '';
    el2.style.zIndex = '';
    renderBoard();

    // === 连锁消除 ===
    let chainLevel = 0, current = first;
    while (current.length > 0) {
      const removeSet = new Set(); let base = 0;
      for (const g of current) {
        base += scoreForLength(g.length);
        for (const [r, c] of g.cells) removeSet.add(`${r},${c}`);
      }
      const chainMul = 1 + Math.min(chainLevel * 0.25, 0.75);
      const gained = Math.round(base * chainMul);
      addScore(gained);
      SoundManager.match(current[0].length);

      // 粒子飞向进度条
      const cells = [...removeSet].map(k => k.split(",").map(Number));
      spawnParticles(cells);
      shakeBoard();

      // 消除动画：先移除 drop-in，强制 reflow，再加 pop
      // 否则 CSS 里 .tile.drop-in 定义在 .tile.pop 之后，会覆盖 pop 动画
      removeSet.forEach(k => {
        const [r, c] = k.split(",").map(Number);
        const el = getTileEl(r, c);
        if (el) {
          el.classList.remove("drop-in");
          void el.offsetWidth;
          el.classList.add("pop");
        }
      });
      await sleep(360);

      // 数据层消除 + 重力
      removeSet.forEach(k => {
        const [r, c] = k.split(",").map(Number);
        board[r][c] = null;
      });
      applyGravity(board);
      renderBoard();

      // 下落动画：每一列，从被消除位置的最下方一路到顶部，所有格子都加 drop-in
      // 不再判断"值是否变化"，因为即使图案恰好相同，视觉上也应看到下落
      const dropCells = new Set();
      for (const k of removeSet) {
        const [r, c] = k.split(",").map(Number);
        for (let rr = 0; rr <= r; rr++) dropCells.add(`${rr},${c}`);
      }
      dropCells.forEach(key => {
        const [r, c] = key.split(",").map(Number);
        const el = getTileEl(r, c);
        if (el) el.classList.add("drop-in");
      });
      await sleep(300);

      current = findMatches(board); chainLevel++;
      if (current.length > 0) { showChainBanner(chainLevel); await sleep(360); }
    }

    isAnimating = false;
    updateHUD();
  }
  // ============ 联机模式的交换动画（复用单机的视觉，不动逻辑） ============
  async function playOnlineSwap(sw, events) {
    if (!gameActive) return;
    const { r1, c1, r2, c2 } = sw;
    const el1 = getTileEl(r1, c1);
    const el2 = getTileEl(r2, c2);
    if (!el1 || !el2) return;

    // === 1) 交换动画：两格飞向对方 ===
    const rect1 = el1.getBoundingClientRect();
    const rect2 = el2.getBoundingClientRect();
    const dx = rect2.left - rect1.left;
    const dy = rect2.top - rect1.top;

    el1.style.transition = 'transform .2s cubic-bezier(.4,0,.2,1)';
    el2.style.transition = 'transform .2s cubic-bezier(.4,0,.2,1)';
    el1.style.zIndex = '5';
    el2.style.zIndex = '5';
    el1.style.transform = `translate(${dx}px, ${dy}px)`;
    el2.style.transform = `translate(${-dx}px, ${-dy}px)`;
    await sleep(200);

    el1.style.transition = 'none';
    el2.style.transition = 'none';
    el1.style.transform = '';
    el2.style.transform = '';
    el1.style.zIndex = '';
    el2.style.zIndex = '';

    // 本地数据层交换一下（视觉上和动画一致）
    swap(board, r1, c1, r2, c2);
    renderBoard();

    // === 2) 按服务端的 events 逐轮播放消除 + 下落 ===
    for (const ev of events) {
      if (ev.kind !== 'match') continue;

      // 2a) pop 动画
      ev.cells.forEach(([r, c]) => {
        const el = getTileEl(r, c);
        if (el) {
          el.classList.remove("drop-in");
          void el.offsetWidth;
          el.classList.add("pop");
        }
      });
      spawnParticles(ev.cells);
      shakeBoard();
      SoundManager.match(ev.length || 3);
      showFloatingScore(ev.gain || 0);
      if (ev.chain > 0) showChainBanner(ev.chain);
      await sleep(360);

      // 2b) 用服务端的 boardAfter 替换本地 board，保证和服务端一致
      if (ev.boardAfter) {
        board = ev.boardAfter;
      } else {
        // 兜底：本地移除 + 重力
        ev.cells.forEach(([r, c]) => { board[r][c] = null; });
        applyGravity(board);
      }
      renderBoard();

      // 2c) drop-in 动画
      const dropCells = new Set();
      for (const [r, c] of ev.cells) {
        for (let rr = 0; rr <= r; rr++) dropCells.add(`${rr},${c}`);
      }
      dropCells.forEach(key => {
        const [r, c] = key.split(",").map(Number);
        const el = getTileEl(r, c);
        if (el) el.classList.add("drop-in");
      });
      await sleep(300);
    }
  }
  function addScore(points) {
    score += points; foodProgress += points;
    let produced = false;
    while (foodProgress >= 90 && foodStock < 6) {
      // 先找可用的碗，找不到就不扣进度、不增 foodStock
      const b = myBowlState.find(b => !b.filled && !b.eaterCatId);
      if (!b) break;
      foodProgress -= 90; produced = true;
      foodStock++;
      b.filled = true; b.eaten = 0; b.eaterCatId = null;
    }
    if (produced) triggerFeeder();
    updateProgressBar();
    updateHUD();
    showFloatingScore(points);
  }
    // ============ 猫粮机统一逻辑 ============
  function triggerFeeder() {
    SoundManager.feed();

    let machineEl, troughEl;
    if (mode === 'single') {
      machineEl = document.getElementById('foodMachine');
      troughEl = document.getElementById('trough');
    } else {
      machineEl = document.getElementById('myMiniMachine');

      if (troughEl) {

        let bowlIdx = 0;
        for (let i = 0; i < 6; i++) {
          if (myBowlState[i] && myBowlState[i].filled && !myBowlState[i].eaterCatId) bowlIdx = i;
        }
        const targetBowl = bowls[bowlIdx];
        if (targetBowl) spawnKibbles(machineEl, targetBowl, 5);

    }

    // 出粮瞬间：轨道闪一下，不再临时冲满
    const pt = document.getElementById('progressTrack');
    if (pt) {

    }

  }

  function spawnKibbles(machineEl, targetBowl, count) {
    if (!machineEl || !targetBowl) return;
    const spoutEl = machineEl.querySelector('.feeder-spout');
    if (!spoutEl) return;

    const spoutRect = spoutEl.getBoundingClientRect();
    const bowlRect = targetBowl.getBoundingClientRect();
    const startX = spoutRect.left + spoutRect.width / 2;
    const startY = spoutRect.bottom;

    for (let i = 0; i < count; i++) {
      setTimeout(() => {
        const kibble = document.createElement('div');
        kibble.className = 'kibble';
        document.body.appendChild(kibble);

        // 落点：盆内中下部
        const endX = bowlRect.left + bowlRect.width * (0.3 + Math.random() * 0.4);
        const endY = bowlRect.top + bowlRect.height * 0.55;
        const duration = 450 + Math.random() * 150;
        const startTime = performance.now();
        const rotation = (Math.random() > 0.5 ? 1 : -1) * (240 + Math.random() * 240);

        function step(now) {
          const t = Math.min(1, (now - startTime) / duration);
          const x = startX + (endX - startX) * t;
          const y = startY + (endY - startY) * (t * t);   // 重力加速
          const rot = t * rotation;
          kibble.style.transform = `translate(${x}px, ${y}px) translate(-50%, -50%) rotate(${rot}deg)`;
          if (t < 1) {
            requestAnimationFrame(step);
          } else {
            // 落地：淡出 120ms，不做回弹、不生成灰尘
            kibble.animate([
              { opacity: 1 },
              { opacity: 0 }
            ], { duration: 120, easing: 'ease-out' });
            setTimeout(() => kibble.remove(), 130);
          }
        }
        requestAnimationFrame(step);
      }, i * 65);
    }
  }

  function updateProgressBar() {
    const pt = document.getElementById('progressTrack');
    const pf = document.getElementById('progressFill');
    if (!pt || !pf) return;
    // 单次出粮进度：foodProgress / 90
    // 粮仓满（foodStock >= 6）时进度条保持满格 + 发光
    let pct;
    if (foodStock >= 6) {
      pct = 100;
    } else {
      pct = Math.min(100, (foodProgress / 90) * 100);
    }
    pf.style.height = pct + "%";
    pt.classList.toggle("full", foodStock >= 6);
  }



  function spawnParticles(cells) {
    if (!cells || !cells.length) return;
    // 粒子飞向左侧进度条
    const target = document.getElementById('progressTrack');
    if (!target) return;
    const tRect = target.getBoundingClientRect();
    const endX = tRect.left + tRect.width / 2;
    const endY = tRect.top + 20;

    cells.forEach(([r, c], idx) => {
      const el = getTileEl(r, c); if (!el) return;
      const rect = el.getBoundingClientRect();
      const sx = rect.left + rect.width / 2;
      const sy = rect.top + rect.height / 2;

      // 每个格子生成 3 个粒子，错开时间出现，更密集更明显
      for (let k = 0; k < 3; k++) {
        setTimeout(() => {
          const p = document.createElement("div");
          p.className = "feed-particle";
          p.style.left = sx + "px";
          p.style.top = sy + "px";
          const jx = (Math.random() - 0.5) * 18;
          const jy = (Math.random() - 0.5) * 18;
          p.style.transform = `translate(calc(-50% + ${jx}px), calc(-50% + ${jy}px)) scale(1.2)`;
          document.body.appendChild(p);
          requestAnimationFrame(() => {
            const dx = endX - sx + (Math.random() - 0.5) * 16;
            const dy = endY - sy + (Math.random() - 0.5) * 16;
            p.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0.35)`;
            p.style.opacity = "0";
          });
          setTimeout(() => p.remove(), 850);
        }, idx * 25 + k * 55);
      }
    });
  }

    // ============ 排行榜 ============
  const LB_KEY_BEST = 'cat_match3_best_v2';
  const LB_KEY_NAME = 'cat_match3_name';

  function getLocalBest() {
    try { const raw = localStorage.getItem(LB_KEY_BEST); if (raw) return JSON.parse(raw); } catch (e) {}
    return { returnedCats: 0, maxScore: 0 };
  }
  function setLocalBest(b) {
    try { localStorage.setItem(LB_KEY_BEST, JSON.stringify(b)); } catch (e) {}
  }
  function getSavedName() {
    try { return localStorage.getItem(LB_KEY_NAME) || ''; } catch (e) { return ''; }
  }
  function saveName(n) {
    try { localStorage.setItem(LB_KEY_NAME, n); } catch (e) {}
  }
  function wsUrlForLeaderboard() {
    if (location.protocol === 'file:') return 'ws://localhost:8080';
    return 'wss://sanxiao.onrender.com';
  }

  function requestLeaderboard() {
    return new Promise((resolve, reject) => {
      let s;
      try { s = new WebSocket(wsUrlForLeaderboard()); } catch (e) { return reject(e); }
      const t = setTimeout(() => { try { s.close(); } catch (e) {} reject(new Error('连接超时')); }, 12000);
      s.onopen = () => { s.send(JSON.stringify({ type: 'get_leaderboard' })); };
      s.onmessage = (e) => {
        try {
          const m = JSON.parse(e.data);
          if (m.type === 'leaderboard') {
            clearTimeout(t); try { s.close(); } catch (e) {}
            resolve(m.list || []);
          }
        } catch (err) {}
      };
      s.onerror = () => { clearTimeout(t); reject(new Error('连接失败')); };
    });
  }

  function uploadScoreToServer(name, returnedCats, score) {
    return new Promise((resolve, reject) => {
      let s;
      try { s = new WebSocket(wsUrlForLeaderboard()); } catch (e) { return reject(e); }
      const t = setTimeout(() => { try { s.close(); } catch (e) {} reject(new Error('连接超时')); }, 12000);
      s.onopen = () => { s.send(JSON.stringify({ type: 'submit_score', name, returnedCats, score })); };
      s.onmessage = (e) => {
        try {
          const m = JSON.parse(e.data);
          if (m.type === 'score_result') {
            clearTimeout(t); try { s.close(); } catch (e) {}
            resolve(m);
          }
        } catch (err) {}
      };
      s.onerror = () => { clearTimeout(t); reject(new Error('连接失败')); };
    });
  }

    if (isNew) {
      setLocalBest({

  function renderLeaderboard(list) {
    const content = document.getElementById('leaderboardContent');
    const myRecEl = document.getElementById('leaderboardMyRecord');
    const myName = getSavedName();

    // 1) 前 10 名
    const top10 = (list || []).slice(0, 10);
    if (top10.length === 0) {
      content.innerHTML = '<div class="lb-empty-virtual"><span class="star">🏆</span>虚位以待<br><span style="font-size:12px;font-weight:600;">快来成为第一个上榜的玩家吧！</span></div>';
    } else {
      const rows = ['<div class="lb-row head"><div class="rank">#</div><div class="name">玩家</div><div class="val">回窝</div><div class="val2">积分</div></div>'];
      top10.forEach((entry, idx) => {
        let rankCls = '';
        if (idx === 0) rankCls = 'top1';
        else if (idx === 1) rankCls = 'top2';
        else if (idx === 2) rankCls = 'top3';
        const isMe = myName && entry.name === myName;
        const rowCls = isMe ? ' me' : '';
        const name = (entry.name || '匿名').slice(0, 16);
        // 兼容旧数据：老记录用 maxFoodStock 字段，新记录用 score
        const scoreVal = (typeof entry.score === 'number') ? entry.score
                       : (typeof entry.maxFoodStock === 'number') ? entry.maxFoodStock : 0;
        rows.push(`<div class="lb-row${rowCls}">
          <div class="rank ${rankCls}">${idx + 1}</div>
          <div class="name">${escapeHtml(name)}${isMe ? ' 👈' : ''}</div>
          <div class="val">${entry.returnedCats || 0}</div>
          <div class="val2">${scoreVal}</div>
        </div>`);
      });
      content.innerHTML = rows.join('');
    }

    // 2) 底部显示玩家自己的最佳记录
    if (!myRecEl) return;
    const myEntry = myName ? (list || []).find(e => e.name === myName) : null;
    const localBest = getLocalBest();
    let recReturns = localBest.returnedCats || 0;
    let recScore = localBest.maxScore || 0;
    let rankText = '';
    if (myEntry) {
      recReturns = Math.max(recReturns, myEntry.returnedCats || 0);
      const entryScore = (typeof myEntry.score === 'number') ? myEntry.score
                       : (typeof myEntry.maxFoodStock === 'number') ? myEntry.maxFoodStock : 0;
      recScore = Math.max(recScore, entryScore);
      const rank = (list || []).findIndex(e => e.name === myName) + 1;
      rankText = rank > 0 ? ` · 排名第 ${rank}` : '';
    }
    if (!myName) {
      myRecEl.innerHTML = `
        <div class="rec-title">📌 我的最佳记录</div>
        <div class="rec-stats">
          <div><b>${recReturns}</b><br><span>回窝</span></div>
          <div><b>${recScore}</b><br><span>积分</span></div>
        </div>
        <div style="font-size:11px;color:#a08a6a;margin-top:6px;">上传成绩后可以显示昵称</div>
      `;
    } else {
      myRecEl.innerHTML = `
        <div class="rec-title">📌 我的最佳记录${rankText}</div>
        <div class="rec-stats">
          <div><b>${recReturns}</b><br><span>回窝</span></div>
          <div><b>${recScore}</b><br><span>积分</span></div>
        </div>
      `;
    }
    myRecEl.classList.remove('hidden');
  }

  }

  // ===================== 个人模式位置 =====================
  function computeSinglePositions() {
    const W = topArea.clientWidth, H = topArea.clientHeight;
    POS.W = W; POS.H = H;
    const trough = document.getElementById('trough');
    const bigHome = document.getElementById('bigHome');
    const troughLeft = 44, troughRight = W - 106;
    const troughWidth = Math.max(180, troughRight - troughLeft);
    trough.style.left = troughLeft + "px";
    trough.style.bottom = "42px";
    trough.style.width = troughWidth + "px";
    const homeW = 91, homeLeft = W - 100, homeTop = 130;
    const maxHomeH = H - homeTop - 24;
    const homeH = Math.max(140, Math.min(maxHomeH, (H - 130) * 0.78));
    bigHome.style.left = homeLeft + "px";
    bigHome.style.top = homeTop + "px";
    bigHome.style.width = homeW + "px";
    bigHome.style.height = homeH + "px";
    POS.home = { x: homeLeft, y: homeTop, w: homeW, h: homeH };
    POS.eating = [];
    const catW = 84;
    const troughTopY = H - 42 - 54;
    const eatY = troughTopY - 60;
    // 6 个进食位，和 6 个碗 1:1 对齐
    for (let i = 0; i < 6; i++) {
      const cx = troughLeft + (i + 0.5) * (troughWidth / 6);
      POS.eating.push({ x: cx - catW / 2, y: eatY });
    }
    POS.waiting = [];
    const catH = 50;
    const waitBottomLimit = eatY - 34;
    const waitLeft = 72, waitRight = W - 106;
    const waitWidth = Math.max(120, waitRight - waitLeft);
    let cols = Math.max(3, Math.min(5, Math.floor(waitWidth / 50) + 1));
    let rows = 2;
    const cellH = 42;
    let baseY = waitBottomLimit - (rows - 1) * cellH - catH;
    const minBaseY = H * 0.3 + 2;
    while (rows > 1 && baseY < minBaseY) { rows--; baseY = waitBottomLimit - (rows - 1) * cellH - catH; }
    if (baseY < minBaseY) baseY = minBaseY;
    const cellW = waitWidth / cols;
    for (let row = 0; row < rows; row++) for (let col = 0; col < cols; col++) {
      POS.waiting.push({ x: waitLeft + cellW * (col + 0.5) - catW / 2, y: baseY + row * cellH });
    }
    const gameRect = gameRoot.getBoundingClientRect();
    const topAreaRect = topArea.getBoundingClientRect();
    const topAreaBottomRel = topAreaRect.bottom - gameRect.top;
    leftColumn.style.top = (topAreaBottomRel - 78 / 2) + "px";
    const pt = document.getElementById('progressTrack');
    if (pt) pt.style.height = (boardEl.offsetHeight || 260) + "px";
  }

  function updateTroughCells(cellsEl, state) {

        cell.appendChild(bowl);

      }

    }
    for (let i = 0; i < 6; i++) {
      const cell = cellsEl.children[i];
      const bowl = cell.querySelector(".bowl");
      if (!bowl) continue;
      const s = (state && state[i]) || { filled: false, eaten: 0 };
      bowl.classList.toggle("filled", !!s.filled);
      bowl.classList.toggle("eaten-1", !!s.filled && s.eaten === 1);
      bowl.classList.toggle("eaten-2", !!s.filled && s.eaten >= 2);
    }
  }

  function getFreeWaitingSlot() {
    const used = new Set(cats.filter(c => c.poolSlot >= 0).map(c => c.poolSlot));
    for (let i = 0; i < POS.waiting.length; i++) if (!used.has(i)) return i;

    // ============ 猫窝睡眠位置 ============
  // 前 10 只：2 列 × 5 行，随机分配不重叠的槽位
  // 10 只以后：用索引派生的伪随机位置，允许重叠
  function computeHomeSlotPos(home, index) {
    if (!home) return { x: 0, y: 0 };
    const catW = 68, catH = 60;
    const innerLeft = home.x + home.w * 0.15;
    const innerWidth = home.w * 0.7;
    const innerTop = home.y + home.h * 0.18;
    const innerHeight = home.h * 0.64;
    if (index < 10) {
      const col = index % 2;
      const row = Math.floor(index / 2);
      const colSpacing = innerWidth / 2;
      const rowSpacing = innerHeight / 5;
      return {
        x: innerLeft + col * colSpacing + colSpacing / 2 - catW / 2,
        y: innerTop + row * rowSpacing + rowSpacing / 2 - catH / 2
      };
    }
    // 溢出猫：伪随机位置（用 index 派生，保证同一只猫每次都算到同一位置）
    const seed = index;
    const r1 = ((seed * 9301 + 49297) % 233280) / 233280;
    const r2 = ((seed * 49297 + 9301) % 233280) / 233280;
    return {
      x: innerLeft + r1 * innerWidth - catW / 2,
      y: innerTop + r2 * innerHeight - catH / 2
    };
  }

  // 单人模式：根据索引取坐标
  function getSingleHomeSlotPos(index) {
    return computeHomeSlotPos(POS.home, index);
  }

  // 从 0-9 中随机挑一个未被占用的槽位；10 个都占满则返回 10+ 的溢出索引
  function pickFreeHomeSlot(cat, ownerFilter) {
    const used = new Set();
    for (const c of cats) {
      if (c === cat) continue;
      if (ownerFilter !== undefined && c.owner !== ownerFilter) continue;
      if ((c.state === "walking_to_home" || c.state === "sleeping") && c.homeSlot >= 0) {
        used.add(c.homeSlot);
      }
    }
    const free = [];
    for (let i = 0; i < 10; i++) if (!used.has(i)) free.push(i);
    if (free.length > 0) return free[Math.floor(Math.random() * free.length)];
    return 10 + Math.floor(Math.random() * 1000);
  }
  // ============ 通用补猫（三个模式共用） ============
  // pool: 等待位数组  makeCat: 造猫函数  getFreeSlot: 找空等待位的函数
  function spawnWaitingCatCommon(pool, makeCat, getFreeSlot) {
    const activeCats = cats.filter(c => c.state !== "sleeping").length;
    if (activeCats >= 18) return;
    const wCount = cats.filter(c => c.state === "waiting" || c.state === "waiting_walk").length;
    if (wCount >= 10) return;
    if (pool.length === 0) return;
    const slot = getFreeSlot();
    if (slot < 0) return;
    const cat = makeCat(slot);
    cats.push(cat);
  }

  function spawnSingleWaitingCat() {
    spawnWaitingCatCommon(POS.waiting, (slot) => {
      const cat = makeSingleCat();
      cat.owner = null;
      cat.poolSlot = slot;
      const p = POS.waiting[slot];
      cat.el.style.left = p.x + "px";
      cat.el.style.top = p.y + "px";
      return cat;
    }, getFreeWaitingSlot);
  }

  // ============ 通用状态机（三个模式共用） ============
  // hooks 提供模式相关的动作：
  //   refreshCat(cat)      重新渲染猫的 SVG
  //   getHomeSlot(cat)     找该猫可用的猫窝位下标
  //   getHomePos(cat, idx) 该猫窝位的坐标
  //   moveCat(cat, x, y)   把猫放到坐标
  //   onReturn(cat)        猫回窝时的回调（计数 + 音效）
  //   getPoolPos(cat)      猫在等待区的坐标（waiting 散步回来用）
  //   clampWalkX(x)        散步 x 坐标夹取范围
  function tickCatsCommon(hooks) {
    const now = performance.now();
    for (const cat of cats) {
      const e = now - cat.stateStart;
      switch (cat.state) {
        case "waiting":
          if (now >= cat.nextIdleChange) {
            const p = hooks.getPoolPos(cat);
            if (p && Math.random() < 0.55) {
              cat.state = "waiting_walk";
              cat.stateStart = now;
              cat.walkDir = Math.random() < 0.5 ? "left" : "right";
              cat.nextIdleChange = now + rand(1800, 3500);
              const offset = (cat.walkDir === "right" ? 1 : -1) * (10 + Math.random() * 14);
              const nx = hooks.clampWalkX(p.x + offset);
              hooks.moveCat(cat, nx, p.y);
              hooks.refreshCat(cat);
            } else {
              cat.nextIdleChange = now + rand(3000, 7000);
            }
          }
          break;
        case "waiting_walk":
          if (now >= cat.nextIdleChange) {
            const p = hooks.getPoolPos(cat);
            if (p) hooks.moveCat(cat, p.x, p.y);
            cat.state = "waiting";
            cat.stateStart = now;
            cat.nextIdleChange = now + rand(3000, 7000);
            hooks.refreshCat(cat);
          }
          break;
        case "walking_to_food":
          if (e >= DUR.walkingToFood) {
            cat.state = "eating"; cat.stateStart = now;
            hooks.refreshCat(cat);
          }
          break;
        case "eating": {
          const total = DUR.eating;
          const prog = Math.min(2, Math.floor((e / total) * 3));   // 0,1,2
          if (cat.bowlRef) cat.bowlRef.eaten = prog;
          if (e >= total) {
            if (cat.bowlRef) {
              // 吃完：碗里粮没了，但猫还占着这个碗（eaterCatId 保留）
              cat.bowlRef.filled = false;
              cat.bowlRef.eaten = 0;
            }
            cat.state = "cleaning"; cat.stateStart = now; cat.dirty = false;
            hooks.refreshCat(cat);
          }
          break;
        }
        case "cleaning":
          if (e >= DUR.cleaning) {
            cat.state = "happy"; cat.stateStart = now;
            hooks.refreshCat(cat);
          }
          break;
        case "happy":
          if (e >= DUR.happy) {
            // 猫离开进食位：释放它占的碗
            if (cat.bowlRef) {
              cat.bowlRef.eaterCatId = null;
              cat.bowlRef = null;
            }
            const idx = hooks.getHomeSlot(cat);
            cat.homeSlot = idx;
            cat.eatSlot = -1;
            cat.state = "walking_to_home";
            cat.stateStart = now;
            hooks.refreshCat(cat);
            const p = hooks.getHomePos(cat, idx);
            hooks.moveCat(cat, p.x, p.y);
          }
          break;
        case "walking_to_home":
          if (e >= DUR.walkingToHome) {
            cat.state = "sleeping"; cat.stateStart = now;
            hooks.refreshCat(cat);
            hooks.onReturn(cat);
          }
          break;
      }
    }
  }

  function tickSingleCats() {
    tickCatsCommon({
      refreshCat: refreshSingleCatVisual,

  // ============ 通用派猫（三个模式共用） ============
  // players: [{ id, get foodStock, set foodStock }, ...]
  // getEatSlots(playerId) → 进食位数组
  // getFreeSlot(playerId, usedSet) → 该玩家的空进食位下标
  // applyCat(cat, playerId, slot) → 把猫移到槽位的回调
  function trySendCatCommon(players, getEatSlots, getFreeSlot, applyCat) {
    if (!gameActive) return;
    // 找等待中的无主猫
    const waiter = cats.find(c =>
      (c.state === "waiting" || c.state === "waiting_walk") && !c.owner);
    if (!waiter) return;

    // 统计每个玩家"正在占用食槽"的猫
    const using = {};
    for (const p of players) using[p.id] = 0;
    for (const c of cats) {
      if (c.owner && ["walking_to_food", "eating", "cleaning", "happy"].includes(c.state)) {
        if (using[c.owner] !== undefined) using[c.owner]++;
      }
    }

    // 候选玩家：有粮 + 未达并发上限（并发上限 = 已派出的猫 + 剩余粮，上限 6）
    const candidates = players.filter(p =>
      p.foodStock > 0 &&
      using[p.id] < maxConcurrentByFood(p.foodStock + using[p.id]));

    // 按粮多的概率高来抽一个
    const total = candidates.reduce((s, p) => s + p.foodStock, 0);
    if (total <= 0) return;
    let rnd = Math.random() * total;
    let target = candidates[0];
    for (const p of candidates) {
      rnd -= p.foodStock;
      if (rnd <= 0) { target = p; break; }
    }

    // 找这个玩家空着的进食位
    const usedSet = new Set(cats
      .filter(c => c.owner === target.id && c.eatSlot >= 0 &&
        ["walking_to_food", "eating", "cleaning", "happy"].includes(c.state))
      .map(c => c.eatSlot));
    const slot = getFreeSlot(target.id, usedSet);
    if (slot < 0) return;

    // 扣粮、派猫
    target.foodStock--;
    waiter.owner = target.id;
    waiter.eatSlot = slot;
    waiter.poolSlot = -1;
    waiter.state = "walking_to_food";
    waiter.stateStart = performance.now();
    applyCat(waiter, target.id, slot);

    SoundManager.meow();
    updateHUD();
  }

  function trySendSingleCat() {
    const me = { id: 'me', get foodStock() { return foodStock; },
      set foodStock(v) { foodStock = v; } };
    trySendCatCommon(
      [me],
      () => POS.eating,
      (id, used) => {
        // 只挑"碗里有粮且碗未被占用"的进食位（进食位索引 = 碗索引）
        for (let i = 0; i < POS.eating.length; i++) {
          if (used.has(i)) continue;
          const b = myBowlState[i];
          if (b && b.filled && !b.eaterCatId) return i;
        }
        return -1;
      },
      (cat, id, slot) => {
        const b = myBowlState[slot];
        if (b && b.filled && !b.eaterCatId) {
          b.eaterCatId = cat.id;
          cat.bowlRef = b;
        }
        refreshSingleCatVisual(cat);
        const p = POS.eating[slot];
        if (p) moveCat(cat, p.x, p.y);
      }
    );
  }

  // ===================== 对战模式位置 =====================
  function computeBattlePositions() {
    const W = topArea.clientWidth, H = topArea.clientHeight;

    // ============ 中栏等待区（缩短到红框范围） ============
    BATTLE_POS.pool = [];
    const poolWidth = 140;
    const poolLeft = (W - poolWidth) / 2;
    const poolTop = 66;
    const poolH = Math.max(120, (H - poolTop - 12) * 0.52);
    const catW = 68, catH = 60;
    const cols = 2;
    const rows = 3;   // 固定 3 行 × 2 列 = 6 个位
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        BATTLE_POS.pool.push({
          x: poolLeft + (c + 0.5) * (poolWidth / cols) - catW / 2,
          y: poolTop + (r + 0.5) * (poolH / rows) - catH / 2
        });
      }
    }

    // ============ 左右栏：猫窝保持原宽，喂食盆延伸到中栏中心 ============
    const leftColX = 6;
    const gapToPool = 6;
    const leftColW = (W - poolWidth) / 2 - gapToPool - 6;
    const rightColX = W - leftColW - 6;

    const colTop = 58;
    const colBottom = H - 8;
    const HOME_H = 88;
    const TROUGH_H = 46;
    const MACHINE_H = 68;
    const STOCK_H = 24;

    const homeTop = colTop;
    const stockTop = colBottom - STOCK_H;
    const machineTop = stockTop - MACHINE_H;
    const troughTop = machineTop - TROUGH_H;

    BATTLE_POS.myHome = { x: leftColX, y: homeTop, w: leftColW, h: HOME_H };
    BATTLE_POS.oppHome = { x: rightColX, y: homeTop, w: leftColW, h: HOME_H };

    // 喂食盆实际宽度 = 左右栏宽 + 中栏一半（和 CSS 对齐）
    const eatAreaW = leftColW + 76;
    const eatY = troughTop - catH + 10;
    const eatCount = 6;
    BATTLE_POS.myEat = [];
    BATTLE_POS.oppEat = [];
    for (let i = 0; i < eatCount; i++) {
      const t = (i + 0.5) / eatCount;
      // 我的：从左栏左边到中栏中心
      BATTLE_POS.myEat.push({
        x: leftColX + eatAreaW * t - catW / 2,
        y: eatY,
        z: i
      });
      // 对手：从中栏中心到右栏右边（镜像）
      BATTLE_POS.oppEat.push({
        x: (rightColX - 76) + eatAreaW * t - catW / 2,
        y: eatY,
        z: i
      });
    }

    positionLeftColumnForBattle();
  }

  // 猫窝内叠放位置：每 3 只一层，一层一层往上叠
  function getHomeSlotPos(owner, index) {

  // ===================== 对战猫咪 =====================
  // 服务器事件同步时：cat.paletteIdx 由服务器给
  // 本地 AI 对战：随机 paletteIdx
  function makeBattleCat(id, owner, paletteIdx, slot) {
    const cat = {
      id: id,
      owner: owner,      // 'me' | 'opp'
      state: "waiting",
      stateStart: performance.now(),
      nextIdleChange: performance.now() + rand(2500, 5500),
      walkDir: "right",
      paletteIdx: paletteIdx !== undefined ? paletteIdx : Math.floor(Math.random() * CAT_PALETTES.length),
      poolSlot: slot !== undefined ? slot : getFreeBattlePoolSlot(),
      eatSlot: -1,
      homeSlot: -1,
      dirty: true,
      el: document.createElement("div")
    };
    cat.palette = CAT_PALETTES[cat.paletteIdx];
    cat.el.className = "cat state-waiting";
    cat.el.dataset.catId = cat.id;
    cat.el.innerHTML = `<div class="cat-svg-wrap">${catSVG("waiting", cat.palette, true, false)}</div><div class="cat-chip">等待</div>`;
    battleCatsEl.appendChild(cat.el);

    // 初始位置
    if (cat.poolSlot >= 0 && BATTLE_POS.pool[cat.poolSlot]) {
      const p = BATTLE_POS.pool[cat.poolSlot];
      cat.el.style.left = p.x + "px";
      cat.el.style.top = p.y + "px";

  function getFreeBattlePoolSlot() {
    const used = new Set(
      cats.filter(c => (c.state === "waiting" || c.state === "waiting_walk") && c.poolSlot >= 0)
        .map(c => c.poolSlot)
    );
    for (let i = 0; i < BATTLE_POS.pool.length; i++) if (!used.has(i)) return i;
    return -1;
  }

  function getFreeBattleEatSlot(owner) {
    const arr = owner === 'me' ? BATTLE_POS.myEat : BATTLE_POS.oppEat;
    const used = new Set(
      cats.filter(c => c.owner === owner && c.eatSlot >= 0 &&
        ["walking_to_food", "eating", "cleaning", "happy"].includes(c.state))
        .map(c => c.eatSlot)
    );
    for (let i = 0; i < arr.length; i++) if (!used.has(i)) return i;
    return -1;
  }


  function refreshBattleCatVisual(cat) {
    cat.el.className = "cat state-" + cat.state;
    // 朝向：向左走是 facing-left，向右走是默认
    // 走食槽：从中间走向左侧 = 向左；走向右侧 = 向右
    // 走猫窝：不改变朝向
    let facing = 'right';
    if (cat.state === "waiting_walk" && cat.walkDir === "left") facing = 'left';
    else if (cat.state === "walking_to_food") {
      // 根据目标食槽在左或右决定朝向
      facing = cat.owner === 'me' ? 'left' : 'right';
    }
    if (facing === 'left') cat.el.classList.add("facing-left");
    const tailUp = cat.state === "walking_to_home" || cat.state === "eating";
    const showChip = true;
    if (showChip) {
      cat.el.innerHTML = `<div class="cat-svg-wrap">${catSVG(cat.state, cat.palette, cat.dirty, tailUp)}</div><div class="cat-chip">${stateLabel(cat.state)}</div>`;
    } else {
      cat.el.innerHTML = `<div class="cat-svg-wrap">${catSVG(cat.state, cat.palette, cat.dirty, tailUp)}</div>`;
    }
  }

  // 尝试让中间等待的猫去某侧食槽
  function trySendBattleCat() {
    if (mode === 'online') return;

    const me = { id: 'me',
      get foodStock() { return foodStock; },
      set foodStock(v) { foodStock = v; } };
    const opp = { id: 'opp',

    trySendCatCommon(
      [me, opp],
      (id) => id === 'me' ? BATTLE_POS.myEat : BATTLE_POS.oppEat,

        const arr = id === 'me' ? BATTLE_POS.myEat : BATTLE_POS.oppEat;
        for (let i = 0; i < arr.length; i++) {
          if (used.has(i)) continue;
          const b = bowlArr[i];
          if (b && b.filled && !b.eaterCatId) return i;
        }
        return -1;
      },
      (cat, id, slot) => {

        const b = bowlArr[slot];

        const p = arr[slot];
        if (p) moveCat(cat, p.x, p.y);
      }
    );
  }



  function maxConcurrentByFood(stock) {
    if (stock <= 0) return 0;
    return Math.min(stock, 6);
  }

  function tickBattleCats() {
    if (mode === 'online') {
      // 联机模式：位置由客户端维护，但粮和主归服务器权威
      // 这里先只做本地动画推进 + 视觉清理（下一轮做服务端对齐时再动）
      tickCatsCommon({
        refreshCat: refreshBattleCatVisual,
        getPoolPos: (cat) => BATTLE_POS.pool[cat.poolSlot] || null,
        clampWalkX: (x) => Math.max(104 + 2, Math.min(topArea.clientWidth - 104 - 56, x)),
      getHomeSlot: (cat) => pickFreeHomeSlot(cat, cat.owner),
        getHomePos: (cat, idx) => getHomeSlotPos(cat.owner, idx),
        moveCat: moveCat,
        onReturn: () => {}
      });
      // 清理 12 只视觉上限
      cleanupSleepingCats();

    }

    // 本地对战：完全复用单人的逻辑
    tickCatsCommon({
      refreshCat: refreshBattleCatVisual,
      getPoolPos: (cat) => BATTLE_POS.pool[cat.poolSlot] || null,
      clampWalkX: (x) => Math.max(104 + 2, Math.min(topArea.clientWidth - 104 - 56, x)),
      getHomeSlot: (cat) => pickFreeHomeSlot(cat, cat.owner),
      getHomePos: (cat, idx) => getHomeSlotPos(cat.owner, idx),
      moveCat: moveCat,
      onReturn: (cat) => {
        if (cat.owner === 'me') {
          returnedCats++;
          SoundManager.returnHome();
        } else if (cat.owner === 'opp') {
          opponent.returnedCats++;
        }
        updateHUD();

    });

  }

  function cleanupSleepingCats() {
    const byOwner = { me: [], opp: [] };
    for (const c of cats) {
      if (c.state === 'sleeping' && (c.owner === 'me' || c.owner === 'opp')) {
        byOwner[c.owner].push(c);
      }
    }
    for (const owner of ['me', 'opp']) {
      const list = byOwner[owner];
      if (list.length > 12) {
        list.sort((a, b) => a.stateStart - b.stateStart);
        for (const c of list.slice(0, list.length - 12)) {
          if (c.el && c.el.parentNode) c.el.parentNode.removeChild(c.el);
          c._dead = true;
        }
      }
    }
    if (cats.some(c => c._dead)) cats = cats.filter(c => !c._dead);
  }

  // ===================== 对战 AI =====================
  function startBattleAI() {
    if (aiTimer) clearInterval(aiTimer);
    aiTimer = setInterval(() => {
      if (!gameActive || mode !== 'battle') return;
      const moves = [];
      for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
        if (c < 7) {
          swap(opponent.board, r, c, r, c + 1);
          if (findMatches(opponent.board).length > 0) moves.push([r, c, r, c + 1]);
          swap(opponent.board, r, c, r, c + 1);
        }
        if (r < 7) {
          swap(opponent.board, r, c, r + 1, c);
          if (findMatches(opponent.board).length > 0) moves.push([r, c, r + 1, c]);
          swap(opponent.board, r, c, r + 1, c);
        }
      }
      if (moves.length === 0) { opponent.board = generateBoard(); return; }
      const [r1, c1, r2, c2] = moves[Math.floor(Math.random() * moves.length)];
      executeOpponentSwap(r1, c1, r2, c2);
    }, rand(4500, 5500));
  }
  function executeOpponentSwap(r1, c1, r2, c2) {
    swap(opponent.board, r1, c1, r2, c2);
    const first = findMatches(opponent.board);
    if (first.length === 0) { swap(opponent.board, r1, c1, r2, c2); return; }
    let chainLevel = 0, current = first;
    let totalGain = 0;
    while (current.length > 0) {
      const removeSet = new Set();
      let base = 0;
      for (const g of current) {
        base += scoreForLength(g.length);
        for (const [r, c] of g.cells) removeSet.add(`${r},${c}`);
      }
      const chainMul = 1 + Math.min(chainLevel * 0.25, 0.75);
      totalGain += Math.round(base * chainMul);
      removeSet.forEach(k => {
        const [r, c] = k.split(",").map(Number);
        opponent.board[r][c] = null;
      });
      applyGravity(opponent.board);
      current = findMatches(opponent.board);
      chainLevel++;
    }
    opponent.score += totalGain;
    opponent.foodProgress += totalGain;
    while (opponent.foodProgress >= 90 && opponent.foodStock < 6) {
      const b = oppBowlState.find(b => !b.filled && !b.eaterCatId);
      if (!b) break;
      opponent.foodProgress -= 90;
      opponent.foodStock++;
      b.filled = true; b.eaten = 0; b.eaterCatId = null;
    }
    updateHUD();
  }

  function renderMiniKibbles(parent, stock) {
    if (!parent) return;
    parent.innerHTML = "";
    if (stock <= 0) return;
    const W = parent.clientWidth || 60, H = parent.clientHeight || 20;
    const perRow = Math.max(3, Math.min(stock, Math.ceil(Math.sqrt(stock * 2))));
    const rows = Math.ceil(stock / perRow);
    const cw = W / perRow, ch = H / Math.max(1, rows);
    for (let i = 0; i < stock; i++) {
      const r = Math.floor(i / perRow), c = i % perRow;
      const k = document.createElement("div");
      k.className = "k";
      k.style.left = (c * cw + cw * 0.5 - 2) + "px";
      k.style.top = (H - (rows - r - 1) * ch - ch * 0.5 - 2) + "px";
      parent.appendChild(k);
    }
  }

      SoundManager.tick();

    if (timeLeft <= 0) {

    updateHUD();
  }
