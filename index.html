    box-shadow: 0 10px 24px rgba(120, 80, 40, .28), inset 0 2px 0 rgba(255,255,255,.6), inset 0 -3px 6px rgba(0,0,0,.12);

    transition: transform .12s ease; }
  #board.shake { animation: boardShake .22s ease; }
  @keyframes boardShake {
    0%, 100% { transform: translate(0, 0); }
    25% { transform: translate(-1px, .5px); }
    50% { transform: translate(1px, -.5px); }
    75% { transform: translate(-.5px, 1px); } }
  .tile { display: flex; align-items: center; justify-content: center;
    border-radius: 10px;
    font-size: calc(var(--tile-size, 40px) * 0.55);
    line-height: 1; border: 2px solid transparent; cursor: pointer;
    transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
    will-change: transform;
    box-shadow: inset 0 2px 0 rgba(255,255,255,.8), 0 1px 3px rgba(140, 100, 60, .15); }
  .tile[data-type="paw"] { background: linear-gradient(180deg, #ffe0d0, #ffc8b0); }
  .tile[data-type="fish"] { background: linear-gradient(180deg, #d0e8ff, #b0d4ff); }
  .tile[data-type="yarn"] { background: linear-gradient(180deg, #d8f0c8, #b8e0a0); }
  .tile[data-type="cookie"] { background: linear-gradient(180deg, #ffefc0, #ffe0a0); }
  .tile[data-type="milk"] { background: linear-gradient(180deg, #f0e8ff, #e0d0ff); }
  .tile.selected { transform: scale(1.10);
    border-color: #ff9f43;
    box-shadow: 0 0 0 2px #ff9f43 inset, 0 0 14px rgba(255, 159, 67, .7); }
  .tile.invalid { animation: shake .3s ease; }
  .tile.pop { animation: popBig .32s cubic-bezier(.4,0,.7,1) forwards; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-3px); }
    75% { transform: translateX(3px); } }
  @keyframes popBig {
    0% { transform: scale(1) rotate(0); opacity: 1; }
    40% { transform: scale(1.35) rotate(8deg); opacity: 1; box-shadow: 0 0 20px 6px rgba(255,220,120,.9), inset 0 0 12px rgba(255,255,255,.9); }
    100% { transform: scale(0) rotate(-25deg); opacity: 0; } }
  #bottomBar { height: 32px; flex: 0 0 auto;
    display: flex; gap: 14px; align-items: center; justify-content: center;
    font-size: 13px; color: #6b5a44; white-space: nowrap;
    background: linear-gradient(180deg, #fff6e0, #ffe4b8);
    padding: 0 16px; border-radius: 999px;
    border: 1.5px solid #e8b87a;
    box-shadow: 0 3px 8px rgba(120, 80, 40, .15), inset 0 1px 0 rgba(255,255,255,.8); }
  #bottomBar > div { display: flex; align-items: center; gap: 4px; font-weight: 700; }
  #bottomBar strong { color: #5a3a1a; font-size: 15px; font-variant-numeric: tabular-nums; font-weight: 900; }
  .floating-score { position: fixed; transform: translate(-50%, -50%);
    color: #ffe066; font-weight: 900; font-size: 24px;
    pointer-events: none;
    animation: floatUp .95s cubic-bezier(.2,.7,.3,1.2) forwards;
    z-index: 90; -webkit-text-stroke: 1.2px #7a4000;
    text-shadow: 0 2px 0 #7a4000, 0 0 10px #ffd54f, 0 0 18px #ffb300, 0 3px 8px rgba(0, 0, 0, .45); }
  @keyframes floatUp {
    0% { transform: translate(-50%, -50%) scale(.5); opacity: 0; }
    25% { transform: translate(-50%, -70%) scale(1.25); opacity: 1; }
    100% { transform: translate(-50%, -160%) scale(1); opacity: 0; } }
  .toast { position: fixed; left: 50%; top: 58%;
    transform: translate(-50%, -50%);
    background: rgba(45, 35, 25, .88); color: #fff;
    padding: 10px 18px; border-radius: 24px; font-size: 13px;
    z-index: 120; pointer-events: none;
    animation: toastFade 1.9s ease forwards;
    box-shadow: 0 8px 22px rgba(0,0,0,.25); }
  @keyframes toastFade {
    0% { opacity: 0; transform: translate(-50%, -40%); }
    15%, 70% { opacity: 1; transform: translate(-50%, -50%); }
    100% { opacity: 0; transform: translate(-50%, -62%); } }
  #resultOverlay { position: fixed; inset: 0;
    background: rgba(40, 30, 20, .55);
    display: flex; align-items: center; justify-content: center;
    z-index: 200; backdrop-filter: blur(4px); }
  .result-card { background: linear-gradient(180deg, #fff9ec, #ffefd3);
    border-radius: 28px; padding: 28px 24px 24px;
    width: min(86vw, 340px); text-align: center;
    box-shadow: 0 18px 44px rgba(0,0,0,.3), inset 0 0 0 1px rgba(255,255,255,.8); }
  .result-card h2 { margin: 0 0 12px; font-size: 24px; color: #e67e22; letter-spacing: 1px; }
  .result-card .big-number { font-size: 48px; font-weight: 900; color: #2f7a3e; line-height: 1; margin: 4px 0 6px; }
  .result-card p { margin: 7px 0; font-size: 14px; color: #6b5a44; }
  .result-card p span { font-weight: 800; color: #4a3524; }
  .result-card button { margin-top: 20px; padding: 13px 36px; border: none; border-radius: 999px;
    background: linear-gradient(180deg, #ffb257, #ff9f43);
    color: #fff; font-size: 17px; font-weight: 800;
    box-shadow: 0 5px 0 #d97d1f, 0 8px 18px rgba(217, 125, 31, .4);
    cursor: pointer; letter-spacing: 1px; }
  .result-card button:active { transform: translateY(2px); box-shadow: 0 3px 0 #d97d1f; }
  .hidden { display: none !important; }
</style>
</head>
<body>

    </div>

<script>
(function () {
  "use strict";

  // ===================== 音效模块 =====================
  const SoundManager = (function () {
    let ctx = null, enabled = true, masterGain = null;
    function init() {
      if (ctx) return;
      try {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = ctx.createGain();
        masterGain.gain.value = 0.35;
        masterGain.connect(ctx.destination);
      } catch (e) { enabled = false; console.warn('AudioContext 不可用'); }
    }
    function tone(freq, dur, type = 'sine', vol = 0.5, delay = 0) {
      if (!ctx || !enabled) return;
      const t0 = ctx.currentTime + delay;
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = type; osc.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(vol, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      osc.connect(g); g.connect(masterGain);
      osc.start(t0); osc.stop(t0 + dur + 0.02);
    }
    function slide(f1, f2, dur, type = 'sine', vol = 0.5, delay = 0) {
      if (!ctx || !enabled) return;
      const t0 = ctx.currentTime + delay;
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(f1, t0);
      osc.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(vol, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      osc.connect(g); g.connect(masterGain);
      osc.start(t0); osc.stop(t0 + dur + 0.02);
    }
    return {
      init,
      setEnabled(v) { enabled = v; },
      isEnabled() { return enabled; },
      match(n) { const base = 660; const freq = base * Math.pow(1.12, Math.min(n - 3, 3));
        tone(freq, 0.12, 'triangle', 0.45); tone(freq * 1.5, 0.10, 'sine', 0.25, 0.02); },
      chain(level) { const base = 523.25; const steps = [0, 2, 4, 7, 9, 12];
        const idx = Math.min(level, steps.length - 1);
        const freq = base * Math.pow(2, steps[idx] / 12);
        tone(freq, 0.16, 'triangle', 0.5); tone(freq * 1.25, 0.14, 'sine', 0.3, 0.03); },
      feed() { tone(120, 0.06, 'square', 0.4); tone(180, 0.08, 'square', 0.3, 0.06); tone(90, 0.10, 'sine', 0.35, 0.12); },
      meow() { slide(880, 660, 0.18, 'sine', 0.35); slide(1320, 990, 0.16, 'triangle', 0.15, 0.03); slide(660, 440, 0.22, 'sine', 0.25, 0.15); },
      returnHome() { const notes = [523.25, 659.25, 783.99, 1046.5]; notes.forEach((f, i) => tone(f, 0.14, 'triangle', 0.4, i * 0.08)); },
      click() { tone(880, 0.04, 'sine', 0.25); },
      invalid() { tone(220, 0.12, 'sawtooth', 0.3); tone(180, 0.14, 'sawtooth', 0.25, 0.05); },
      start() { const notes = [523.25, 659.25, 783.99]; notes.forEach((f, i) => tone(f, 0.16, 'triangle', 0.5, i * 0.1)); },
      end() { const notes = [783.99, 659.25, 523.25, 392.00]; notes.forEach((f, i) => tone(f, 0.22, 'triangle', 0.4, i * 0.12)); },
      tick() { tone(880, 0.05, 'square', 0.2); }
    };
  })();

  // ===================== 联机客户端 =====================
  const NetworkClient = (function () {
    let ws = null, connected = false, mode = 'single', playerId = null, roomId = null, lastSeq = 0;
    const handlers = { onState: null, onEvent: null, onJoined: null, onDisconnected: null, onRoundEnd: null };
    let heartbeat = null;

    function connect(url, opts = {}) {
      return new Promise((resolve, reject) => {
        if (connected) return resolve();
        try { ws = new WebSocket(url); } catch (e) { return reject(e); }
        const timeout = setTimeout(() => reject(new Error('连接超时')), 8000);
        ws.onopen = () => {
          clearTimeout(timeout);
          connected = true; mode = 'online';
          send({ type: 'join', room: opts.room || 'default', name: opts.name || '玩家' });
          startHeartbeat();
          resolve();
        };
        ws.onmessage = (e) => {
          let msg; try { msg = JSON.parse(e.data); } catch { return; }
          handleMessage(msg);
        };
        ws.onerror = (e) => { clearTimeout(timeout); reject(e); };
        ws.onclose = () => {
          connected = false; mode = 'single'; stopHeartbeat();
          if (handlers.onDisconnected) handlers.onDisconnected();
        };
      });
    }
    function handleMessage(msg) {
      switch (msg.type) {
        case 'joined':
          playerId = msg.playerId; roomId = msg.room;
          if (handlers.onJoined) handlers.onJoined(msg);
          break;
        case 'state': if (handlers.onState) handlers.onState(msg); break;
        case 'event': if (handlers.onEvent) handlers.onEvent(msg); break;
        case 'round_end': if (handlers.onRoundEnd) handlers.onRoundEnd(msg); break;
      }
    }
    function send(msg) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(msg)); }
    function sendSwap(r1, c1, r2, c2) {
      lastSeq++;
      send({ type: 'swap', r1, c1, r2, c2, seq: lastSeq, t: Date.now() });
    }
    function sendReady() { send({ type: 'ready' }); }
    function startHeartbeat() { stopHeartbeat(); heartbeat = setInterval(() => send({ type: 'ping', t: Date.now() }), 15000); }
    function stopHeartbeat() { if (heartbeat) clearInterval(heartbeat); heartbeat = null; }
    function disconnect() { stopHeartbeat(); if (ws) ws.close(); ws = null; connected = false; mode = 'single'; }
    return {
      connect, disconnect, send, sendSwap, sendReady,
      isConnected: () => connected, getMode: () => mode,
      getPlayerId: () => playerId, getRoomId: () => roomId,
      onState: (cb) => { handlers.onState = cb; },
      onEvent: (cb) => { handlers.onEvent = cb; },
      onJoined: (cb) => { handlers.onJoined = cb; },
      onDisconnected: (cb) => { handlers.onDisconnected = cb; },
      onRoundEnd: (cb) => { handlers.onRoundEnd = cb; }
    };
  })();

  // ===================== 配置 =====================
  const CONFIG = {
    roundTime: 90, boardSize: 8,
    tileTypes: ["paw", "fish", "yarn", "cookie", "milk"],
    tileEmoji: { paw: "🐾", fish: "🐟", yarn: "🧶", cookie: "🍪", milk: "🥛" },
    scoreTable: { 3: 30, 4: 45, 5: 60 },
    score6Base: 60, score6Extra: 10,
    chainBonusStep: 0.25, chainBonusMax: 0.75,
    comboWindow: 4000, comboStep: 0.10, comboMax: 0.50,
    foodPerScore: 90, troughCap: 24,
    catPhases: { walkingToFood: 1300, eating: 4500, cleaning: 4500, happy: 4500, walkingToHome: 1700 },
    maxEating: 6, initialWaitingCats: 6, maxWaitingCats: 10, maxTotalCats: 18,
    catSpawnInterval: 2400,
    troughConcurrency: [
      { min: 1, max: 3, maxCats: 1 }, { min: 4, max: 6, maxCats: 2 },
      { min: 7, max: 10, maxCats: 3 }, { min: 11, max: 15, maxCats: 4 },
      { min: 16, max: 20, maxCats: 5 }, { min: 21, max: 24, maxCats: 6 }
    ]
  };

  const gameEl = document.getElementById("game");
  const boardEl = document.getElementById("board");
  const catsLayer = document.getElementById("catsLayer");
  const topArea = document.getElementById("topArea");
  const boardArea = document.getElementById("boardArea");
  const leftColumn = document.getElementById("leftColumn");
  const foodMachine = document.getElementById("foodMachine");
  const trough = document.getElementById("trough");
  const bigHome = document.getElementById("bigHome");
  const troughMarks = document.getElementById("troughMarks");
  const progressTrack = document.getElementById("progressTrack");
  const progressFill = document.getElementById("progressFill");
  const timeText = document.getElementById("timeText");
  const returnText = document.getElementById("returnText");
  const scoreText = document.getElementById("scoreText");
  const foodText = document.getElementById("foodText");
  const comboText = document.getElementById("comboText");
  const troughFill = document.getElementById("troughFill");
  const troughKibbles = document.getElementById("troughKibbles");
  const resultOverlay = document.getElementById("resultOverlay");
  const resultReturns = document.getElementById("resultReturns");
  const resultScore = document.getElementById("resultScore");
  const resultCombo = document.getElementById("resultCombo");
  const resultCats = document.getElementById("resultCats");
  const restartBtn = document.getElementById("restartBtn");
  const startBanner = document.getElementById("startBanner");

  let board = [], selected = null, isAnimating = false;
  let score = 0, foodStock = 0, foodProgress = 0;
  let comboLevel = 0, maxCombo = 0, lastMatchTime = 0;
  let timeLeft = CONFIG.roundTime, returnedCats = 0, attractedCats = 0;
  let cats = [], catIdSeq = 1, gameActive = false;
  let progressAnimating = false, lastTickSecond = -1;

  const timers = { countdown: null, gameTick: null, catSpawn: null };
  const POS = { W: 0, H: 0, eating: [], waiting: [], sleepSpots: [], home: null };

  const CAT_PALETTES = [
    { body: "#f5a352", dark: "#d97d2e", belly: "#ffe8c7", inner: "#f5a8b8", blush: "#ffb8a0" },
    { body: "#c5cdd6", dark: "#96a1ad", belly: "#f2f5f8", inner: "#f0a6b8", blush: "#ffc0c8" },
    { body: "#a87b5b", dark: "#7d563a", belly: "#f0dcc4", inner: "#e9a5b5", blush: "#e8a898" },
    { body: "#f6f2ea", dark: "#cfc8bc", belly: "#ffffff", inner: "#f0a6b8", blush: "#ffd0d0" },
    { body: "#8a7c6a", dark: "#6a5e50", belly: "#d9cfbf", inner: "#e9a5b5", blush: "#d0a898" }
  ];

  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const randomTile = () => CONFIG.tileTypes[Math.floor(Math.random() * CONFIG.tileTypes.length)];

  function swap(b, r1, c1, r2, c2) { const t = b[r1][c1]; b[r1][c1] = b[r2][c2]; b[r2][c2] = t; }
  function getTileEl(r, c) { return boardEl.querySelector(`.tile[data-r="${r}"][data-c="${c}"]`); }
  function stateLabel(s) {
    return { waiting: "等待", waiting_walk: "饿了", walking_to_food: "去吃", eating: "进食",
      cleaning: "清洁", happy: "开心", walking_to_home: "回窝", sleeping: "睡觉" }[s] || s;
  }
  function clearAllTimers() {
    if (timers.countdown) clearInterval(timers.countdown);
    if (timers.gameTick) clearInterval(timers.gameTick);
    if (timers.catSpawn) clearInterval(timers.catSpawn);
    timers.countdown = timers.gameTick = timers.catSpawn = null;
  }

  function positionLeftColumn() {
    const gameRect = gameEl.getBoundingClientRect();
    const topAreaRect = topArea.getBoundingClientRect();
    const topAreaBottomRel = topAreaRect.bottom - gameRect.top;
    const machineH = 84;
    const machineTop = topAreaBottomRel - machineH / 2;
    leftColumn.style.top = machineTop + "px";
    const boardH = boardEl.offsetHeight || 300;
    progressTrack.style.height = boardH + "px";
  }

  function computePositions() {
    const W = topArea.clientWidth, H = topArea.clientHeight;
    POS.W = W; POS.H = H;
    const troughLeft = 44, troughRight = W - 106;
    const troughWidth = Math.max(180, troughRight - troughLeft);
    trough.style.left = troughLeft + "px";
    trough.style.bottom = "42px";
    trough.style.width = troughWidth + "px";
    const homeW = 91, homeLeft = W - 100, homeTop = 130;
    const maxHomeH = H - homeTop - 24;
    const homeH = Math.max(140, Math.min(maxHomeH, (H - 130) * 0.78));
    POS.home = { x: homeLeft, y: homeTop, w: homeW, h: homeH };
    bigHome.style.left = homeLeft + "px";
    bigHome.style.top = homeTop + "px";
    bigHome.style.width = homeW + "px";
    bigHome.style.height = homeH + "px";
    const catW = 78;
    const troughTopY = H - 42 - 40;
    const eatY = troughTopY - 66;
    POS.eating = [];
    const eatLeft = troughLeft + 8;
    const eatRight = troughLeft + troughWidth - catW - 6;
    const eatWidth = Math.max(80, eatRight - eatLeft);
    let numEat = Math.floor(eatWidth / 80) + 1;
    numEat = Math.max(2, Math.min(CONFIG.maxEating, numEat));
    for (let i = 0; i < numEat; i++) {
      const t = numEat === 1 ? 0.5 : i / (numEat - 1);
      POS.eating.push({ x: eatLeft + (eatWidth - catW) * t, y: eatY });
    }
    const catH = 68;
    const grassTopY = H * 0.3;
    const eatZoneTop = eatY - 4;
    const waitBottomLimit = eatZoneTop - 34;
    const waitLeft = 78, waitRight = W - 108;
    const waitWidth = Math.max(120, waitRight - waitLeft);
    const minSpacing = 54;
    let cols = Math.max(3, Math.min(5, Math.floor(waitWidth / minSpacing) + 1));
    let rows = Math.ceil(CONFIG.maxWaitingCats / cols);
    if (rows > 2) rows = 2;
    const cellH = 46;
    let baseY = waitBottomLimit - (rows - 1) * cellH - catH;
    const minBaseY = grassTopY + 2;
    while (rows > 1 && baseY < minBaseY) {
      rows--;
      baseY = waitBottomLimit - (rows - 1) * cellH - catH;
    }
    if (baseY < minBaseY) baseY = minBaseY;
    POS.waiting = [];
    const cellW = waitWidth / cols;
    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < cols; col++) {
        const jx = (Math.random() - 0.5) * 10;
        const jy = (Math.random() - 0.5) * 6;
        const centerX = waitLeft + cellW * (col + 0.5);
        POS.waiting.push({ x: centerX - catW / 2 + jx, y: baseY + row * cellH + jy });
      }
    }
    POS.sleepSpots = [];
    const sleepRows = 4, sleepCols = 4;
    const sCellW = homeW / sleepCols;
    const sCellH = homeH / (sleepRows + 1);
    for (let row = 0; row < sleepRows; row++) {
      for (let col = 0; col < sleepCols; col++) {
        const jx = (Math.random() - 0.5) * sCellW * 0.35;
        const jy = (Math.random() - 0.5) * sCellH * 0.35;
        POS.sleepSpots.push({
          x: homeLeft + sCellW * (col + 0.5) + jx - catW / 2,
          y: homeTop + sCellH * (row + 1) + jy - 20

      return catSVG_Walk(state, palette, dirty, tailUp);

  function makeCat() {
    const cat = {
      id: catIdSeq++, state: "waiting", stateStart: performance.now(),
      nextIdleChange: performance.now() + 2000 + Math.random() * 4000,
      walkDir: "right",
      palette: CAT_PALETTES[Math.floor(Math.random() * CAT_PALETTES.length)],
      dirty: true, eatingSlot: -1, waitingSlot: -1, sleepSlot: -1,
      el: document.createElement("div")
    };
    cat.el.className = "cat state-waiting";
    cat.el.innerHTML = `<div class="cat-svg-wrap">${catSVG("waiting", cat.palette, true, false)}</div><div class="cat-chip">等待</div>`;
    catsLayer.appendChild(cat.el);
    return cat;
  }
  function refreshCatVisual(cat) {
    cat.el.className = "cat state-" + cat.state;
    if (cat.state === "walking_to_food") cat.el.classList.add("facing-left");
    else if (cat.state === "waiting_walk" && cat.walkDir === "left") cat.el.classList.add("facing-left");
    const tailUp = cat.state === "walking_to_home" || cat.state === "eating";
    cat.el.innerHTML = `<div class="cat-svg-wrap">${catSVG(cat.state, cat.palette, cat.dirty, tailUp)}</div><div class="cat-chip">${stateLabel(cat.state)}</div>`;
  }
  function moveCat(cat, x, y) { cat.el.style.left = x + "px"; cat.el.style.top = y + "px"; }

  function getFreeWaitingSlot() {
    const used = new Set(cats.filter(c => c.waitingSlot >= 0).map(c => c.waitingSlot));
    for (let i = 0; i < POS.waiting.length; i++) if (!used.has(i)) return i;
    return -1;
  }
  function getFreeEatingSlot() {
    const used = new Set(cats.filter(c => c.eatingSlot >= 0 && ["walking_to_food", "eating", "cleaning", "happy"].includes(c.state)).map(c => c.eatingSlot));
    for (let i = 0; i < POS.eating.length; i++) if (!used.has(i)) return i;
    return -1;
  }
  function getFreeSleepSlot() {
    const used = new Set(cats.filter(c => c.sleepSlot >= 0 && c.state === "sleeping").map(c => c.sleepSlot));
    for (let i = 0; i < POS.sleepSpots.length; i++) if (!used.has(i)) return i;
    return -1;
  }
  function spawnWaitingCat() {
    if (cats.length >= CONFIG.maxTotalCats) return;
    const wCount = cats.filter(c => c.state === "waiting" || c.state === "waiting_walk").length;
    if (wCount >= CONFIG.maxWaitingCats) return;
    if (POS.waiting.length === 0) return;
    const slot = getFreeWaitingSlot();
    if (slot < 0) return;
    const cat = makeCat();
    cat.waitingSlot = slot;
    const p = POS.waiting[slot];
    cat.el.style.left = p.x + "px";
    cat.el.style.top = p.y + "px";
    cats.push(cat);
  }
  function maxConcurrentByFood() {
    const s = foodStock;
    for (const r of CONFIG.troughConcurrency) if (s >= r.min && s <= r.max) return r.maxCats;
    return 0;
  }
  function trySendWaitingCat() {
    if (!gameActive) return;
    const using = cats.filter(c => c.state === "eating" || c.state === "cleaning" || c.state === "happy" || c.state === "walking_to_food").length;
    if (using >= CONFIG.maxEating) return;
    if (using >= maxConcurrentByFood()) return;
    if (foodStock <= 0) return;
    const waiter = cats.find(c => c.state === "waiting" || c.state === "waiting_walk");
    if (!waiter) return;
    const slot = getFreeEatingSlot();
    if (slot < 0) return;
    foodStock--; attractedCats++;
    waiter.eatingSlot = slot; waiter.waitingSlot = -1;
    waiter.state = "walking_to_food"; waiter.stateStart = performance.now();
    refreshCatVisual(waiter);
    const p = POS.eating[slot];
    moveCat(waiter, p.x, p.y);
    SoundManager.meow();
    updateHUD();
  }
  function tickCats() {
    const now = performance.now();
    for (const cat of cats) {
      const e = now - cat.stateStart;
      switch (cat.state) {
        case "waiting":
          if (now >= cat.nextIdleChange) {
            const p = POS.waiting[cat.waitingSlot];
            if (p && Math.random() < 0.55) {
              cat.state = "waiting_walk";
              cat.stateStart = now;
              cat.walkDir = Math.random() < 0.5 ? "left" : "right";
              cat.nextIdleChange = now + 2000 + Math.random() * 1800;
              const offset = (cat.walkDir === "right" ? 1 : -1) * (14 + Math.random() * 12);
              let nx = p.x + offset;
              nx = Math.max(70, Math.min(POS.W - 96 - 78, nx));
              moveCat(cat, nx, p.y);
              refreshCatVisual(cat);
            } else {
              cat.nextIdleChange = now + 3000 + Math.random() * 4000;
            }
          }
          break;
        case "waiting_walk":
          if (now >= cat.nextIdleChange) {
            const p = POS.waiting[cat.waitingSlot];
            if (p) moveCat(cat, p.x, p.y);
            cat.state = "waiting"; cat.stateStart = now;
            cat.nextIdleChange = now + 3000 + Math.random() * 4000;
            refreshCatVisual(cat);
          }
          break;
        case "walking_to_food":
          if (e >= CONFIG.catPhases.walkingToFood) { cat.state = "eating"; cat.stateStart = now; refreshCatVisual(cat); }
          break;
        case "eating":
          if (e >= CONFIG.catPhases.eating) { cat.state = "cleaning"; cat.stateStart = now; cat.dirty = false; refreshCatVisual(cat); }
          break;
        case "cleaning":
          if (e >= CONFIG.catPhases.cleaning) { cat.state = "happy"; cat.stateStart = now; refreshCatVisual(cat); }
          break;
        case "happy":
          if (e >= CONFIG.catPhases.happy) {
            const slot = getFreeSleepSlot();
            const idx = slot >= 0 ? slot : Math.floor(Math.random() * POS.sleepSpots.length);
            cat.sleepSlot = idx; cat.eatingSlot = -1;
            cat.state = "walking_to_home"; cat.stateStart = now;
            refreshCatVisual(cat);
            const p = POS.sleepSpots[idx];
            const jx = slot >= 0 ? 0 : (Math.random() - 0.5) * 10;
            const jy = slot >= 0 ? 0 : (Math.random() - 0.5) * 8;
            moveCat(cat, p.x + jx, p.y + jy);
          }
          break;
        case "walking_to_home":
          if (e >= CONFIG.catPhases.walkingToHome) {
            cat.state = "sleeping"; cat.stateStart = now;
            refreshCatVisual(cat); returnedCats++;
            SoundManager.returnHome();
            updateHUD();
          }
          break;
      }
    }
    trySendWaitingCat();
  }

  function spawnParticles(cells) {
    if (!cells || cells.length === 0) return;
    const mRect = foodMachine.getBoundingClientRect();
    const endX = mRect.left + mRect.width / 2, endY = mRect.top + mRect.height / 2;
    const count = Math.min(5, cells.length);
    const chosen = [...cells].sort(() => Math.random() - 0.5).slice(0, count);
    chosen.forEach(([r, c], i) => {
      const el = getTileEl(r, c);
      if (!el) return;
      const rect = el.getBoundingClientRect();
      const startX = rect.left + rect.width / 2, startY = rect.top + rect.height / 2;
      const sp = document.createElement("div");
      sp.className = "spark"; sp.style.left = startX + "px"; sp.style.top = startY + "px";
      document.body.appendChild(sp); setTimeout(() => sp.remove(), 420);
      setTimeout(() => {
        const p = document.createElement("div");
        p.className = "feed-particle";
        p.style.left = startX + "px"; p.style.top = startY + "px";
        p.style.transform = "translate(-50%, -50%) scale(1)";
        document.body.appendChild(p);
        requestAnimationFrame(() => {
          const dx = endX - startX, dy = endY - startY;
          p.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0.35)`;
          p.style.opacity = "0";
        });
        setTimeout(() => p.remove(), 780);
      }, i * 40);
    });
  }

  function generateBoard() {
    for (let attempt = 0; attempt < 200; attempt++) {
      const b = Array.from({ length: CONFIG.boardSize }, () => Array(CONFIG.boardSize).fill(null));
      for (let r = 0; r < CONFIG.boardSize; r++) {
        for (let c = 0; c < CONFIG.boardSize; c++) {
          const forbid = new Set();
          if (c >= 2 && b[r][c - 1] === b[r][c - 2]) forbid.add(b[r][c - 1]);
          if (r >= 2 && b[r - 1][c] === b[r - 2][c]) forbid.add(b[r - 1][c]);
          const opts = CONFIG.tileTypes.filter(t => !forbid.has(t));
          b[r][c] = opts[Math.floor(Math.random() * opts.length)];
        }
      }
      if (hasPossibleMove(b)) return b;
    }
    return Array.from({ length: CONFIG.boardSize }, () => Array.from({ length: CONFIG.boardSize }, () => randomTile()));
  }
  function findMatches(b) {
    const groups = []; const size = CONFIG.boardSize;
    for (let r = 0; r < size; r++) {
      let c = 0;
      while (c < size) {
        const t = b[r][c]; let len = 1;
        while (c + len < size && b[r][c + len] === t) len++;
        if (len >= 3) { const cells = []; for (let i = 0; i < len; i++) cells.push([r, c + i]); groups.push({ cells, length: len }); }
        c += len;
      }
    }
    for (let c = 0; c < size; c++) {
      let r = 0;
      while (r < size) {
        const t = b[r][c]; let len = 1;
        while (r + len < size && b[r + len][c] === t) len++;
        if (len >= 3) { const cells = []; for (let i = 0; i < len; i++) cells.push([r + i, c]); groups.push({ cells, length: len }); }
        r += len;
      }
    }
    return groups;
  }
  function hasPossibleMove(b) {
    const size = CONFIG.boardSize;
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        if (c < size - 1) {
          swap(b, r, c, r, c + 1); const ok = findMatches(b).length > 0; swap(b, r, c, r, c + 1);
          if (ok) return true;
        }
        if (r < size - 1) {
          swap(b, r, c, r + 1, c); const ok = findMatches(b).length > 0; swap(b, r, c, r + 1, c);
          if (ok) return true;
        }
      }
    }
    return false;
  }
  function scoreForLength(len) {
    if (len === 3) return CONFIG.scoreTable[3];
    if (len === 4) return CONFIG.scoreTable[4];
    if (len === 5) return CONFIG.scoreTable[5];
    return CONFIG.score6Base + (len - 6) * CONFIG.score6Extra;
  }
  function applyGravity() {
    const size = CONFIG.boardSize;
    for (let c = 0; c < size; c++) {
      let write = size - 1;
      for (let r = size - 1; r >= 0; r--) {
        if (board[r][c] !== null) {
          board[write][c] = board[r][c];
          if (write !== r) board[r][c] = null;
          write--;
        }
      }
      while (write >= 0) { board[write][c] = randomTile(); write--; }
    }
  }
  function renderBoard() {
    boardEl.innerHTML = "";
    const size = CONFIG.boardSize;
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        const tile = document.createElement("div");
        tile.className = "tile";
        tile.dataset.r = r; tile.dataset.c = c; tile.dataset.type = board[r][c];
        tile.textContent = CONFIG.tileEmoji[board[r][c]];
        tile.addEventListener("click", () => onTileClick(r, c));
        boardEl.appendChild(tile);
      }
    }
    updateSelection();
    resizeBoard();
  }
  function updateSelection() {
    boardEl.querySelectorAll(".tile.selected").forEach(el => el.classList.remove("selected"));
    if (selected) { const el = getTileEl(selected.r, selected.c); if (el) el.classList.add("selected"); }
  }
  function resizeBoard() {
    const hint = document.getElementById("hintBottom");
    const bar = document.getElementById("bottomBar");
    const rect = boardArea.getBoundingClientRect();
    const style = getComputedStyle(boardArea);
    const padLeft = parseFloat(style.paddingLeft) || 0;
    const padRight = parseFloat(style.paddingRight) || 0;
    const padTop = parseFloat(style.paddingTop) || 0;
    const padBottom = parseFloat(style.paddingBottom) || 0;
    const availW = rect.width - padLeft - padRight - 4;
    const used = (hint ? hint.offsetHeight : 0) + (bar ? bar.offsetHeight : 30) + 20;
    const availH = rect.height - padTop - padBottom - used;
    const size = Math.max(140, Math.min(availW, availH));
    boardEl.style.width = size + "px";
    boardEl.style.height = size + "px";
    boardEl.style.setProperty("--tile-size", size / CONFIG.boardSize + "px");
    progressTrack.style.height = size + "px";
  }

  async function onTileClick(r, c) {
    SoundManager.init();
    if (!gameActive || isAnimating || timeLeft <= 0) return;

    // 联机模式：发送到服务端
    if (NetworkClient.getMode() === 'online') {
      if (selected === null) { selected = { r, c }; updateSelection(); SoundManager.click(); return; }
      const s = selected;
      if (s.r === r && s.c === c) { selected = null; updateSelection(); return; }
      const adjacent = Math.abs(s.r - r) + Math.abs(s.c - c) === 1;
      if (!adjacent) { selected = { r, c }; updateSelection(); return; }
      selected = null; updateSelection();
      NetworkClient.sendSwap(s.r, s.c, r, c);
      return;
    }

    // 单机模式
    if (selected === null) { selected = { r, c }; updateSelection(); SoundManager.click(); return; }
    const s = selected;
    if (s.r === r && s.c === c) { selected = null; updateSelection(); return; }
    const adjacent = Math.abs(s.r - r) + Math.abs(s.c - c) === 1;
    if (!adjacent) { selected = { r, c }; updateSelection(); return; }
    selected = null; updateSelection();
    await trySwap(s.r, s.c, r, c);
  }

  async function trySwap(r1, c1, r2, c2) {
    if (!gameActive) return;
    isAnimating = true;
    swap(board, r1, c1, r2, c2);
    const first = findMatches(board);
    if (first.length === 0) {
      swap(board, r1, c1, r2, c2); renderBoard();
      SoundManager.invalid();
      const el = getTileEl(r1, c1);
      if (el) { el.classList.add("invalid"); setTimeout(() => el.classList.remove("invalid"), 320); }
      isAnimating = false;
      return;
    }
    const now = performance.now();
    if (now - lastMatchTime <= CONFIG.comboWindow) comboLevel = Math.min(comboLevel + 1, 5);
    else comboLevel = 0;
    maxCombo = Math.max(maxCombo, comboLevel);
    lastMatchTime = now;
    let chainLevel = 0, current = first;
    while (current.length > 0) {
      const removeSet = new Set(); let base = 0;
      for (const g of current) {
        base += scoreForLength(g.length);
        for (const [r, c] of g.cells) removeSet.add(`${r},${c}`);
      }
      const chainMul = 1 + Math.min(chainLevel * CONFIG.chainBonusStep, CONFIG.chainBonusMax);
      const comboMul = 1 + Math.min(comboLevel * CONFIG.comboStep, CONFIG.comboMax);
      const gained = Math.round(base * chainMul * comboMul);
      addScore(gained);
      SoundManager.match(current[0].length);
      const removeCells = [...removeSet].map(k => k.split(",").map(Number));
      spawnParticles(removeCells); shakeBoard();
      removeSet.forEach(k => {
        const [r, c] = k.split(",").map(Number);
        const el = getTileEl(r, c);
        if (el) el.classList.add("pop");
      });
      await sleep(320);
      removeSet.forEach(k => {
        const [r, c] = k.split(",").map(Number);
        board[r][c] = null;
      });
      applyGravity(); renderBoard(); await sleep(180);
      current = findMatches(board); chainLevel++;
      if (current.length > 0) { showChainBanner(chainLevel); await sleep(450); }
    }
    isAnimating = false; ensurePlayable(); updateHUD();
  }

  function ensurePlayable() {
    if (!hasPossibleMove(board)) { showToast("没有可交换步数，正在整理棋盘"); shuffleBoard(); }
  }
  function shuffleBoard() {
    const size = CONFIG.boardSize;
    let attempts = 0;
    do {
      const tiles = [];
      for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) tiles.push(board[r][c]);
      for (let i = tiles.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [tiles[i], tiles[j]] = [tiles[j], tiles[i]]; }
      let idx = 0;
      for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) board[r][c] = tiles[idx++];
      attempts++;
    } while ((findMatches(board).length > 0 || !hasPossibleMove(board)) && attempts < 500);
    if (findMatches(board).length > 0 || !hasPossibleMove(board)) board = generateBoard();
    renderBoard();
  }

  function addScore(points) {
    score += points; foodProgress += points;
    let produced = false;
    while (foodProgress >= CONFIG.foodPerScore && foodStock < CONFIG.troughCap) {
      foodStock++; foodProgress -= CONFIG.foodPerScore; produced = true;
    }
    if (produced && !progressAnimating) {
      progressAnimating = true;
      progressFill.style.transition = "height .25s cubic-bezier(.3,.8,.4,1)";
      progressFill.style.height = "100%";
      progressTrack.classList.add("full");
      animateMachineProduce();
      setTimeout(() => {
        progressTrack.classList.remove("full");
        progressFill.style.transition = "height .5s cubic-bezier(.3,.8,.4,1)";
        const pct = foodStock >= CONFIG.troughCap ? 100 : Math.min(100, (foodProgress / CONFIG.foodPerScore) * 100);
        progressFill.style.height = pct + "%";
        progressAnimating = false;
      }, 400);
    } else if (!progressAnimating) updateProgressBar();
    updateHUD();
    showFloatingScore(points);
  }
  function updateProgressBar() {
    if (progressAnimating) return;
    let pct;
    if (foodStock >= CONFIG.troughCap) { pct = 100; progressTrack.classList.add("full"); }
    else { pct = Math.min(100, (foodProgress / CONFIG.foodPerScore) * 100); progressTrack.classList.remove("full"); }
    progressFill.style.transition = "height .32s cubic-bezier(.3,.8,.4,1)";
    progressFill.style.height = pct + "%";
  }
  function showFloatingScore(points) {
    const el = document.createElement("div");
    el.className = "floating-score"; el.textContent = "+" + points;
    const rect = boardEl.getBoundingClientRect();
    el.style.left = (rect.left + rect.width / 2) + "px";
    el.style.top = (rect.top + rect.height / 2) + "px";
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 950);
  }
  function showToast(msg) {
    const el = document.createElement("div");
    el.className = "toast"; el.textContent = msg;
    document.body.appendChild(el); setTimeout(() => el.remove(), 1950);
  }

  function updateHUD() {
    timeText.textContent = Math.ceil(Math.max(0, timeLeft));
    returnText.textContent = returnedCats;
    scoreText.textContent = score;
    foodText.textContent = foodStock;
    comboText.textContent = "x" + comboLevel;
    troughFill.style.width = (foodStock / CONFIG.troughCap) * 100 + "%";
    renderKibbles();
  }

  function renderKibbles() {
    troughKibbles.innerHTML = "";
    if (foodStock <= 0) return;
    const total = foodStock;
    const W = troughKibbles.clientWidth || 200, H = troughKibbles.clientHeight || 28;
    const perRow = Math.max(6, Math.min(total, Math.ceil(Math.sqrt(total * 4))));
    const rows = Math.ceil(total / perRow);
    const cellW = W / perRow, cellH = H / Math.max(1, rows);
    for (let i = 0; i < total; i++) {
      const r = Math.floor(i / perRow), c = i % perRow;
      const k = document.createElement("div");
      k.className = "kibble";
      const jx = (Math.random() - 0.5) * cellW * 0.4;
      const jy = (Math.random() - 0.5) * cellH * 0.4;
      k.style.left = (c * cellW + cellW * 0.5 - 3.5 + jx) + "px";
      k.style.top = (H - (rows - r - 1) * cellH - cellH * 0.5 - 3 + jy) + "px";
      troughKibbles.appendChild(k);
    }
  }

  function onCountdownTick() {
    if (!gameActive) return;
    timeLeft -= 0.1;
    const sec = Math.ceil(timeLeft);
    if (sec <= 10 && sec > 0 && sec !== lastTickSecond) {
      lastTickSecond = sec;
      SoundManager.tick();
    }
    if (timeLeft <= 0) { timeLeft = 0; updateHUD(); endGame(); return; }
    updateHUD();
  }
  function onGameTick() { if (!gameActive) return; tickCats(); }
  function onCatSpawnTick() {
    if (!gameActive) return;
    const wCount = cats.filter(c => c.state === "waiting" || c.state === "waiting_walk").length;
    if (wCount < CONFIG.maxWaitingCats) spawnWaitingCat();
  }

  function startGame() {
    clearAllTimers();
    catsLayer.innerHTML = ""; cats = []; catIdSeq = 1;
    score = 0; foodStock = 0; foodProgress = 0;
    comboLevel = 0; maxCombo = 0; lastMatchTime = 0;
    timeLeft = CONFIG.roundTime;
    returnedCats = 0; attractedCats = 0;
    gameActive = true; isAnimating = false; selected = null;
    progressAnimating = false; lastTickSecond = -1;

    board = generateBoard();
    renderTroughMarks();
    resultOverlay.classList.add("hidden");
    renderBoard();
    updateHUD();
    renderKibbles();
    updateProgressBar();
    computePositions();

    for (let i = 0; i < CONFIG.initialWaitingCats; i++) spawnWaitingCat();

    showStartBanner();
    SoundManager.start();

    timers.countdown = setInterval(onCountdownTick, 100);
    timers.gameTick = setInterval(onGameTick, 100);
    timers.catSpawn = setInterval(onCatSpawnTick, CONFIG.catSpawnInterval);
  }
  function endGame() {
    if (!gameActive) return;
    gameActive = false; isAnimating = true; selected = null;
    clearAllTimers();
    SoundManager.end();
    resultReturns.textContent = returnedCats;
    resultScore.textContent = score;
    resultCombo.textContent = maxCombo;
    resultCats.textContent = attractedCats;
    resultOverlay.classList.remove("hidden");
  }
  function relayoutCats() {
    for (const cat of cats) {
      if ((cat.state === "waiting" || cat.state === "waiting_walk") && cat.waitingSlot >= 0) {
        const p = POS.waiting[cat.waitingSlot];
        if (cat.state === "waiting") moveCat(cat, p.x, p.y);
      }
      else if (cat.eatingSlot >= 0 && ["walking_to_food", "eating", "cleaning", "happy"].includes(cat.state)) {
        const p = POS.eating[cat.eatingSlot]; moveCat(cat, p.x, p.y);
      }
      else if (cat.sleepSlot >= 0 && ["walking_to_home", "sleeping"].includes(cat.state)) {
        const p = POS.sleepSpots[cat.sleepSlot]; moveCat(cat, p.x, p.y);
      }
    }
  }

  // ===================== 联机回调 =====================
  NetworkClient.onState((msg) => {
    board = msg.board;
    timeLeft = msg.timeLeft;
    if (Array.isArray(msg.cats)) {
      const newIds = new Set(msg.cats.map(c => c.id));
      cats = cats.filter(c => newIds.has(c.id));
      for (const sc of msg.cats) {
        let cat = cats.find(c => c.id === sc.id);
        if (!cat) { cat = makeCat(); cat.id = sc.id; cats.push(cat); }
        if (cat.state !== sc.state) {
          cat.state = sc.state;
          cat.stateStart = performance.now();
          refreshCatVisual(cat);
        }
        moveCat(cat, sc.x, sc.y);
      }
    }
    // 联机时，自己的分数从 players 里取
    const me = NetworkClient.getPlayerId();
    if (me && msg.players && msg.players[me]) {
      score = msg.players[me].score;
      foodStock = msg.players[me].foodStock;
      returnedCats = msg.players[me].returnedCats;
    }
    renderBoard(); updateHUD(); updateProgressBar();
  });
  NetworkClient.onEvent((msg) => {
    if (msg.kind === 'match') {
      msg.cells.forEach(([r, c]) => {
        const el = getTileEl(r, c);
        if (el) el.classList.add('pop');
      });
      spawnParticles(msg.cells); shakeBoard();
      SoundManager.match(msg.length || 3);
      showFloatingScore(msg.gain);
    } else if (msg.kind === 'invalid') {
      SoundManager.invalid();
    } else if (msg.kind === 'swap_result') {
      if (msg.board) board = msg.board;
      renderBoard();
      for (const ev of msg.events) {
        if (ev.kind === 'match' && ev.chain > 0) showChainBanner(ev.chain);
      }
    }
  });
  NetworkClient.onJoined((msg) => {
    showToast('已加入房间 ' + msg.room);
  });
  NetworkClient.onDisconnected(() => {
    showToast('连接已断开，切换到单机模式');
  });
  NetworkClient.onRoundEnd((msg) => {
    gameActive = false;
    resultOverlay.classList.remove('hidden');
  });

  restartBtn.addEventListener("click", () => requestAnimationFrame(() => startGame()));
  window.addEventListener("resize", () => {
    resizeBoard(); computePositions(); renderKibbles(); renderTroughMarks(); relayoutCats();
  });
  window.addEventListener("load", () => {
    requestAnimationFrame(() => {
      startGame(); resizeBoard(); computePositions(); renderKibbles();
    });
    // 如需联机：取消下面注释，把 URL 改成你的服务端地址
    // NetworkClient.connect('ws://localhost:8080', { room: 'room1', name: '我的猫' })
    //   .then(() => console.log('联机已连接'))
    //   .catch(e => console.warn('联机失败，保持单机模式', e));
  });
})();
</script>
