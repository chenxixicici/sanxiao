<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>猫咪三消养成 V3.0</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f7e8cf; color: #4a3524; user-select: none; }
  .hidden { display: none !important; }

  /* ============ 模式选择 ============ */
  #modeSelect {
    position: fixed; inset: 0; z-index: 900;
    background: linear-gradient(180deg, #b8e0f5 0%, #d9f0e0 45%, #86c269 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px; gap: 14px;
  }
  #modeSelect h1 { margin: 0 0 6px; font-size: 28px; color: #5a3a1a;
    text-shadow: 0 2px 0 #fff8e0; letter-spacing: 1.5px; }
  #modeSelect .sub { color: #6b5a44; font-size: 13px; margin-bottom: 18px; }
  .mode-card {
    width: min(92vw, 380px); padding: 16px 20px;
    background: linear-gradient(180deg, #fffdf5, #ffefd3);
    border-radius: 20px; border: 2px solid #f0cfa0;
    box-shadow: 0 8px 20px rgba(120, 80, 40, .2), inset 0 1px 0 rgba(255,255,255,.9);
    display: flex; align-items: center; gap: 14px;
    cursor: pointer; transition: transform .15s ease, box-shadow .15s ease;
  }
  .mode-card:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(120, 80, 40, .28); }
  .mode-card:active { transform: translateY(0); }
  .mode-icon { font-size: 36px; line-height: 1; flex: 0 0 auto; }
  .mode-text { flex: 1; }
  .mode-title { font-size: 18px; font-weight: 900; color: #5a3a1a; margin-bottom: 2px; }
  .mode-desc { font-size: 12px; color: #8a6a40; line-height: 1.3; }

  /* ============ 通用游戏布局 ============ */
  #game { height: 100vh; height: 100dvh; max-width: 520px; margin: 0 auto;
    display: flex; flex-direction: column; position: relative; background: #f7e8cf; overflow: hidden; }
  #topArea { flex: 0 0 auto; min-height: 260px; max-height: 48vh;
    position: relative; overflow: hidden;
    border-bottom-left-radius: 24px; border-bottom-right-radius: 24px;
    box-shadow: 0 8px 20px rgba(90, 120, 70, 0.22);
    background: linear-gradient(180deg, #b8e0f5 0%, #c8e8f0 15%, #d9f0e0 25%, #c8e8b0 32%, #a8d68e 45%, #86c269 100%); }
  #topArea.singleMode { height: 48vh; height: 48dvh; }
  #topArea.battleMode { height: 44vh; height: 44dvh; }
  .cloud { position: absolute; background: rgba(255,255,255,.95); border-radius: 999px; pointer-events: none; }
  .cloud::before, .cloud::after { content: ""; position: absolute; background: inherit; border-radius: 50%; }
  .cloud.c1 { top: 66px; left: 6%; width: 50px; height: 16px; }
  .cloud.c1::before { width: 24px; height: 24px; top: -13px; left: 6px; }
  .cloud.c1::after { width: 18px; height: 18px; top: -9px; left: 26px; }
  .cloud.c2 { top: 88px; left: 40%; width: 40px; height: 14px; opacity: .8; }
  .cloud.c2::before { width: 20px; height: 20px; top: -10px; left: 5px; }
  .cloud.c2::after { width: 14px; height: 14px; top: -7px; left: 21px; }
  #sun { position: absolute; top: 50px; right: 14px; width: 30px; height: 30px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff8c4, #ffd54f 55%, #f7b733);
    box-shadow: 0 0 26px rgba(255, 213, 79, .8); pointer-events: none; z-index: 2; }
  #grass { position: absolute; left: 0; right: 0; bottom: 0; height: 70%;
    background: linear-gradient(180deg, rgba(168, 214, 142, 0) 0%, #a8d68e 15%, #7dba63 100%); z-index: 1; pointer-events: none; }

  /* HUD */
  #hud { position: absolute; top: 0; left: 0; right: 0; height: 56px;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 6px 8px; z-index: 22; pointer-events: none; gap: 4px; }
  .hud-item { background: linear-gradient(180deg, #fffdf5, #ffeccf); border-radius: 999px;
    padding: 3px 10px 4px 8px; min-width: 78px; display: flex; align-items: center; gap: 5px;
    box-shadow: 0 3px 0 #d9a86c, 0 4px 10px rgba(120, 80, 40, .18);
    border: 1.5px solid #f0cfa0; }
  .hud-icon { font-size: 18px; line-height: 1; }
  .hud-text { display: flex; flex-direction: column; line-height: 1.05; }
  .hud-label { font-size: 8px; color: #a07a50; font-weight: 700; }
  .hud-value { font-size: 18px; font-weight: 900; color: #5a3a1a; font-variant-numeric: tabular-nums; }
  .hud-item.me { border-color: #7ed957; }
  .hud-item.opp { border-color: #ff7b8a; background: linear-gradient(180deg, #fff0f2, #ffe0e4); }
  .hud-item.opp .hud-value { color: #c0333f; }

  #scene { position: absolute; inset: 0; padding-top: 56px; z-index: 2; }

  /* ============ 个人模式布局 ============ */
  #singleLayout { position: absolute; inset: 0; }
  #leftColumn { position: absolute; left: 6px; width: 70px;
    display: flex; flex-direction: column; align-items: center;
    gap: 6px; z-index: 30; pointer-events: none; }
  #foodMachine { position: relative; width: 62px; height: 78px;
    filter: drop-shadow(0 5px 8px rgba(60, 90, 120, .3));
    transform-origin: center bottom; pointer-events: auto; }
  #foodMachine.producing { animation: machineProduce .55s cubic-bezier(.3,1.4,.5,1); }
  @keyframes machineProduce { 0%{transform:scale(1)} 25%{transform:scale(1.08)} 50%{transform:scale(1.12)} 100%{transform:scale(1)} }
  .machine-body { position: absolute; inset: 12px 0 0 0;
    background: linear-gradient(180deg, #f5e6cf 0%, #e8cfa8 45%, #d4b07a 100%);
    border-radius: 10px;
    box-shadow: inset 0 3px 0 rgba(255,255,255,.8), inset 0 -4px 8px rgba(0,0,0,.12); }
  .mach-slot { position: absolute; top: 8px; left: 10px; right: 10px; height: 8px; border-radius: 5px;
    background: rgba(60, 40, 20, .25); }
  .mach-light { position: absolute; top: 22px; right: 10px; width: 7px; height: 7px; border-radius: 50%;
    background: #ffe082; box-shadow: 0 0 10px #ffd54f; animation: machBlink 1.6s ease-in-out infinite; }
  @keyframes machBlink { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  .mach-label { position: absolute; top: 16px; left: 0; right: 0; text-align: center;
    font-size: 7px; font-weight: 900; color: #8a6a40; }
  .mach-spout { position: absolute; top: 2px; left: 50%; transform: translateX(-50%);
    width: 22px; height: 12px;
    background: linear-gradient(180deg, #d8c8a8, #b8a888);
    border-radius: 6px 6px 2px 2px; z-index: 3; }
  #progressTrack { position: relative; width: 20px; height: 260px;
    background: linear-gradient(180deg, rgba(120,80,40,.15), rgba(120,80,40,.3));
    border-radius: 11px; border: 2px solid #e8b87a; overflow: hidden; pointer-events: auto; }
  #progressFill { position: absolute; left: 0; right: 0; bottom: 0; height: 0%;
    background: linear-gradient(0deg, #e29a25 0%, #f6c34a 45%, #ffe082 100%);
    border-radius: 9px; transition: height .3s cubic-bezier(.3,.8,.4,1);
    box-shadow: 0 0 10px rgba(255,200,80,.7); z-index: 2; }
  #progressTrack.full #progressFill { animation: barPulse 1s ease-in-out infinite; }
  @keyframes barPulse { 0%,100%{box-shadow:0 0 10px rgba(255,200,80,.7)} 50%{box-shadow:0 0 24px rgba(255,220,100,1)} }

  #trough { position: absolute; z-index: 9; height: 34px; border-radius: 18px;
    background: linear-gradient(180deg, #e8c9a0 0%, #c9a06a 50%, #a87c48 100%);
    padding: 3px;
    box-shadow: 0 4px 10px rgba(90,60,30,.35), inset 0 2px 0 rgba(255,255,255,.5); }
  #troughInner { position: relative; width: 100%; height: 100%; border-radius: 15px;
    background: linear-gradient(180deg, #5a4630, #2f2318); overflow: hidden;
    box-shadow: inset 0 3px 6px rgba(0,0,0,.55); }
  #troughFill { position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
    background: linear-gradient(180deg, #f6c34a 0%, #e29a25 65%, #b8791a 100%);
    transition: width .45s ease; z-index: 1; }
  #troughKibbles { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
  .kibble { position: absolute; width: 6px; height: 5px;
    background: radial-gradient(circle at 35% 30%, #ffd977, #c98a20 75%, #8d5a10);
    border-radius: 45% 55% 50% 50%; }

  #bigHome { position: absolute; z-index: 5; border-radius: 50% / 42%;
    background: radial-gradient(ellipse at 50% 20%, #f8d8a0 0%, #e8a860 35%, #c98840 70%, #a86b30 100%);
    box-shadow: inset 0 14px 24px rgba(255,240,200,.55), inset 0 -16px 30px rgba(80,40,10,.35),
      inset 0 0 0 6px rgba(210,160,90,.5), 0 12px 28px rgba(90,60,30,.48);
    overflow: hidden; }
  #bigHomeInner { position: absolute; left: 11%; right: 11%; top: 17%; bottom: 22%;
    border-radius: 50% / 38%;
    background: radial-gradient(ellipse at 50% 30%, #55402a, #2a1f14);
    box-shadow: inset 0 10px 22px rgba(0,0,0,.8); overflow: hidden; }
  #bigHomeCushion { position: absolute; left: 12%; right: 12%; top: 22%; bottom: 26%;
    border-radius: 50% / 42%;
    background: radial-gradient(ellipse at 50% 25%, #fff1c8 0%, #ffd88a 45%, #e8a860 100%); }
  #bigHomeLabel { position: absolute; top: 5%; left: 0; right: 0; text-align: center;
    font-size: 10px; font-weight: 900; color: #7a4d1f; letter-spacing: 1px; z-index: 3; }

  /* ============ 对战模式布局 ============ */
  #battleLayout { position: absolute; inset: 0; display: none; }
  #topArea.battleMode #battleLayout { display: block; }
  #topArea.singleMode #singleLayout { display: block; }
  #topArea.singleMode #battleLayout { display: none; }
  #topArea.battleMode #singleLayout { display: none; }

  /* 对战：左右两侧的猫粮机+食槽 */
  .sidePanel { position: absolute; z-index: 9; width: 96px; }
  .sidePanel .sideName { text-align: center; font-size: 10px; font-weight: 900;
    color: #5a3a1a; margin-bottom: 3px; text-shadow: 0 1px 0 rgba(255,255,255,.6); }
  .sidePanel .sideMachWrap { display: flex; justify-content: center; margin-bottom: 4px; }
  .sidePanel .sideMachine { position: relative; width: 52px; height: 64px; }
  .sidePanel .sideMachine .machine-body { position: absolute; inset: 10px 0 0 0;
    background: linear-gradient(180deg, #f5e6cf 0%, #e8cfa8 45%, #d4b07a 100%);
    border-radius: 8px;
    box-shadow: inset 0 2px 0 rgba(255,255,255,.8), inset 0 -3px 6px rgba(0,0,0,.12); }
  .sidePanel .sideMachine .mach-spout { position: absolute; top: 1px; left: 50%; transform: translateX(-50%);
    width: 18px; height: 10px;
    background: linear-gradient(180deg, #d8c8a8, #b8a888);
    border-radius: 5px 5px 2px 2px; z-index: 3; }
  .sidePanel .sideMachine .mach-label { position: absolute; top: 14px; left: 0; right: 0;
    text-align: center; font-size: 6px; font-weight: 900; color: #8a6a40; }
  .sidePanel .sideTrough { position: relative; height: 26px; border-radius: 13px;
    background: linear-gradient(180deg, #e8c9a0 0%, #c9a06a 50%, #a87c48 100%);
    padding: 2px;
    box-shadow: 0 3px 8px rgba(90,60,30,.3); }
  .sidePanel .sideTroughInner { position: relative; width: 100%; height: 100%; border-radius: 11px;
    background: linear-gradient(180deg, #5a4630, #2f2318); overflow: hidden;
    box-shadow: inset 0 2px 4px rgba(0,0,0,.5); }
  .sidePanel .sideTroughFill { position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
    background: linear-gradient(180deg, #f6c34a 0%, #e29a25 65%, #b8791a 100%);
    transition: width .3s ease; }
  .sidePanel .sideKibbles { position: absolute; inset: 0; pointer-events: none; }
  .sidePanel .sideKibbles .k { position: absolute; width: 4px; height: 3px;
    background: radial-gradient(circle at 35% 30%, #ffd977, #c98a20 75%, #8d5a10);
    border-radius: 45% 55% 50% 50%; }
  .sidePanel .sideStock { text-align: center; font-size: 10px; font-weight: 900;
    color: #5a3a1a; margin-top: 3px; text-shadow: 0 1px 0 rgba(255,255,255,.6); }
  .sidePanel.me { left: 6px; top: 4px; }
  .sidePanel.opp { right: 6px; top: 4px; }
  .sidePanel.opp .sideName { color: #c0333f; }
  .sidePanel.opp .sideMachine .machine-body {
    background: linear-gradient(180deg, #ffd8dc 0%, #f5b8c0 45%, #e89aa0 100%); }

  /* 对战：共享猫咪池 */
  #sharedPool {
    position: absolute; left: 108px; right: 108px; top: 8px; bottom: 8px;
    background: rgba(255, 255, 255, .35);
    border: 2px dashed rgba(255, 255, 255, .8);
    border-radius: 16px; z-index: 7;
    box-shadow: inset 0 2px 8px rgba(90, 120, 70, .15);
    overflow: hidden;
  }
  #sharedPoolLabel {
    position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
    background: linear-gradient(180deg, #fffdf5, #ffeccf);
    padding: 1px 8px; border-radius: 8px;
    font-size: 9px; font-weight: 900; color: #8a6a40;
    border: 1.5px solid #f0cfa0; white-space: nowrap; z-index: 3;
    box-shadow: 0 1px 3px rgba(120, 80, 40, .15);
  }
  #poolCats { position: absolute; inset: 0; }

  /* 猫咪（复用） */
  .cat { position: absolute; width: 56px; height: 50px;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    transition: left 1.05s cubic-bezier(.45,.05,.55,.95), top 1.05s cubic-bezier(.45,.05,.55,.95), opacity .4s ease;
    z-index: 10; pointer-events: none; }
  .cat-svg-wrap { width: 56px; height: 46px;
    display: flex; align-items: flex-end; justify-content: center;
    position: relative; transition: transform .3s; }
  .cat.facing-left .cat-svg-wrap { transform: scaleX(-1); }
  .cat-svg-wrap svg { width: 54px; height: 44px; overflow: visible;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,.18)); }
  .cat-chip { font-size: 7px; font-weight: 800; padding: 0px 5px; border-radius: 6px;
    background: rgba(255,255,255,.9); color: #4a3524;
    margin-top: -3px; white-space: nowrap; border: 1px solid rgba(255,255,255,.8); }

  /* 对战模式下方棋盘 */
  #boardArea { flex: 1 1 auto; min-height: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 6px 8px 8px 82px;
    position: relative;
    background: radial-gradient(circle at 50% 0%, #fff8e8 0%, #ffeed0 60%, #fbe1b5 100%);
    gap: 4px; }
  #boardArea.singleMode { padding: 6px 8px 8px 90px; }
  #boardArea.battleMode { padding: 6px 8px 8px 8px; }

  #board { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr);
    gap: 3px; padding: 6px;
    background: linear-gradient(180deg, #e8c9a0, #c9a06a);
    border-radius: 18px;
    box-shadow: 0 10px 24px rgba(120,80,40,.28), inset 0 2px 0 rgba(255,255,255,.6);
    touch-action: none; flex: 0 0 auto; transition: transform .12s ease; }
  #board.shake { animation: boardShake .22s ease; }
  @keyframes boardShake { 0%,100%{transform:translate(0,0)} 25%{transform:translate(-1px,.5px)} 50%{transform:translate(1px,-.5px)} 75%{transform:translate(-.5px,1px)} }
  .tile { display: flex; align-items: center; justify-content: center;
    border-radius: 9px; font-size: calc(var(--tile-size, 40px) * .55);
    line-height: 1; border: 2px solid transparent; cursor: pointer;
    transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
    box-shadow: inset 0 2px 0 rgba(255,255,255,.8); }
  .tile[data-type="paw"] { background: linear-gradient(180deg, #ffe0d0, #ffc8b0); }
  .tile[data-type="fish"] { background: linear-gradient(180deg, #d0e8ff, #b0d4ff); }
  .tile[data-type="yarn"] { background: linear-gradient(180deg, #d8f0c8, #b8e0a0); }
  .tile[data-type="cookie"] { background: linear-gradient(180deg, #ffefc0, #ffe0a0); }
  .tile[data-type="milk"] { background: linear-gradient(180deg, #f0e8ff, #e0d0ff); }
  .tile.selected { transform: scale(1.10); border-color: #ff9f43;
    box-shadow: 0 0 0 2px #ff9f43 inset, 0 0 14px rgba(255,159,67,.7); }
  .tile.invalid { animation: shake .3s ease; }
  .tile.pop { animation: popBig .32s cubic-bezier(.4,0,.7,1) forwards; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-3px)} 75%{transform:translateX(3px)} }
  @keyframes popBig { 0%{transform:scale(1);opacity:1} 40%{transform:scale(1.35) rotate(8deg);opacity:1;box-shadow:0 0 20px 6px rgba(255,220,120,.9)} 100%{transform:scale(0) rotate(-25deg);opacity:0} }
  #bottomBar { height: 30px; flex: 0 0 auto;
    display: flex; gap: 12px; align-items: center; justify-content: center;
    font-size: 12px; color: #6b5a44; white-space: nowrap;
    background: linear-gradient(180deg, #fff6e0, #ffe4b8);
    padding: 0 14px; border-radius: 999px; border: 1.5px solid #e8b87a; }
  #bottomBar strong { color: #5a3a1a; font-size: 14px; font-weight: 900; font-variant-numeric: tabular-nums; }

  /* 顶部返回按钮 */
  #btnBack { position: absolute; left: 6px; top: 6px; z-index: 40;
    width: 34px; height: 34px; border-radius: 50%;
    background: linear-gradient(180deg, #fffdf5, #ffeccf);
    border: 1.5px solid #f0cfa0;
    box-shadow: 0 3px 0 #d9a86c, 0 4px 10px rgba(120, 80, 40, .2);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: #8a6a40; font-weight: 900;
    transition: transform .12s ease;
  }
  #btnBack:active { transform: translateY(2px); }

  /* 匹配等待遮罩 */
  #waitOverlay { position: fixed; inset: 0; z-index: 800;
    background: rgba(40, 30, 20, .65);
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(4px); }
  .wait-card { background: linear-gradient(180deg, #fff9ec, #ffefd3);
    border-radius: 24px; padding: 28px 24px 22px;
    width: min(88vw, 340px); text-align: center;
    box-shadow: 0 18px 44px rgba(0,0,0,.35); }
  .wait-card h2 { margin: 0 0 12px; font-size: 22px; color: #e67e22; letter-spacing: 1px; }
  .wait-card .spinner { width: 46px; height: 46px; border-radius: 50%;
    border: 4px solid #ffe4b8; border-top-color: #ff9f43;
    margin: 8px auto 14px; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .wait-card p { margin: 6px 0; font-size: 14px; color: #6b5a44; }
  .wait-card .timer { font-size: 20px; font-weight: 900; color: #5a3a1a;
    font-variant-numeric: tabular-nums; margin: 4px 0 8px; }
  .wait-card button { margin-top: 12px; padding: 11px 30px; border: none; border-radius: 999px;
    background: linear-gradient(180deg, #c8c0b0, #a8a090);
    color: #fff; font-size: 15px; font-weight: 800; cursor: pointer;
    box-shadow: 0 4px 0 #807868; letter-spacing: .5px; }
  .wait-card button:active { transform: translateY(2px); box-shadow: 0 2px 0 #807868; }

  /* 结算 */
  #resultOverlay { position: fixed; inset: 0; background: rgba(40,30,20,.55);
    display: flex; align-items: center; justify-content: center;
    z-index: 200; backdrop-filter: blur(4px); }
  .result-card { background: linear-gradient(180deg, #fff9ec, #ffefd3);
    border-radius: 24px; padding: 22px 18px 18px; width: min(88vw, 340px); text-align: center;
    box-shadow: 0 18px 44px rgba(0,0,0,.3); }
  .result-card h2 { margin: 0 0 12px; font-size: 26px; letter-spacing: 2px; }
  .result-card h2.win { color: #2f7a3e; }
  .result-card h2.lose { color: #c0333f; }
  .result-card h2.draw { color: #e67e22; }
  .result-card .scoreboard { display: flex; justify-content: space-between; gap: 8px; margin: 14px 0; }
  .result-card .pscore { flex: 1; background: #fff6e0; border-radius: 12px; padding: 10px;
    border: 2px solid #e8b87a; }
  .result-card .pscore.win { border-color: #4cae2c; background: #eaf7e0; }
  .result-card .pscore .pname { font-size: 12px; color: #8a6a40; }
  .result-card .pscore .pval { font-size: 24px; font-weight: 900; color: #5a3a1a; }
  .result-card .pscore .plabel { font-size: 10px; color: #8a6a40; }
  .result-card button { margin-top: 14px; padding: 11px 30px; border: none; border-radius: 999px;
    background: linear-gradient(180deg, #ffb257, #ff9f43); color: #fff;
    font-size: 16px; font-weight: 800;
    box-shadow: 0 4px 0 #d97d1f, 0 6px 14px rgba(217,125,31,.35); cursor: pointer; }
  .result-card button:active { transform: translateY(2px); box-shadow: 0 2px 0 #d97d1f; }

  /* 浮动特效 */
  .feed-particle { position: fixed; width: 8px; height: 8px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffd977, #e29a25 75%, #8d5a10);
    box-shadow: 0 0 8px #ffd54f; z-index: 100; pointer-events: none;
    transition: transform .72s cubic-bezier(.5,.05,.7,.25), opacity .72s ease-out; }
  .spark { position: fixed; width: 18px; height: 18px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,220,.95) 0%, rgba(255,210,120,.6) 40%, transparent 70%);
    z-index: 95; pointer-events: none; transform: translate(-50%, -50%);
    animation: sparkPop .38s ease-out forwards; }

<script>
(function () {
  "use strict";

  // ===================== 音效 =====================
  const SoundManager = (function () {
    let ctx = null, enabled = true, masterGain = null;
    function init() {
      if (ctx) return;
      try {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = ctx.createGain();
        masterGain.gain.value = 0.35;
        masterGain.connect(ctx.destination);
      } catch (e) { enabled = false; }
    }
    function tone(freq, dur, type = 'sine', vol = 0.5, delay = 0) {
      if (!ctx || !enabled) return;
      const t0 = ctx.currentTime + delay;
      const osc = ctx.createOscillator(); const g = ctx.createGain();
      osc.type = type; osc.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(vol, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      osc.connect(g); g.connect(masterGain);
      osc.start(t0); osc.stop(t0 + dur + 0.02);
    }
    function slide(f1, f2, dur, type = 'sine', vol = 0.5, delay = 0) {
      if (!ctx || !enabled) return;
      const t0 = ctx.currentTime + delay;
      const osc = ctx.createOscillator(); const g = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(f1, t0);
      osc.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(vol, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      osc.connect(g); g.connect(masterGain);
      osc.start(t0); osc.stop(t0 + dur + 0.02);
    }
    return {
      init,
      match(n) { tone(660 * Math.pow(1.12, Math.min(n - 3, 3)), 0.12, 'triangle', 0.45); },
      chain(l) { const steps = [0, 2, 4, 7, 9, 12]; const freq = 523.25 * Math.pow(2, steps[Math.min(l, 5)] / 12);
        tone(freq, 0.16, 'triangle', 0.5); },
      feed() { tone(120, 0.06, 'square', 0.4); tone(180, 0.08, 'square', 0.3, 0.06); },
      meow() { slide(880, 660, 0.18, 'sine', 0.35); },
      returnHome() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, 0.14, 'triangle', 0.4, i * 0.08)); },
      invalid() { tone(220, 0.12, 'sawtooth', 0.3); },
      end() { [783.99, 659.25, 523.25, 392].forEach((f, i) => tone(f, 0.22, 'triangle', 0.4, i * 0.12)); },
      tick() { tone(880, 0.05, 'square', 0.2); }
    };
  })();

  // ===================== 常量 =====================
  const TILE_EMOJI = { paw: "🐾", fish: "🐟", yarn: "🧶", cookie: "🍪", milk: "🥛" };
  const TILE_TYPES = ["paw", "fish", "yarn", "cookie", "milk"];
  const CAT_PALETTES = [
    { body: "#f5a352", dark: "#d97d2e", belly: "#ffe8c7", inner: "#f5a8b8" },
    { body: "#c5cdd6", dark: "#96a1ad", belly: "#f2f5f8", inner: "#f0a6b8" },
    { body: "#a87b5b", dark: "#7d563a", belly: "#f0dcc4", inner: "#e9a5b5" },
    { body: "#f6f2ea", dark: "#cfc8bc", belly: "#ffffff", inner: "#f0a6b8" },
    { body: "#8a7c6a", dark: "#6a5e50", belly: "#d9cfbf", inner: "#e9a5b5" }
  ];

  const $ = (id) => document.getElementById(id);
  const modeSelect = $('modeSelect'), gameRoot = $('game');
  const topArea = $('topArea'), boardArea = $('boardArea'), leftColumn = $('leftColumn');
  const boardEl = $('board');
  const timeText = $('timeText'), returnText = $('returnText');
  const scoreText = $('scoreText'), foodText = $('foodText');
  const battleTimeText = $('battleTimeText'), myReturnText = $('myReturnText');
  const oppReturnText = $('oppReturnText'), myNameLabel = $('myNameLabel');
  const oppNameLabel = $('oppNameLabel');
  const myTroughFill = $('myTroughFill'), mySideKibbles = $('mySideKibbles');
  const oppTroughFill = $('oppTroughFill'), oppSideKibbles = $('oppSideKibbles');
  const myStockText = $('myStockText'), oppStockText = $('oppStockText');
  const poolCats = $('poolCats');
  const waitOverlay = $('waitOverlay'), waitTimer = $('waitTimer');
  const resultOverlay = $('resultOverlay');

  // ===================== 游戏状态 =====================
  let mode = 'single';       // 'single' | 'battle' | 'online'
  let gameActive = false;
  let board = [], selected = null, isAnimating = false;
  let score = 0, foodStock = 0, foodProgress = 0;
  let timeLeft = 90, returnedCats = 0;
  let cats = [], catIdSeq = 1;
  let progressAnimating = false;
  let tickSecond = -1;
  const timers = { countdown: null, gameTick: null };

  // 对战/联机
  let opponent = { name: '对手', score: 0, foodStock: 0, returnedCats: 0, isBot: false,
    board: [], foodProgress: 0, cats: [] };
  let aiTimer = null;
  let ws = null, myPlayerId = null, roomId = null;
  let waitStartTime = 0, waitTimerId = null;

  // 位置（个人模式）
  const POS = { eating: [], waiting: [], sleepSpots: [] };
  // 共享池位置（对战）
  const POOL_POS = [];
  // 对手区域（对战）——用于对手猫咪的简略显示
  const OPP_POS = { eating: [] };

  // ===================== 工具 =====================
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const rand = (a, b) => a + Math.random() * (b - a);
  function getTileEl(r, c) { return boardEl.querySelector(`.tile[data-r="${r}"][data-c="${c}"]`); }

  function clearTimers() {
    if (timers.countdown) clearInterval(timers.countdown);
    if (timers.gameTick) clearInterval(timers.gameTick);
    if (aiTimer) { clearInterval(aiTimer); aiTimer = null; }
    timers.countdown = timers.gameTick = null;
  }

  // ===================== 棋盘逻辑 =====================
  function swap(b, r1, c1, r2, c2) { const t = b[r1][c1]; b[r1][c1] = b[r2][c2]; b[r2][c2] = t; }
  function randomTile() { return TILE_TYPES[Math.floor(Math.random() * TILE_TYPES.length)]; }
  function findMatches(b) {
    const groups = []; const size = 8;
    for (let r = 0; r < size; r++) {
      let c = 0;
      while (c < size) {
        const t = b[r][c]; let len = 1;
        while (c + len < size && b[r][c + len] === t) len++;
        if (len >= 3) { const cells = []; for (let i = 0; i < len; i++) cells.push([r, c + i]);
          groups.push({ cells, length: len }); }
        c += len;
      }
    }
    for (let c = 0; c < size; c++) {
      let r = 0;
      while (r < size) {
        const t = b[r][c]; let len = 1;
        while (r + len < size && b[r + len][c] === t) len++;
        if (len >= 3) { const cells = []; for (let i = 0; i < len; i++) cells.push([r + i, c]);
          groups.push({ cells, length: len }); }
        r += len;
      }
    }
    return groups;
  }
  function hasMove(b) {
    const size = 8;
    for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) {
      if (c < size - 1) { swap(b, r, c, r, c + 1); const ok = findMatches(b).length > 0;
        swap(b, r, c, r, c + 1); if (ok) return true; }
      if (r < size - 1) { swap(b, r, c, r + 1, c); const ok = findMatches(b).length > 0;
        swap(b, r, c, r + 1, c); if (ok) return true; }
    }
    return false;
  }
  function generateBoard() {
    for (let attempt = 0; attempt < 200; attempt++) {
      const b = Array.from({ length: 8 }, () => Array(8).fill(null));
      for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
        const forbid = new Set();
        if (c >= 2 && b[r][c - 1] === b[r][c - 2]) forbid.add(b[r][c - 1]);
        if (r >= 2 && b[r - 1][c] === b[r - 2][c]) forbid.add(b[r - 1][c]);
        const opts = TILE_TYPES.filter(t => !forbid.has(t));
        b[r][c] = opts[Math.floor(Math.random() * opts.length)];
      }
      if (hasMove(b)) return b;
    }
    return Array.from({ length: 8 }, () => Array.from({ length: 8 }, () => randomTile()));
  }
  function applyGravity(b) {
    const size = 8;
    for (let c = 0; c < size; c++) {
      let write = size - 1;
      for (let r = size - 1; r >= 0; r--) {
        if (b[r][c] !== null) { b[write][c] = b[r][c];
          if (write !== r) b[r][c] = null; write--; }
      }
      while (write >= 0) { b[write][c] = randomTile(); write--; }
    }
  }
  function scoreForLength(len) {
    if (len === 3) return 30;
    if (len === 4) return 45;
    if (len === 5) return 60;
    return 60 + (len - 6) * 10;
  }

  // ===================== 渲染棋盘 =====================
  function renderBoard() {
    boardEl.innerHTML = "";
    for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
      const tile = document.createElement("div");
      tile.className = "tile";
      tile.dataset.r = r; tile.dataset.c = c;
      tile.dataset.type = board[r][c];
      tile.textContent = TILE_EMOJI[board[r][c]];
      tile.addEventListener("click", () => onTileClick(r, c));
      boardEl.appendChild(tile);
    }
    updateSelection();
    resizeBoard();
  }
  function updateSelection() {
    boardEl.querySelectorAll(".tile.selected").forEach(el => el.classList.remove("selected"));
    if (selected) { const el = getTileEl(selected.r, selected.c); if (el) el.classList.add("selected"); }
  }
  function resizeBoard() {
    const rect = boardArea.getBoundingClientRect();
    const style = getComputedStyle(boardArea);
    const padLeft = parseFloat(style.paddingLeft) || 0;
    const padRight = parseFloat(style.paddingRight) || 0;
    const padTop = parseFloat(style.paddingTop) || 0;
    const padBottom = parseFloat(style.paddingBottom) || 0;
    const availW = rect.width - padLeft - padRight - 4;
    const used = 40;
    const availH = rect.height - padTop - padBottom - used;
    const size = Math.max(140, Math.min(availW, availH));
    boardEl.style.width = size + "px";
    boardEl.style.height = size + "px";
    boardEl.style.setProperty("--tile-size", size / 8 + "px");
  }

  // ===================== 输入 =====================
  async function onTileClick(r, c) {
    SoundManager.init();
    if (!gameActive || isAnimating || timeLeft <= 0) return;

    // 联机：发送给服务端
    if (mode === 'online') {
      if (selected === null) { selected = { r, c }; updateSelection(); return; }
      const s = selected;
      if (s.r === r && s.c === c) { selected = null; updateSelection(); return; }
      if (Math.abs(s.r - r) + Math.abs(s.c - c) !== 1) { selected = { r, c }; updateSelection(); return; }
      selected = null; updateSelection();
      sendWS({ type: 'swap', r1: s.r, c1: s.c, r2: r, c2: c });
      return;
    }

    // 单机/对战：本地处理
    if (selected === null) { selected = { r, c }; updateSelection(); return; }
    const s = selected;
    if (s.r === r && s.c === c) { selected = null; updateSelection(); return; }
    if (Math.abs(s.r - r) + Math.abs(s.c - c) !== 1) { selected = { r, c }; updateSelection(); return; }
    selected = null; updateSelection();
    await trySwap(s.r, s.c, r, c);
  }

  async function trySwap(r1, c1, r2, c2) {
    if (!gameActive) return;
    isAnimating = true;
    swap(board, r1, c1, r2, c2);
    const first = findMatches(board);
    if (first.length === 0) {
      swap(board, r1, c1, r2, c2); renderBoard();
      SoundManager.invalid();
      const el = getTileEl(r1, c1);
      if (el) { el.classList.add("invalid"); setTimeout(() => el.classList.remove("invalid"), 320); }
      isAnimating = false;
      return;
    }
    let chainLevel = 0, current = first;
    while (current.length > 0) {
      const removeSet = new Set(); let base = 0;
      for (const g of current) {
        base += scoreForLength(g.length);
        for (const [r, c] of g.cells) removeSet.add(`${r},${c}`);
      }
      const chainMul = 1 + Math.min(chainLevel * 0.25, 0.75);
      const gained = Math.round(base * chainMul);
      addScore(gained);
      SoundManager.match(current[0].length);
      const cells = [...removeSet].map(k => k.split(",").map(Number));
      spawnParticles(cells); shakeBoard();
      removeSet.forEach(k => {
        const [r, c] = k.split(",").map(Number);
        const el = getTileEl(r, c); if (el) el.classList.add("pop");
      });
      await sleep(280);
      removeSet.forEach(k => {
        const [r, c] = k.split(",").map(Number);
        board[r][c] = null;
      });
      applyGravity(board); renderBoard(); await sleep(160);
      current = findMatches(board); chainLevel++;
      if (current.length > 0) { showChainBanner(chainLevel); await sleep(400); }
    }
    isAnimating = false;
    updateHUD();
  }

  function addScore(points) {
    score += points; foodProgress += points;
    let produced = false;
    while (foodProgress >= 90 && foodStock < 24) { foodStock++; foodProgress -= 90; produced = true; }
    if (produced) animateMachineProduce();
    if (mode === 'single') updateProgressBar();
    updateHUD();
    showFloatingScore(points);
  }
  function updateProgressBar() {
    if (progressAnimating) return;
    let pct;
    if (foodStock >= 24) pct = 100;
    else pct = Math.min(100, (foodProgress / 90) * 100);
    document.getElementById('progressFill').style.height = pct + "%";
    document.getElementById('progressTrack').classList.toggle("full", foodStock >= 24);
  }
  function animateMachineProduce() {
    SoundManager.feed();
    const m = mode === 'single' ? document.getElementById('foodMachine') : document.getElementById('myMachine');
    if (!m) return;
    m.classList.remove("producing");
    void m.offsetWidth;
    m.classList.add("producing");
    setTimeout(() => m.classList.remove("producing"), 600);
    if (mode === 'single') {
      progressAnimating = true;
      const pf = document.getElementById('progressFill');
      const pt = document.getElementById('progressTrack');
      pf.style.transition = "height .25s cubic-bezier(.3,.8,.4,1)";
      pf.style.height = "100%";
      pt.classList.add("full");
      setTimeout(() => {
        pt.classList.remove("full");
        pf.style.transition = "height .5s cubic-bezier(.3,.8,.4,1)";
        const pct = foodStock >= 24 ? 100 : Math.min(100, (foodProgress / 90) * 100);
        pf.style.height = pct + "%";
        progressAnimating = false;
      }, 400);
    }
  }

  // ===================== 特效 =====================
  function spawnParticles(cells) {
    if (!cells || !cells.length) return;
    const m = mode === 'single' ? document.getElementById('foodMachine') : document.getElementById('myMachine');
    if (!m) return;
    const mRect = m.getBoundingClientRect();
    const endX = mRect.left + mRect.width / 2;
    const endY = mRect.top + mRect.height / 2;
    const chosen = [...cells].sort(() => Math.random() - 0.5).slice(0, Math.min(5, cells.length));
    chosen.forEach(([r, c], i) => {
      const el = getTileEl(r, c); if (!el) return;
      const rect = el.getBoundingClientRect();
      const sx = rect.left + rect.width / 2, sy = rect.top + rect.height / 2;
      const sp = document.createElement("div");
      sp.className = "spark"; sp.style.left = sx + "px"; sp.style.top = sy + "px";
      document.body.appendChild(sp); setTimeout(() => sp.remove(), 420);
      setTimeout(() => {
        const p = document.createElement("div");
        p.className = "feed-particle";
        p.style.left = sx + "px"; p.style.top = sy + "px";
        p.style.transform = "translate(-50%, -50%) scale(1)";
        document.body.appendChild(p);
        requestAnimationFrame(() => {
          p.style.transform = `translate(calc(-50% + ${endX - sx}px), calc(-50% + ${endY - sy}px)) scale(0.35)`;
          p.style.opacity = "0";
        });
        setTimeout(() => p.remove(), 780);
      }, i * 40);
    });
  }

  // ===================== 猫咪 SVG =====================

    const tailPath = tailUp ? "M28,58 Q6,54 8,22" : "M28,58 Q10,72 12,86";

  // ===================== 个人模式：位置 =====================
  function computeSinglePositions() {
    const W = topArea.clientWidth, H = topArea.clientHeight;
    const trough = document.getElementById('trough');
    const bigHome = document.getElementById('bigHome');
    const troughLeft = 44, troughRight = W - 106;
    const troughWidth = Math.max(180, troughRight - troughLeft);
    trough.style.left = troughLeft + "px";
    trough.style.bottom = "42px";
    trough.style.width = troughWidth + "px";
    const homeW = 91, homeLeft = W - 100, homeTop = 130;
    const maxHomeH = H - homeTop - 24;
    const homeH = Math.max(140, Math.min(maxHomeH, (H - 130) * 0.78));
    bigHome.style.left = homeLeft + "px";
    bigHome.style.top = homeTop + "px";
    bigHome.style.width = homeW + "px";
    bigHome.style.height = homeH + "px";
    // 进食位
    POS.eating = [];
    const catW = 70;
    const troughTopY = H - 42 - 34;
    const eatY = troughTopY - 60;
    const eatLeft = troughLeft + 6;
    const eatRight = troughLeft + troughWidth - catW - 6;
    const eatWidth = Math.max(80, eatRight - eatLeft);
    let n = Math.max(2, Math.min(6, Math.floor(eatWidth / 72) + 1));
    for (let i = 0; i < n; i++) {
      const t = n === 1 ? 0.5 : i / (n - 1);
      POS.eating.push({ x: eatLeft + (eatWidth - catW) * t, y: eatY });
    }
    // 等待位
    POS.waiting = [];
    const catH = 50;
    const waitBottomLimit = eatY - 34;
    const waitLeft = 72, waitRight = W - 106;
    const waitWidth = Math.max(120, waitRight - waitLeft);
    let cols = Math.max(3, Math.min(5, Math.floor(waitWidth / 50) + 1));
    let rows = 2;
    const cellH = 42;
    let baseY = waitBottomLimit - (rows - 1) * cellH - catH;
    const minBaseY = H * 0.3 + 2;
    while (rows > 1 && baseY < minBaseY) { rows--; baseY = waitBottomLimit - (rows - 1) * cellH - catH; }
    if (baseY < minBaseY) baseY = minBaseY;
    const cellW = waitWidth / cols;
    for (let row = 0; row < rows; row++) for (let col = 0; col < cols; col++) {
      POS.waiting.push({ x: waitLeft + cellW * (col + 0.5) - catW / 2, y: baseY + row * cellH });
    }
    // 睡眠位
    POS.sleepSpots = [];
    const sCellW = homeW / 4, sCellH = homeH / 5;
    for (let row = 0; row < 4; row++) for (let col = 0; col < 4; col++) {
      POS.sleepSpots.push({
        x: homeLeft + sCellW * (col + 0.5) - catW / 2,
        y: homeTop + sCellH * (row + 1) - 18
      });
    }
    // 左侧栏
    const gameRect = gameRoot.getBoundingClientRect();
    const topAreaRect = topArea.getBoundingClientRect();
    const topAreaBottomRel = topAreaRect.bottom - gameRect.top;
    leftColumn.style.top = (topAreaBottomRel - 78 / 2) + "px";
    document.getElementById('progressTrack').style.height = (boardEl.offsetHeight || 260) + "px";
  }

  // ===================== 个人模式：猫咪 =====================
  function makeSingleCat() {
    const cat = {
      id: catIdSeq++, state: "waiting", stateStart: performance.now(),
      nextIdleChange: performance.now() + rand(2000, 6000),
      walkDir: "right",
      palette: CAT_PALETTES[Math.floor(Math.random() * CAT_PALETTES.length)],
      dirty: true, eatingSlot: -1, waitingSlot: -1, sleepSlot: -1,
      el: document.createElement("div")
    };
    cat.el.className = "cat state-waiting";
    cat.el.innerHTML = `<div class="cat-svg-wrap">${catSVG("waiting", cat.palette, true, false)}</div><div class="cat-chip">等待</div>`;
    document.getElementById('catsLayer').appendChild(cat.el);
    return cat;
  }
  function refreshSingleCatVisual(cat) {
    cat.el.className = "cat state-" + cat.state;
    if (cat.state === "walking_to_food") cat.el.classList.add("facing-left");
    const tailUp = cat.state === "walking_to_home" || cat.state === "eating";
    cat.el.innerHTML = `<div class="cat-svg-wrap">${catSVG(cat.state, cat.palette, cat.dirty, tailUp)}</div><div class="cat-chip">${stateLabel(cat.state)}</div>`;
  }
  function stateLabel(s) {
    return { waiting: "等待", walking_to_food: "去吃", eating: "进食",
      cleaning: "清洁", happy: "开心", walking_to_home: "回窝", sleeping: "睡觉" }[s] || s;
  }
  function moveCat(cat, x, y) { cat.el.style.left = x + "px"; cat.el.style.top = y + "px"; }

  function getFreeWaitingSlot() {
    const used = new Set(cats.filter(c => c.waitingSlot >= 0).map(c => c.waitingSlot));
    for (let i = 0; i < POS.waiting.length; i++) if (!used.has(i)) return i;
    return -1;
  }
  function getFreeEatingSlot() {
    const used = new Set(cats.filter(c => c.eatingSlot >= 0 &&
      ["walking_to_food", "eating", "cleaning", "happy"].includes(c.state)).map(c => c.eatingSlot));
    for (let i = 0; i < POS.eating.length; i++) if (!used.has(i)) return i;
    return -1;
  }
  function getFreeSleepSlot() {
    const used = new Set(cats.filter(c => c.sleepSlot >= 0 && c.state === "sleeping").map(c => c.sleepSlot));
    for (let i = 0; i < POS.sleepSpots.length; i++) if (!used.has(i)) return i;
    return -1;
  }
  function spawnSingleWaitingCat() {
    if (cats.length >= 18) return;
    const wCount = cats.filter(c => c.state === "waiting").length;
    if (wCount >= 10) return;
    if (POS.waiting.length === 0) return;
    const slot = getFreeWaitingSlot();
    if (slot < 0) return;
    const cat = makeSingleCat();
    cat.waitingSlot = slot;
    const p = POS.waiting[slot];
    cat.el.style.left = p.x + "px";
    cat.el.style.top = p.y + "px";
    cats.push(cat);
  }
  function tickSingleCats() {
    const now = performance.now();
    for (const cat of cats) {
      const e = now - cat.stateStart;
      switch (cat.state) {
        case "waiting":
          if (now >= cat.nextIdleChange) {
            const p = POS.waiting[cat.waitingSlot];
            if (p && Math.random() < 0.45) {
              cat.state = "walking_to_food"; // 假装走动
              cat.nextIdleChange = now + 1500;
              cat.stateStart = now;
            } else {
              cat.nextIdleChange = now + rand(3000, 7000);
            }
          }
          break;
        case "walking_to_food": break;
        case "eating":
          if (e >= 4500) { cat.state = "cleaning"; cat.stateStart = now; cat.dirty = false; refreshSingleCatVisual(cat); }
          break;
        case "cleaning":
          if (e >= 4500) { cat.state = "happy"; cat.stateStart = now; refreshSingleCatVisual(cat); }
          break;
        case "happy":
          if (e >= 4500) {
            const slot = getFreeSleepSlot();
            const idx = slot >= 0 ? slot : Math.floor(Math.random() * POS.sleepSpots.length);
            cat.sleepSlot = idx; cat.eatingSlot = -1;
            cat.state = "walking_to_home"; cat.stateStart = now;
            refreshSingleCatVisual(cat);
            const p = POS.sleepSpots[idx];
            moveCat(cat, p.x, p.y);
          }
          break;
        case "walking_to_home":
          if (e >= 1700) {
            cat.state = "sleeping"; cat.stateStart = now;
            refreshSingleCatVisual(cat); returnedCats++;
            SoundManager.returnHome();
            updateHUD();
          }
          break;
      }
    }
    // 尝试从等待→进食
    trySendSingleCat();
  }
  function trySendSingleCat() {
    if (!gameActive) return;
    const using = cats.filter(c => c.state === "eating" || c.state === "cleaning" ||
      c.state === "happy" || c.state === "walking_to_food").length;
    if (using >= 6) return;
    if (foodStock <= 0) return;
    let maxConcurrent = 0;
    if (foodStock >= 21) maxConcurrent = 6;
    else if (foodStock >= 16) maxConcurrent = 5;
    else if (foodStock >= 11) maxConcurrent = 4;
    else if (foodStock >= 7) maxConcurrent = 3;
    else if (foodStock >= 4) maxConcurrent = 2;
    else if (foodStock >= 1) maxConcurrent = 1;
    if (using >= maxConcurrent) return;
    const waiter = cats.find(c => c.state === "waiting");
    if (!waiter) return;
    const slot = getFreeEatingSlot();
    if (slot < 0) return;
    foodStock--;
    waiter.eatingSlot = slot; waiter.waitingSlot = -1;
    waiter.state = "walking_to_food"; waiter.stateStart = performance.now();
    refreshSingleCatVisual(waiter);
    const p = POS.eating[slot];
    moveCat(waiter, p.x, p.y);
    SoundManager.meow();
    updateHUD();
  }

  // ===================== 对战模式：共享猫咪池 =====================
  function computePoolPositions() {
    POOL_POS.length = 0;
    const pool = document.getElementById('sharedPool');
    const rect = pool.getBoundingClientRect();
    const pad = 8;
    const cols = 5, rows = 3;
    const cw = (rect.width - pad * 2) / cols;
    const ch = (rect.height - pad * 2) / rows;
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      POOL_POS.push({
        x: pad + c * cw + cw / 2 - 28,
        y: pad + r * ch + ch / 2 - 25
      });
    }
  }

  function spawnBattleCat(ownerId) {
    // ownerId: 'me' | 'opp'
    const poolCatsEl = poolCats;
    const cat = {
      id: catIdSeq++, owner: ownerId, state: "walking_to_food",
      stateStart: performance.now(),
      palette: CAT_PALETTES[Math.floor(Math.random() * CAT_PALETTES.length)],
      dirty: true,
      el: document.createElement("div")
    };
    cat.el.className = "cat state-walking_to_food";
    if (ownerId === 'opp') cat.el.classList.add("facing-left");
    // 加归属小标
    const chipColor = ownerId === 'me' ? '#7ed957' : '#ff7b8a';
    cat.el.innerHTML = `<div class="cat-svg-wrap">${catSVG("walking_to_food", cat.palette, true, false)}</div>
      <div class="cat-chip" style="background:${chipColor};color:#fff;border-color:${chipColor}">${ownerId === 'me' ? '我' : '对手'}</div>`;
    poolCatsEl.appendChild(cat.el);
    // 随机位置
    const p = POOL_POS[Math.floor(Math.random() * POOL_POS.length)];
    cat.el.style.left = p.x + "px";
    cat.el.style.top = p.y + "px";
    return cat;
  }

  function tickBattleCats() {
    const now = performance.now();
    for (const cat of cats) {
      const e = now - cat.stateStart;
      switch (cat.state) {
        case "walking_to_food":
          if (e >= 1300) {
            cat.state = "eating"; cat.stateStart = now;
            refreshBattleCatVisual(cat);
          }
          break;
        case "eating":
          if (e >= 4500) {
            cat.state = "cleaning"; cat.stateStart = now; cat.dirty = false;
            refreshBattleCatVisual(cat);
          }
          break;
        case "cleaning":
          if (e >= 4500) { cat.state = "happy"; cat.stateStart = now; refreshBattleCatVisual(cat); }
          break;
        case "happy":
          if (e >= 4500) {
            cat.state = "walking_to_home"; cat.stateStart = now;
            refreshBattleCatVisual(cat);
          }
          break;
        case "walking_to_home":
          if (e >= 1700) {
            cat.state = "sleeping"; cat.stateStart = now;
            refreshBattleCatVisual(cat);
            if (cat.owner === 'me') {
              returnedCats++;
              SoundManager.returnHome();
            } else {
              opponent.returnedCats++;
            }
            // 睡觉后消失（简化）
            setTimeout(() => {
              if (cat.el && cat.el.parentNode) cat.el.parentNode.removeChild(cat.el);
            }, 2000);
            updateHUD();
          }
          break;
        case "sleeping":
          break;
      }
    }
    // 清理已消失的
    cats = cats.filter(c => c.state !== "sleeping" || performance.now() - c.stateStart < 2500);
  }

  function refreshBattleCatVisual(cat) {
    cat.el.className = "cat state-" + cat.state;
    if (cat.owner === 'opp') cat.el.classList.add("facing-left");
    const tailUp = cat.state === "walking_to_home" || cat.state === "eating";
    const chipColor = cat.owner === 'me' ? '#7ed957' : '#ff7b8a';
    cat.el.innerHTML = `<div class="cat-svg-wrap">${catSVG(cat.state, cat.palette, cat.dirty, tailUp)}</div>
      <div class="cat-chip" style="background:${chipColor};color:#fff;border-color:${chipColor}">${cat.owner === 'me' ? '我' : '对手'}</div>`;
  }

  // 每 1.5 秒尝试生成共享猫咪
  let sharedSpawnTimer = null;
  function startSharedSpawn() {
    if (sharedSpawnTimer) clearInterval(sharedSpawnTimer);
    sharedSpawnTimer = setInterval(() => {
      if (!gameActive) return;
      // 我方：有猫粮 + 没超上限
      const myCats = cats.filter(c => c.owner === 'me' && c.state !== 'sleeping').length;
      const oppCats = cats.filter(c => c.owner === 'opp' && c.state !== 'sleeping').length;
      const candidates = [];
      if (foodStock > 0 && myCats < 8) candidates.push({ id: 'me', w: foodStock });
      if (opponent.foodStock > 0 && oppCats < 8) candidates.push({ id: 'opp', w: opponent.foodStock });
      if (candidates.length === 0) return;
      const totalW = candidates.reduce((s, x) => s + x.w, 0);
      let rnd = Math.random() * totalW;
      let owner = candidates[0].id;
      for (const c of candidates) { rnd -= c.w; if (rnd <= 0) { owner = c.id; break; } }
      // 扣粮
      if (owner === 'me') { foodStock--; } else { opponent.foodStock--; }
      cats.push(spawnBattleCat(owner));
      SoundManager.meow();
      updateHUD();
    }, 1500);
  }

  // 对战 AI
  function startBattleAI() {
    if (aiTimer) clearInterval(aiTimer);
    aiTimer = setInterval(() => {
      if (!gameActive || mode !== 'battle') return;
      // 简化 AI：随便找一对交换，尝试形成匹配
      const moves = [];
      for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
        if (c < 7) {
          swap(opponent.board, r, c, r, c + 1);
          if (findMatches(opponent.board).length > 0) moves.push([r, c, r, c + 1]);
          swap(opponent.board, r, c, r, c + 1);
        }
        if (r < 7) {
          swap(opponent.board, r, c, r + 1, c);
          if (findMatches(opponent.board).length > 0) moves.push([r, c, r + 1, c]);
          swap(opponent.board, r, c, r + 1, c);
        }
      }
      if (moves.length === 0) { opponent.board = generateBoard(); return; }
      const [r1, c1, r2, c2] = moves[Math.floor(Math.random() * moves.length)];
      executeOpponentSwap(r1, c1, r2, c2);
    }, rand(900, 1600));
  }
  function executeOpponentSwap(r1, c1, r2, c2) {
    swap(opponent.board, r1, c1, r2, c2);
    const first = findMatches(opponent.board);
    if (first.length === 0) { swap(opponent.board, r1, c1, r2, c2); return; }
    let chainLevel = 0, current = first;
    let totalGain = 0;
    while (current.length > 0) {
      const removeSet = new Set();
      let base = 0;
      for (const g of current) {
        base += scoreForLength(g.length);
        for (const [r, c] of g.cells) removeSet.add(`${r},${c}`);
      }
      const chainMul = 1 + Math.min(chainLevel * 0.25, 0.75);
      totalGain += Math.round(base * chainMul);
      removeSet.forEach(k => {
        const [r, c] = k.split(",").map(Number);
        opponent.board[r][c] = null;
      });
      applyGravity(opponent.board);
      current = findMatches(opponent.board);
      chainLevel++;
    }
    opponent.score += totalGain;
    opponent.foodProgress += totalGain;
    while (opponent.foodProgress >= 90 && opponent.foodStock < 24) {
      opponent.foodStock++; opponent.foodProgress -= 90;
    }
    updateHUD();
  }

  // ===================== HUD =====================
  function updateHUD() {
    if (mode === 'single') {
      timeText.textContent = Math.ceil(Math.max(0, timeLeft));
      returnText.textContent = returnedCats;
      scoreText.textContent = score;
      foodText.textContent = foodStock;
      renderSingleKibbles();
      updateProgressBar();
    } else {
      battleTimeText.textContent = Math.ceil(Math.max(0, timeLeft));
      myReturnText.textContent = returnedCats;
      oppReturnText.textContent = opponent.returnedCats;
      scoreText.textContent = score;
      foodText.textContent = foodStock;
      myStockText.textContent = foodStock;
      oppStockText.textContent = opponent.foodStock;
      myTroughFill.style.width = (foodStock / 24) * 100 + "%";
      oppTroughFill.style.width = (opponent.foodStock / 24) * 100 + "%";
      renderSideKibbles(mySideKibbles, foodStock);
      renderSideKibbles(oppSideKibbles, opponent.foodStock);
    }
  }
  function renderSingleKibbles() {
    const el = document.getElementById('troughKibbles');
    if (!el) return;
    el.innerHTML = "";
    if (foodStock <= 0) return;
    const W = el.clientWidth || 180, H = el.clientHeight || 26;
    const perRow = Math.max(6, Math.min(foodStock, Math.ceil(Math.sqrt(foodStock * 4))));
    const rows = Math.ceil(foodStock / perRow);
    const cw = W / perRow, ch = H / Math.max(1, rows);
    for (let i = 0; i < foodStock; i++) {
      const r = Math.floor(i / perRow), c = i % perRow;
      const k = document.createElement("div");
      k.className = "kibble";
      k.style.left = (c * cw + cw * 0.5 - 3) + "px";
      k.style.top = (H - (rows - r - 1) * ch - ch * 0.5 - 3) + "px";
      el.appendChild(k);
    }
  }
  function renderSideKibbles(parent, stock) {
    if (!parent) return;
    parent.innerHTML = "";
    if (stock <= 0) return;
    const W = parent.clientWidth || 80, H = parent.clientHeight || 20;
    const perRow = Math.max(4, Math.min(stock, Math.ceil(Math.sqrt(stock * 3))));
    const rows = Math.ceil(stock / perRow);
    const cw = W / perRow, ch = H / Math.max(1, rows);
    for (let i = 0; i < stock; i++) {
      const r = Math.floor(i / perRow), c = i % perRow;
      const k = document.createElement("div");
      k.className = "k";
      k.style.left = (c * cw + cw * 0.5 - 2) + "px";
      k.style.top = (H - (rows - r - 1) * ch - ch * 0.5 - 2) + "px";
      parent.appendChild(k);
    }
  }

  // ===================== 倒计时 =====================
  function onCountdownTick() {
    if (!gameActive) return;
    timeLeft -= 0.1;
    const sec = Math.ceil(timeLeft);
    if (sec <= 10 && sec > 0 && sec !== tickSecond) {
      tickSecond = sec;
      SoundManager.tick();
    }
    if (timeLeft <= 0) {
      timeLeft = 0; updateHUD(); endGame(); return;
    }
    updateHUD();
  }

  // ===================== 游戏开始 =====================
  function startSingleGame() {
    clearTimers();
    document.getElementById('catsLayer').innerHTML = "";
    cats = []; catIdSeq = 1;
    score = 0; foodStock = 0; foodProgress = 0;
    timeLeft = 90; returnedCats = 0;
    gameActive = true; isAnimating = false; selected = null;
    progressAnimating = false; tickSecond = -1;

    board = generateBoard();
    renderBoard();
    computeSinglePositions();
    updateHUD();
    // 起始等待猫
    for (let i = 0; i < 5; i++) setTimeout(() => { if (gameActive) spawnSingleWaitingCat(); }, i * 200);

    timers.countdown = setInterval(onCountdownTick, 100);
    timers.gameTick = setInterval(() => { if (gameActive) tickSingleCats(); }, 100);
    // 定期尝试吸引新猫
    setInterval(() => { if (gameActive && mode === 'single') spawnSingleWaitingCat(); }, 2500);
  }

  function startBattleGame(isOnline) {
    clearTimers();
    poolCats.innerHTML = "";
    cats = []; catIdSeq = 1;
    score = 0; foodStock = 0; foodProgress = 0;
    timeLeft = 90; returnedCats = 0;
    gameActive = true; isAnimating = false; selected = null;
    progressAnimating = false; tickSecond = -1;

    opponent = { name: isOnline ? '等待对手' : '电脑猫娘', score: 0, foodStock: 0,
      foodProgress: 0, returnedCats: 0, isBot: !isOnline, board: generateBoard() };
    myNameLabel.textContent = '我';
    oppNameLabel.textContent = opponent.name;

    board = generateBoard();
    renderBoard();
    // 等 DOM 布局完成后再算位置
    setTimeout(() => {
      computePoolPositions();
      updateHUD();
    }, 60);

    timers.countdown = setInterval(onCountdownTick, 100);
    timers.gameTick = setInterval(() => { if (gameActive) tickBattleCats(); }, 100);
    startSharedSpawn();
    if (!isOnline) startBattleAI();
  }

  // ===================== 结束 =====================
  function endGame() {
    if (!gameActive) return;
    gameActive = false;
    clearTimers();
    if (sharedSpawnTimer) { clearInterval(sharedSpawnTimer); sharedSpawnTimer = null; }
    SoundManager.end();

    if (mode === 'single') {
      $('p1Name').textContent = '我';
      $('p1Returns').textContent = returnedCats;
      $('p2Name').textContent = '—';
      $('p2Returns').textContent = '—';
      p1Box.classList.remove('win'); p2Box.classList.remove('win');
      resultTitle.textContent = `开心回窝 ${returnedCats} 只`;
      resultTitle.className = 'win';
      $('btnResultLobby').textContent = '返回模式选择';
    } else {
      const my = returnedCats, op = opponent.returnedCats;
      p1Name.textContent = '我'; p1Returns.textContent = my;
      p2Name.textContent = opponent.name; p2Returns.textContent = op;
      p1Box.classList.remove('win'); p2Box.classList.remove('win');
      if (my > op) { resultTitle.textContent = '🎉 胜利！'; resultTitle.className = 'win'; p1Box.classList.add('win'); }
      else if (my < op) { resultTitle.textContent = '😿 失败'; resultTitle.className = 'lose'; p2Box.classList.add('win'); }
      else { resultTitle.textContent = '🤝 平局'; resultTitle.className = 'draw'; p1Box.classList.add('win'); p2Box.classList.add('win'); }
    }
    resultOverlay.classList.remove('hidden');
  }

  // ===================== 联机 =====================
  function sendWS(msg) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(msg)); }

  function connectServer(url) {
    return new Promise((resolve, reject) => {
      try { ws = new WebSocket(url); } catch (e) { return reject(e); }
      const timeout = setTimeout(() => reject(new Error('连接超时')), 8000);
      ws.onopen = () => { clearTimeout(timeout); resolve(); };
      ws.onerror = () => { clearTimeout(timeout); reject(new Error('连接失败')); };
      ws.onmessage = (e) => {
        let msg; try { msg = JSON.parse(e.data); } catch { return; }
        handleWS(msg);
      };
      ws.onclose = () => {
        if (mode === 'online' && gameActive) {
          showToast('连接已断开');
          setTimeout(() => exitToMode(), 800);
        }
      };
    });
  }

  function handleWS(msg) {
    switch (msg.type) {
      case 'welcome':
        myPlayerId = msg.playerId; break;
      case 'joined_room':
        roomId = msg.roomId;
        // 保持等待遮罩，等待 matched
        break;
      case 'matched':
        opponent.name = msg.opponent.name;
        opponent.isBot = msg.opponent.isBot;
        // 关闭等待遮罩，进入游戏
        waitOverlay.classList.add('hidden');
        if (waitTimerId) { clearInterval(waitTimerId); waitTimerId = null; }
        startBattleGame(true);
        break;
      case 'state': {
        if (!gameActive) return;
        timeLeft = msg.timeLeft;
        if (msg.myBoard) board = msg.myBoard;
        if (typeof msg.myScore === 'number') score = msg.myScore;
        if (typeof msg.myFoodStock === 'number') foodStock = msg.myFoodStock;
        if (typeof msg.myReturnedCats === 'number') returnedCats = msg.myReturnedCats;
        if (msg.opponent) {
          opponent.name = msg.opponent.name;
          opponent.isBot = msg.opponent.isBot;
          opponent.score = msg.opponent.score || 0;
          opponent.foodStock = msg.opponent.foodStock || 0;
          opponent.returnedCats = msg.opponent.returnedCats || 0;
        }
        // 共享猫咪池：用服务器的 myCats + opponentCats 简化处理（暂只显示 myCats）
        renderBoard(); updateHUD();
        break;
      }
      case 'event': {
        if (msg.kind === 'match') {
          msg.cells.forEach(([r, c]) => {
            const el = getTileEl(r, c); if (el) el.classList.add('pop');
          });
          spawnParticles(msg.cells);
          shakeBoard();
          SoundManager.match(msg.length || 3);
          showFloatingScore(msg.gain);
        } else if (msg.kind === 'swap_result') {
          if (msg.board) board = msg.board;
          renderBoard();
          for (const ev of msg.events) {
            if (ev.kind === 'match' && ev.chain > 0) showChainBanner(ev.chain);
          }
        } else if (msg.kind === 'invalid') {
          SoundManager.invalid();
        } else if (msg.kind === 'cat_return') {
          SoundManager.returnHome();
        }
        break;
      }
      case 'round_end':
        endGame();
        break;
      case 'opponent_left':
        showToast('对手已离开');
        setTimeout(() => exitToMode(), 1200);
        break;
      case 'error':
        showToast('错误：' + msg.msg);
        break;
    }
  }

  // ===================== 模式切换 =====================
  function enterMode(m) {
    mode = m;
    modeSelect.classList.add('hidden');
    gameRoot.classList.remove('hidden');
    resultOverlay.classList.add('hidden');
    waitOverlay.classList.add('hidden');

    if (m === 'single') {
      topArea.className = 'singleMode';
      boardArea.className = 'singleMode';
      leftColumn.style.display = 'flex';
      $('btnResultLobby').textContent = '返回模式选择';
      startSingleGame();
    } else {
      topArea.className = 'battleMode';
      boardArea.className = 'battleMode';
      leftColumn.style.display = 'none';
      if (m === 'battle') {
        startBattleGame(false);
      } else {
        // online：先连接，显示等待遮罩
        startOnlineMatch();
      }
    }
  }

  function exitToMode() {
    gameActive = false;
    clearTimers();
    if (sharedSpawnTimer) { clearInterval(sharedSpawnTimer); sharedSpawnTimer = null; }
    if (waitTimerId) { clearInterval(waitTimerId); waitTimerId = null; }
    if (aiTimer) { clearInterval(aiTimer); aiTimer = null; }
    if (ws && ws.readyState === 1) {
      try { sendWS({ type: 'leave_room' }); ws.close(); } catch (e) {}
    }
    ws = null; roomId = null;
    gameRoot.classList.add('hidden');
    resultOverlay.classList.add('hidden');
    waitOverlay.classList.add('hidden');
    modeSelect.classList.remove('hidden');
  }

  function startOnlineMatch() {
    // 显示等待遮罩
    waitOverlay.classList.remove('hidden');
    waitStartTime = Date.now();
    waitTimer.textContent = '00:00';
    if (waitTimerId) clearInterval(waitTimerId);
    waitTimerId = setInterval(() => {
      const sec = Math.floor((Date.now() - waitStartTime) / 1000);
      const mm = String(Math.floor(sec / 60)).padStart(2, '0');
      const ss = String(sec % 60).padStart(2, '0');
      waitTimer.textContent = `${mm}:${ss}`;
    }, 200);

    // 自动推断服务器地址：
    //  - 如果页面通过 file:// 打开，用 localhost
    //  - 否则用当前 host 的 8080 端口
let wsUrl = 'wss://sanxiao.onrender.com';

    connectServer(wsUrl).then(() => {
      sendWS({ type: 'set_name', name: '玩家' });
      // 快速匹配，不创建 AI
      sendWS({ type: 'quick_match_human' });
    }).catch((e) => {
      showToast('无法连接服务器，请检查服务端是否运行');
      setTimeout(() => exitToMode(), 1500);
    });
  }

  // ===================== 事件绑定 =====================
  document.querySelectorAll('.mode-card').forEach(card => {
    card.addEventListener('click', () => {
      SoundManager.init();
      const m = card.dataset.mode;
      enterMode(m);
    });
  });

  $('btnBack').addEventListener('click', () => {
    if (confirm('确定要返回模式选择吗？当前进度会丢失。')) exitToMode();
  });

  $('btnCancelWait').addEventListener('click', () => exitToMode());

  $('btnResultLobby').addEventListener('click', () => exitToMode());

  window.addEventListener('resize', () => {
    if (mode === 'single') computeSinglePositions();
    else if (mode === 'battle' || mode === 'online') computePoolPositions();
    if (boardEl) resizeBoard();
  });

})();
</script>
</body>
