  // ===================== 个人模式位置 =====================
  function computeSinglePositions() {
    const W = topArea.clientWidth, H = topArea.clientHeight;
    POS.W = W; POS.H = H;
    const trough = document.getElementById('trough');
    const bigHome = document.getElementById('bigHome');
    const troughLeft = 44, troughRight = W - 106;
    const troughWidth = Math.max(180, troughRight - troughLeft);
    trough.style.left = troughLeft + "px";
    trough.style.bottom = "42px";
    trough.style.width = troughWidth + "px";
    const homeW = 91, homeLeft = W - 100, homeTop = 130;
    const maxHomeH = H - homeTop - 24;
    const homeH = Math.max(140, Math.min(maxHomeH, (H - 130) * 0.78));
    bigHome.style.left = homeLeft + "px";
    bigHome.style.top = homeTop + "px";
    bigHome.style.width = homeW + "px";
    bigHome.style.height = homeH + "px";
    POS.eating = [];
    const catW = 84;
    const troughTopY = H - 42 - 34;
    const eatY = troughTopY - 60;
    const eatLeft = troughLeft + 6;
    const eatRight = troughLeft + troughWidth - catW - 6;
    const eatWidth = Math.max(80, eatRight - eatLeft);
    let n = Math.max(2, Math.min(6, Math.floor(eatWidth / 72) + 1));
    for (let i = 0; i < n; i++) {
      const t = n === 1 ? 0.5 : i / (n - 1);
      POS.eating.push({ x: eatLeft + (eatWidth - catW) * t, y: eatY });
    }
    POS.waiting = [];
    const catH = 50;
    const waitBottomLimit = eatY - 34;
    const waitLeft = 72, waitRight = W - 106;
    const waitWidth = Math.max(120, waitRight - waitLeft);
    let cols = Math.max(3, Math.min(5, Math.floor(waitWidth / 50) + 1));
    let rows = 2;
    const cellH = 42;
    let baseY = waitBottomLimit - (rows - 1) * cellH - catH;
    const minBaseY = H * 0.3 + 2;
    while (rows > 1 && baseY < minBaseY) { rows--; baseY = waitBottomLimit - (rows - 1) * cellH - catH; }
    if (baseY < minBaseY) baseY = minBaseY;
    const cellW = waitWidth / cols;
    for (let row = 0; row < rows; row++) for (let col = 0; col < cols; col++) {
      POS.waiting.push({ x: waitLeft + cellW * (col + 0.5) - catW / 2, y: baseY + row * cellH });
    }
    POS.sleepSpots = [];
    const sCellW = homeW / 4, sCellH = homeH / 5;
    for (let row = 0; row < 4; row++) for (let col = 0; col < 4; col++) {
      POS.sleepSpots.push({
        x: homeLeft + sCellW * (col + 0.5) - catW / 2,
        y: homeTop + sCellH * (row + 1) - 18
      });
    }
    const gameRect = gameRoot.getBoundingClientRect();
    const topAreaRect = topArea.getBoundingClientRect();
    const topAreaBottomRel = topAreaRect.bottom - gameRect.top;
    leftColumn.style.top = (topAreaBottomRel - 78 / 2) + "px";
    const pt = document.getElementById('progressTrack');
    if (pt) pt.style.height = (boardEl.offsetHeight || 260) + "px";
  }

    // 猫粮槽渲染：6 格，每 3 份铺满一格
  function updateTroughCells(cellsEl, stock) {
    if (!cellsEl) return;
    // 首次生成 6 个格子
    if (cellsEl.children.length !== 6) {
      cellsEl.innerHTML = "";
      for (let i = 0; i < 6; i++) {
        const cell = document.createElement("div");
        cell.className = "trough-cell";
        const fill = document.createElement("div");
        fill.className = "trough-cell-fill";
        cell.appendChild(fill);
        cellsEl.appendChild(cell);
      }
    }
    // 更新每格填充度：格子 i 装的是 [i*3+1, (i+1)*3] 这 3 份
    for (let i = 0; i < 6; i++) {
      const cell = cellsEl.children[i];
      const fill = cell.querySelector(".trough-cell-fill");
      const inCell = Math.max(0, Math.min(3, stock - i * 3));
      const pct = (inCell / 3) * 100;
      fill.style.height = pct + "%";
      cell.classList.toggle("full", inCell >= 3);
    }
  }


  // ===================== 个人模式猫咪 =====================
  function makeSingleCat(paletteIdx) {
    const cat = {
      id: catIdSeq++, state: "waiting", stateStart: performance.now(),
      nextIdleChange: performance.now() + rand(2500, 5500),
      walkDir: "right",
      paletteIdx: paletteIdx === undefined ? Math.floor(Math.random() * CAT_PALETTES.length) : paletteIdx,
      dirty: true, eatingSlot: -1, waitingSlot: -1, sleepSlot: -1,
      el: document.createElement("div")
    };
    cat.palette = CAT_PALETTES[cat.paletteIdx];
    cat.el.className = "cat state-waiting";
    cat.el.innerHTML = `<div class="cat-svg-wrap">${catSVG("waiting", cat.palette, true, false)}</div><div class="cat-chip">等待</div>`;
    document.getElementById('catsLayer').appendChild(cat.el);
    return cat;
  }
  function refreshSingleCatVisual(cat) {
    cat.el.className = "cat state-" + cat.state;
    if (cat.state === "walking_to_food") cat.el.classList.add("facing-left");
    else if (cat.state === "waiting_walk" && cat.walkDir === "left") cat.el.classList.add("facing-left");
    const tailUp = cat.state === "walking_to_home" || cat.state === "eating";
    cat.el.innerHTML = `<div class="cat-svg-wrap">${catSVG(cat.state, cat.palette, cat.dirty, tailUp)}</div><div class="cat-chip">${stateLabel(cat.state)}</div>`;
  }
  function moveCat(cat, x, y) { cat.el.style.left = x + "px"; cat.el.style.top = y + "px"; }

  function getFreeWaitingSlot() {
    const used = new Set(cats.filter(c => c.waitingSlot >= 0).map(c => c.waitingSlot));
    for (let i = 0; i < POS.waiting.length; i++) if (!used.has(i)) return i;
    return -1;
  }
  function getFreeEatingSlot() {
    const used = new Set(cats.filter(c => c.eatingSlot >= 0 &&
      ["walking_to_food", "eating", "cleaning", "happy"].includes(c.state)).map(c => c.eatingSlot));
    for (let i = 0; i < POS.eating.length; i++) if (!used.has(i)) return i;
    return -1;
  }
  function getFreeSleepSlot() {
    const used = new Set(cats.filter(c => c.sleepSlot >= 0 && c.state === "sleeping").map(c => c.sleepSlot));
    for (let i = 0; i < POS.sleepSpots.length; i++) if (!used.has(i)) return i;
    return -1;
  }
  function spawnSingleWaitingCat() {
    // 只统计非 sleeping 的猫（回窝睡觉的不算占用名额）
    const activeCats = cats.filter(c => c.state !== "sleeping").length;
    if (activeCats >= 18) return;
    const wCount = cats.filter(c => c.state === "waiting" || c.state === "waiting_walk").length;
    if (wCount >= 10) return;
    if (POS.waiting.length === 0) return;
    const slot = getFreeWaitingSlot();
    if (slot < 0) return;
    const cat = makeSingleCat();
    cat.waitingSlot = slot;
    const p = POS.waiting[slot];
    cat.el.style.left = p.x + "px";
    cat.el.style.top = p.y + "px";
    cats.push(cat);
  }

  function tickSingleCats() {
    const now = performance.now();
    for (const cat of cats) {
      const e = now - cat.stateStart;
      switch (cat.state) {
        case "waiting":
          if (now >= cat.nextIdleChange) {
            const p = POS.waiting[cat.waitingSlot];
            if (p && Math.random() < 0.55) {
              cat.state = "waiting_walk";
              cat.stateStart = now;
              cat.walkDir = Math.random() < 0.5 ? "left" : "right";
              cat.nextIdleChange = now + rand(1800, 3500);
              const offset = (cat.walkDir === "right" ? 1 : -1) * (10 + Math.random() * 14);
              let nx = p.x + offset;
              nx = Math.max(70, Math.min(POS.W - 106 - 56, nx));
              moveCat(cat, nx, p.y);
              refreshSingleCatVisual(cat);
            } else {
              cat.nextIdleChange = now + rand(3000, 7000);
            }
          }
          break;
        case "waiting_walk":
          if (now >= cat.nextIdleChange) {
            const p = POS.waiting[cat.waitingSlot];
            if (p) moveCat(cat, p.x, p.y);
            cat.state = "waiting";
            cat.stateStart = now;
            cat.nextIdleChange = now + rand(3000, 7000);
            refreshSingleCatVisual(cat);
          }
          break;
        case "walking_to_food":
          if (e >= DUR.walkingToFood) {
            cat.state = "eating";
            cat.stateStart = now;
            refreshSingleCatVisual(cat);
          }
          break;
        case "eating":
          if (e >= DUR.eating) { cat.state = "cleaning"; cat.stateStart = now; cat.dirty = false; refreshSingleCatVisual(cat); }
          break;
        case "cleaning":
          if (e >= DUR.cleaning) { cat.state = "happy"; cat.stateStart = now; refreshSingleCatVisual(cat); }
          break;
        case "happy":
          if (e >= DUR.happy) {
            const slot = getFreeSleepSlot();
            const idx = slot >= 0 ? slot : Math.floor(Math.random() * POS.sleepSpots.length);
            cat.sleepSlot = idx; cat.eatingSlot = -1;
            cat.state = "walking_to_home"; cat.stateStart = now;
            refreshSingleCatVisual(cat);
            const p = POS.sleepSpots[idx];
            moveCat(cat, p.x, p.y);
          }
          break;
        case "walking_to_home":
          if (e >= DUR.walkingToHome) {
            cat.state = "sleeping"; cat.stateStart = now;
            refreshSingleCatVisual(cat); returnedCats++;
            SoundManager.returnHome();
            updateHUD();
          }
          break;
      }
    }
    trySendSingleCat();
  }
  function trySendSingleCat() {
    if (!gameActive) return;
    const using = cats.filter(c => c.state === "eating" || c.state === "cleaning" ||
      c.state === "happy" || c.state === "walking_to_food").length;
    if (using >= 6) return;
    if (foodStock <= 0) return;
    const maxConcurrent = maxConcurrentByFood(foodStock);
    if (using >= maxConcurrent) return;
    const waiter = cats.find(c => c.state === "waiting" || c.state === "waiting_walk");
    if (!waiter) return;
    const slot = getFreeEatingSlot();
    if (slot < 0) return;
    foodStock--;
    waiter.eatingSlot = slot; waiter.waitingSlot = -1;
    waiter.state = "walking_to_food"; waiter.stateStart = performance.now();
    refreshSingleCatVisual(waiter);
    const p = POS.eating[slot];
    moveCat(waiter, p.x, p.y);
    SoundManager.meow();
    updateHUD();
  }

  // ===================== 对战模式位置 =====================
  function computeBattlePositions() {
    const W = topArea.clientWidth, H = topArea.clientHeight;

    // ============ 中栏等待区（只有 2 列） ============
    BATTLE_POS.pool = [];
    const poolWidth = 140;
    const poolLeft = (W - poolWidth) / 2;
    const poolTop = 66, poolBottom = H - 12;
    const poolH = Math.max(120, poolBottom - poolTop);
    const catW = 68, catH = 60;
    const cols = 2;
    const rows = Math.max(4, Math.floor(poolH / 66));
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        BATTLE_POS.pool.push({
          x: poolLeft + (c + 0.5) * (poolWidth / cols) - catW / 2,
          y: poolTop + (r + 0.5) * (poolH / rows) - catH / 2
        });
      }
    }

    // ============ 左右栏：自适应宽度 ============
    const leftColX = 6;
    const gapToPool = 6;
    const leftColW = (W - poolWidth) / 2 - gapToPool - 6;
    const rightColX = W - leftColW - 6;

    const colTop = 58;
    const colBottom = H - 8;
    const HOME_H = 88;
    const TROUGH_H = 32;
    const MACHINE_H = 78;
    const STOCK_H = 24;

    const homeTop = colTop;
    const stockTop = colBottom - STOCK_H;
    const machineTop = stockTop - MACHINE_H;
    const troughTop = machineTop - TROUGH_H;

    BATTLE_POS.myHome = { x: leftColX, y: homeTop, w: leftColW, h: HOME_H };
    BATTLE_POS.oppHome = { x: rightColX, y: homeTop, w: leftColW, h: HOME_H };

    // 进食位：固定 6 个（允许横向轻微堆叠）
    const eatY = troughTop - catH + 10;
    const eatCount = 6;
    BATTLE_POS.myEat = [];
    BATTLE_POS.oppEat = [];
    for (let i = 0; i < eatCount; i++) {
      const t = (i + 0.5) / eatCount;
      BATTLE_POS.myEat.push({
        x: leftColX + leftColW * t - catW / 2,
        y: eatY,
        z: i
      });
      BATTLE_POS.oppEat.push({
        x: rightColX + leftColW * t - catW / 2,
        y: eatY,
        z: i
      });
    }

    positionLeftColumnForBattle();
  }
  function positionLeftColumnForBattle() {
    const gameRect = gameRoot.getBoundingClientRect();
    const topAreaRect = topArea.getBoundingClientRect();
    const topAreaBottomRel = topAreaRect.bottom - gameRect.top;
    // 进度条在 topArea 底部稍下方
    leftColumn.style.top = (topAreaBottomRel + 8) + "px";
    const pt = document.getElementById('progressTrack');
    if (pt) pt.style.height = (boardEl.offsetHeight || 260) + "px";
  }
  // 猫窝内叠放位置：每 3 只一层，一层一层往上叠
  function getHomeSlotPos(owner, index) {
    const home = owner === 'me' ? BATTLE_POS.myHome : BATTLE_POS.oppHome;
    if (!home) return { x: 0, y: 0 };
    const catW = 68, catH = 60;
    // 只展示前 12 个位置（4 行 × 3 列），超过的叠在最后一排
    const cappedIndex = Math.min(index, 11);
    const row = Math.floor(cappedIndex / 3);
    const col = cappedIndex % 3;
    const innerLeft = home.x + home.w * 0.14;
    const innerBottom = home.y + home.h * 0.72;
    const innerW = home.w * 0.72;
    const colSpacing = innerW / 3;
    const rowSpacing = 8;
    return {
      x: innerLeft + col * colSpacing + colSpacing / 2 - catW / 2,
      y: innerBottom - row * rowSpacing - catH * 0.4
    };
  }
  // ===================== 对战猫咪 =====================
  // 服务器事件同步时：cat.paletteIdx 由服务器给
  // 本地 AI 对战：随机 paletteIdx
  function makeBattleCat(id, owner, paletteIdx, slot) {
    const cat = {
      id: id,
      owner: owner,      // 'me' | 'opp'
      state: "waiting",
      stateStart: performance.now(),
      nextIdleChange: performance.now() + rand(2500, 5500),
      walkDir: "right",
      paletteIdx: paletteIdx !== undefined ? paletteIdx : Math.floor(Math.random() * CAT_PALETTES.length),
      poolSlot: slot !== undefined ? slot : getFreeBattlePoolSlot(),
      eatSlot: -1,
      homeSlot: -1,
      dirty: true,
      el: document.createElement("div")
    };
    cat.palette = CAT_PALETTES[cat.paletteIdx];
    cat.el.className = "cat state-waiting";
    cat.el.dataset.catId = cat.id;
    cat.el.innerHTML = `<div class="cat-svg-wrap">${catSVG("waiting", cat.palette, true, false)}</div><div class="cat-chip">等待</div>`;
    battleCatsEl.appendChild(cat.el);

    // 初始位置
    if (cat.poolSlot >= 0 && BATTLE_POS.pool[cat.poolSlot]) {
      const p = BATTLE_POS.pool[cat.poolSlot];
      cat.el.style.left = p.x + "px";
      cat.el.style.top = p.y + "px";
    }
    return cat;
  }

  function getFreeBattlePoolSlot() {
    const used = new Set(
      cats.filter(c => (c.state === "waiting" || c.state === "waiting_walk") && c.poolSlot >= 0)
        .map(c => c.poolSlot)
    );
    for (let i = 0; i < BATTLE_POS.pool.length; i++) if (!used.has(i)) return i;
    return -1;
  }

  function getFreeBattleEatSlot(owner) {
    const arr = owner === 'me' ? BATTLE_POS.myEat : BATTLE_POS.oppEat;
    const used = new Set(
      cats.filter(c => c.owner === owner && c.eatSlot >= 0 &&
        ["walking_to_food", "eating", "cleaning", "happy"].includes(c.state))
        .map(c => c.eatSlot)
    );
    for (let i = 0; i < arr.length; i++) if (!used.has(i)) return i;
    return -1;
  }

  function getFreeBattleHomeSlot(owner) {
    // 无限叠：返回当前已占用数量
    return cats.filter(c => c.owner === owner &&
      (c.state === "walking_to_home" || c.state === "sleeping")).length;
  }

  function refreshBattleCatVisual(cat) {
    cat.el.className = "cat state-" + cat.state;
    // 朝向：向左走是 facing-left，向右走是默认
    // 走食槽：从中间走向左侧 = 向左；走向右侧 = 向右
    // 走猫窝：不改变朝向
    let facing = 'right';
    if (cat.state === "waiting_walk" && cat.walkDir === "left") facing = 'left';
    else if (cat.state === "walking_to_food") {
      // 根据目标食槽在左或右决定朝向
      facing = cat.owner === 'me' ? 'left' : 'right';
    }
    if (facing === 'left') cat.el.classList.add("facing-left");
    const tailUp = cat.state === "walking_to_home" || cat.state === "eating";
    const showChip = true;
    if (showChip) {
      cat.el.innerHTML = `<div class="cat-svg-wrap">${catSVG(cat.state, cat.palette, cat.dirty, tailUp)}</div><div class="cat-chip">${stateLabel(cat.state)}</div>`;
    } else {
      cat.el.innerHTML = `<div class="cat-svg-wrap">${catSVG(cat.state, cat.palette, cat.dirty, tailUp)}</div>`;
    }
  }

  // 尝试让中间等待的猫去某侧食槽
  function trySendBattleCat() {
    if (!gameActive) return;
    if (mode === 'online') {
      tryPromoteWaitingCats();
      return;
    }
    // 检查双方是否有空位
    const myEating = cats.filter(c => c.owner === 'me' &&
      ["eating", "cleaning", "happy", "walking_to_food"].includes(c.state)).length;
    const oppEating = cats.filter(c => c.owner === 'opp' &&
      ["eating", "cleaning", "happy", "walking_to_food"].includes(c.state)).length;

    // 我方可以再吸引猫
    const maxEat = BATTLE_POS.myEat.length;
    const myCanReceive = myEating < maxEat && myEating < maxConcurrentByFood(foodStock) && foodStock > 0;
    const oppCanReceive = oppEating < maxEat && oppEating < maxConcurrentByFood(opponent.foodStock) && opponent.foodStock > 0;

    const waitingList = cats.filter(c => c.state === "waiting" || c.state === "waiting_walk");
    if (waitingList.length === 0) return;
    // 至少保留 6 只在中栏
    const targetKeep = 3;
    if (waitingList.length <= targetKeep) return;

    // 优先给库存多的一方
    let chosenOwner = null;
    if (myCanReceive && oppCanReceive) {
      chosenOwner = foodStock >= opponent.foodStock ? 'me' : 'opp';
    } else if (myCanReceive) chosenOwner = 'me';
    else if (oppCanReceive) chosenOwner = 'opp';
    if (!chosenOwner) return;

    const cat = waitingList[0];
    const eatSlot = getFreeBattleEatSlot(chosenOwner);
    if (eatSlot < 0) return;

    // 扣粮
    if (chosenOwner === 'me') foodStock--;
    else opponent.foodStock--;

    cat.poolSlot = -1;
    cat.eatSlot = eatSlot;
    cat.owner = chosenOwner;      // ← 新增
    cat.state = "walking_to_food";
    cat.stateStart = performance.now();
    refreshBattleCatVisual(cat);

    const target = (chosenOwner === 'me' ? BATTLE_POS.myEat : BATTLE_POS.oppEat)[eatSlot];
    if (target) {
      cat.el.style.left = target.x + "px";
      cat.el.style.top = target.y + "px";
    }

    SoundManager.meow();
    updateHUD();
  }

    // 联机模式：客户端把等待区里还没开始流程的猫推进到 walking_to_food。
  // 服务器权威扣粮已经完成，客户端这里只负责视觉推进。
  function tryPromoteWaitingCats() {
    if (!gameActive) return;
    for (const cat of cats) {
      if (cat.state !== 'waiting' && cat.state !== 'waiting_walk') continue;
      const owner = cat.owner;
      const eatingCount = cats.filter(c => c.owner === owner &&
        ['walking_to_food', 'eating', 'cleaning', 'happy'].includes(c.state)).length;
      const maxEat = owner === 'me' ? BATTLE_POS.myEat.length : BATTLE_POS.oppEat.length;
      if (eatingCount >= maxEat) continue;
      const eatSlot = getFreeBattleEatSlot(owner);
      if (eatSlot < 0) continue;
      cat.eatSlot = eatSlot;
      cat.poolSlot = -1;
      cat.state = 'walking_to_food';
      cat.stateStart = performance.now();
      refreshBattleCatVisual(cat);
      const arr = owner === 'me' ? BATTLE_POS.myEat : BATTLE_POS.oppEat;
      const p = arr[eatSlot];
      if (p) {
        cat.el.style.left = p.x + "px";
        cat.el.style.top = p.y + "px";
      }
    }
  }

  function maxConcurrentByFood(stock) {
    if (stock <= 0) return 0;
    if (stock <= 3) return 1;
    if (stock <= 6) return 2;
    if (stock <= 9) return 3;
    if (stock <= 12) return 4;
    if (stock <= 15) return 5;
    return 6;
  }

  function tickBattleCats() {
    const now = performance.now();
    for (const cat of cats) {
      const e = now - cat.stateStart;
      switch (cat.state) {
        case "waiting":
          if (now >= cat.nextIdleChange) {
            const p = BATTLE_POS.pool[cat.poolSlot];
            if (p && Math.random() < 0.55) {
              cat.state = "waiting_walk";
              cat.stateStart = now;
              cat.walkDir = Math.random() < 0.5 ? "left" : "right";
              cat.nextIdleChange = now + rand(1500, 3000);
              const offset = (cat.walkDir === "right" ? 1 : -1) * (8 + Math.random() * 10);
              let nx = p.x + offset;
              nx = Math.max(104 + 2, Math.min(topArea.clientWidth - 104 - 56, nx));
              cat.el.style.left = nx + "px";
              cat.el.style.top = p.y + "px";
              refreshBattleCatVisual(cat);
            } else {
              cat.nextIdleChange = now + rand(3000, 6500);
            }
          }
          break;
        case "waiting_walk":
          if (now >= cat.nextIdleChange) {
            const p = BATTLE_POS.pool[cat.poolSlot];
            if (p) {
              cat.el.style.left = p.x + "px";
              cat.el.style.top = p.y + "px";
            }
            cat.state = "waiting";
            cat.stateStart = now;
            cat.nextIdleChange = now + rand(2500, 5500);
            refreshBattleCatVisual(cat);
          }
          break;
        case "walking_to_food":
          if (e >= DUR.walkingToFood) {
            cat.state = "eating";
            cat.stateStart = now;
            refreshBattleCatVisual(cat);
          }
          break;
        case "eating":
          if (e >= DUR.eating) {
            cat.state = "cleaning"; cat.stateStart = now; cat.dirty = false;
            refreshBattleCatVisual(cat);
          }
          break;
        case "cleaning":
          if (e >= DUR.cleaning) {
            cat.state = "happy"; cat.stateStart = now;
            refreshBattleCatVisual(cat);
          }
          break;
        case "happy":
          if (e >= DUR.happy) {
            // 走向同侧猫窝
            cat.homeSlot = getFreeBattleHomeSlot(cat.owner);
            cat.eatSlot = -1;
            cat.state = "walking_to_home";
            cat.stateStart = now;
            refreshBattleCatVisual(cat);
            const pos = getHomeSlotPos(cat.owner, cat.homeSlot);
            cat.el.style.left = pos.x + "px";
            cat.el.style.top = pos.y + "px";
          }
          break;
        case "walking_to_home":
          if (e >= DUR.walkingToHome) {
            cat.state = "sleeping";
            cat.stateStart = now;
            refreshBattleCatVisual(cat);
            if (cat.owner === 'me') {
              returnedCats++;
              SoundManager.returnHome();
            } else {
              opponent.returnedCats++;
            }
            updateHUD();
          }
          break;
        case "sleeping":
          // 睡觉的猫保留在猫窝里，视觉上限 12 只，超出移除最早的
          break;
      }
    }
    // 清理逻辑：每侧最多保留 12 只 sleeping 猫，超出的移除 DOM 和数组
    const sleepingByOwner = { me: [], opp: [] };
    for (const c of cats) {
      if (c.state === 'sleeping' && (c.owner === 'me' || c.owner === 'opp')) {
        sleepingByOwner[c.owner].push(c);
      }
    }
    for (const owner of ['me', 'opp']) {
      const list = sleepingByOwner[owner];
      if (list.length > 12) {
        list.sort((a, b) => a.stateStart - b.stateStart);
        const toRemove = list.slice(0, list.length - 12);
        for (const c of toRemove) {
          if (c.el && c.el.parentNode) c.el.parentNode.removeChild(c.el);
          c._dead = true;
        }
      }
    }
    if (cats.some(c => c._dead)) {
      cats = cats.filter(c => !c._dead);
    }
    trySendBattleCat();
  }

  // ===================== 对战：等待区补充 =====================
  // 中栏始终维持至少 6 只等待猫
  let sharedSpawnTimer = null;
  function startBattlePoolSpawner() {
    if (sharedSpawnTimer) clearInterval(sharedSpawnTimer);
    sharedSpawnTimer = setInterval(() => {
      if (!gameActive) return;
      const waiters = cats.filter(c => c.state === "waiting" || c.state === "waiting_walk").length;
      if (waiters >= 6) return;
      // 补 1 只
      const slot = getFreeBattlePoolSlot();
      if (slot < 0) return;
      const cat = makeBattleCat(catIdSeq++, Math.random() < 0.5 ? 'me' : 'opp',
        Math.floor(Math.random() * CAT_PALETTES.length), slot);
      cats.push(cat);
    }, 800);
  }

  // ===================== 对战 AI =====================
  function startBattleAI() {
    if (aiTimer) clearInterval(aiTimer);
    aiTimer = setInterval(() => {
      if (!gameActive || mode !== 'battle') return;
      const moves = [];
      for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
        if (c < 7) {
          swap(opponent.board, r, c, r, c + 1);
          if (findMatches(opponent.board).length > 0) moves.push([r, c, r, c + 1]);
          swap(opponent.board, r, c, r, c + 1);
        }
        if (r < 7) {
          swap(opponent.board, r, c, r + 1, c);
          if (findMatches(opponent.board).length > 0) moves.push([r, c, r + 1, c]);
          swap(opponent.board, r, c, r + 1, c);
        }
      }
      if (moves.length === 0) { opponent.board = generateBoard(); return; }
      const [r1, c1, r2, c2] = moves[Math.floor(Math.random() * moves.length)];
      executeOpponentSwap(r1, c1, r2, c2);
    }, rand(4500, 5500));
  }
  function executeOpponentSwap(r1, c1, r2, c2) {
    swap(opponent.board, r1, c1, r2, c2);
    const first = findMatches(opponent.board);
    if (first.length === 0) { swap(opponent.board, r1, c1, r2, c2); return; }
    let chainLevel = 0, current = first;
    let totalGain = 0;
    while (current.length > 0) {
      const removeSet = new Set();
      let base = 0;
      for (const g of current) {
        base += scoreForLength(g.length);
        for (const [r, c] of g.cells) removeSet.add(`${r},${c}`);
      }
      const chainMul = 1 + Math.min(chainLevel * 0.25, 0.75);
      totalGain += Math.round(base * chainMul);
      removeSet.forEach(k => {
        const [r, c] = k.split(",").map(Number);
        opponent.board[r][c] = null;
      });
      applyGravity(opponent.board);
      current = findMatches(opponent.board);
      chainLevel++;
    }
    opponent.score += totalGain;
    opponent.foodProgress += totalGain;
    while (opponent.foodProgress >= 90 && opponent.foodStock < 24) {
      opponent.foodStock++; opponent.foodProgress -= 90;
    }
    updateHUD();
  }

  // ===================== HUD =====================
  function updateHUD() {
    if (mode === 'single') {
      timeText.textContent = Math.ceil(Math.max(0, timeLeft));
      returnText.textContent = returnedCats;
      scoreText.textContent = score;
      foodText.textContent = foodStock;
      updateTroughCells(document.getElementById('troughCells'), foodStock);
      updateProgressBar();
    } else {
      battleTimeText.textContent = Math.ceil(Math.max(0, timeLeft));
      myReturnText.textContent = returnedCats;
      oppReturnText.textContent = opponent.returnedCats;
      scoreText.textContent = score;
      foodText.textContent = foodStock;
      if (myMiniStock) myMiniStock.textContent = foodStock + "/24";
      if (oppMiniStock) oppMiniStock.textContent = opponent.foodStock + "/24";
      updateTroughCells(document.getElementById('myMiniTroughCells'), foodStock);
      updateTroughCells(document.getElementById('oppMiniTroughCells'), opponent.foodStock);
    }
  }

  function renderMiniKibbles(parent, stock) {
    if (!parent) return;
    parent.innerHTML = "";
    if (stock <= 0) return;
    const W = parent.clientWidth || 60, H = parent.clientHeight || 20;
    const perRow = Math.max(3, Math.min(stock, Math.ceil(Math.sqrt(stock * 2))));
    const rows = Math.ceil(stock / perRow);
    const cw = W / perRow, ch = H / Math.max(1, rows);
    for (let i = 0; i < stock; i++) {
      const r = Math.floor(i / perRow), c = i % perRow;
      const k = document.createElement("div");
      k.className = "k";
      k.style.left = (c * cw + cw * 0.5 - 2) + "px";
      k.style.top = (H - (rows - r - 1) * ch - ch * 0.5 - 2) + "px";
      parent.appendChild(k);
    }
  }

  function onCountdownTick() {
    if (!gameActive) return;
    timeLeft -= 0.1;
    const sec = Math.ceil(timeLeft);
    if (sec <= 10 && sec > 0 && sec !== tickSecond) {
      tickSecond = sec;
      SoundManager.tick();
    }
    if (timeLeft <= 0) {
      timeLeft = 0; updateHUD(); endGame(); return;
    }
    updateHUD();
  }

  function startSingleGame() {
    clearTimers();
    document.getElementById('catsLayer').innerHTML = "";
    cats = []; catIdSeq = 1;
    score = 0; foodStock = 0; foodProgress = 0;
    maxFoodStockThisRound = 0;
    timeLeft = 90; returnedCats = 0;
    gameActive = true; isAnimating = false; selected = null;
    progressAnimating = false; tickSecond = -1;

    board = generateBoard();
    renderBoard();
    computeSinglePositions();
    updateHUD();
    for (let i = 0; i < 5; i++) setTimeout(() => { if (gameActive) spawnSingleWaitingCat(); }, i * 200);

    showStartBanner();
    SoundManager.start();

    timers.countdown = setInterval(onCountdownTick, 100);
    timers.gameTick = setInterval(() => { if (gameActive) tickSingleCats(); }, 100);
    timers.spawnTimer = setInterval(() => { if (gameActive && mode === 'single') spawnSingleWaitingCat(); }, 2500);
  }

  function startBattleGame(isOnline) {
    clearTimers();
    battleCatsEl.innerHTML = "";
    cats = []; catIdSeq = 1;
    score = 0; foodStock = 0; foodProgress = 0;
    maxFoodStockThisRound = 0;
    timeLeft = 90; returnedCats = 0;
    gameActive = true; isAnimating = false; selected = null;
    progressAnimating = false; tickSecond = -1;

    opponent = { name: isOnline ? (opponent.name || '对手') : '电脑猫娘',
      score: 0, foodStock: 0,
      foodProgress: 0, returnedCats: 0, isBot: !isOnline, board: generateBoard() };
    oppNameLabel.textContent = opponent.name;

    board = generateBoard();
    renderBoard();

    // 多重保险，确保布局稳定后再摆放猫咪
    const initBattleLayout = () => {
      computeBattlePositions();
      // 清空已存在的猫
      battleCatsEl.innerHTML = "";
      cats = [];
      // 初始填充 6 只等待猫
      for (let i = 0; i < 6; i++) {
        const slot = getFreeBattlePoolSlot();
        if (slot < 0) break;
        const cat = makeBattleCat(catIdSeq++,
          Math.random() < 0.5 ? 'me' : 'opp',
          Math.floor(Math.random() * CAT_PALETTES.length), slot);
        cats.push(cat);
      }
      updateHUD();
    };
    // 连续多次尝试，确保生效
    requestAnimationFrame(() => requestAnimationFrame(() => {
      setTimeout(initBattleLayout, 60);
      setTimeout(computeBattlePositions, 300);
      setTimeout(computeBattlePositions, 800);
    }));

    showStartBanner();
    SoundManager.start();

    timers.countdown = setInterval(onCountdownTick, 100);
    timers.gameTick = setInterval(() => { if (gameActive) tickBattleCats(); }, 100);
    if (!isOnline) {
      // 本地对战：自己造猫
      startBattlePoolSpawner();
      startBattleAI();
    }
    // 联机模式：完全依赖服务器广播 cat_event，不本地造猫
  }

  function endGame() {
    if (!gameActive) return;
    gameActive = false;
    clearTimers();
    SoundManager.end();

    if (mode === 'single') {
      $('p1Name').textContent = '我';
      $('p1Returns').textContent = returnedCats;
      $('p2Name').textContent = '—';
      $('p2Returns').textContent = '—';
      $('p1Box').classList.remove('win'); $('p2Box').classList.remove('win');
      $('resultTitle').textContent = `开心回窝 ${returnedCats} 只`;
      $('resultTitle').className = 'win';
      $('btnResultLobby').textContent = '返回模式选择';
    } else {
      const my = returnedCats, op = opponent.returnedCats;
      $('p1Name').textContent = '我'; $('p1Returns').textContent = my;
      $('p2Name').textContent = opponent.name; $('p2Returns').textContent = op;
      $('p1Box').classList.remove('win'); $('p2Box').classList.remove('win');
      if (my > op) { $('resultTitle').textContent = '🎉 胜利！'; $('resultTitle').className = 'win'; $('p1Box').classList.add('win'); }
      else if (my < op) { $('resultTitle').textContent = '😿 失败'; $('resultTitle').className = 'lose'; $('p2Box').classList.add('win'); }
      else { $('resultTitle').textContent = '🤝 平局'; $('resultTitle').className = 'draw'; $('p1Box').classList.add('win'); $('p2Box').classList.add('win'); }
    }
    // 所有模式都显示上传区（只有破纪录时才会出现上传按钮）
    showUploadSection();
    resultOverlay.classList.remove('hidden');
  }

  // ===================== 联机 =====================
  function sendWS(msg) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(msg)); }

  function connectServer(url) {
    return new Promise((resolve, reject) => {
      try { ws = new WebSocket(url); } catch (e) { return reject(e); }
      const timeout = setTimeout(() => reject(new Error('连接超时')), 8000);
      ws.onopen = () => { clearTimeout(timeout); resolve(); };
      ws.onerror = () => { clearTimeout(timeout); reject(new Error('连接失败')); };
      ws.onmessage = (e) => {
        let msg; try { msg = JSON.parse(e.data); } catch { return; }
        handleWS(msg);
      };
      ws.onclose = () => {
        if (mode === 'online' && gameActive) {
          showToast('连接已断开');
          setTimeout(() => exitToMode(), 800);
        }
      };
    });
  }

  function handleWS(msg) {
    switch (msg.type) {
      case 'welcome': myPlayerId = msg.playerId; break;
      case 'joined_room': roomId = msg.roomId; break;
      case 'matched':
        opponent.name = msg.opponent.name;
        opponent.isBot = msg.opponent.isBot;
        waitOverlay.classList.add('hidden');
        if (waitTimerId) { clearInterval(waitTimerId); waitTimerId = null; }
        startBattleGame(true);
        break;
      case 'state': {
        if (!gameActive) return;
        timeLeft = msg.timeLeft;
        if (msg.myBoard) board = msg.myBoard;
        if (typeof msg.myScore === 'number') score = msg.myScore;
        if (typeof msg.myFoodStock === 'number') {
          foodStock = msg.myFoodStock;
          maxFoodStockThisRound = Math.max(maxFoodStockThisRound, foodStock);
        }
        if (typeof msg.myFoodProgress === 'number') foodProgress = msg.myFoodProgress;
        if (typeof msg.myReturnedCats === 'number') returnedCats = msg.myReturnedCats;
        if (msg.opponent) {
          opponent.name = msg.opponent.name;
          oppNameLabel.textContent = msg.opponent.name;
          opponent.isBot = msg.opponent.isBot;
          opponent.score = msg.opponent.score || 0;
          opponent.foodStock = msg.opponent.foodStock || 0;
          opponent.returnedCats = msg.opponent.returnedCats || 0;
        }
        renderBoard(); updateHUD();
        break;
      }
      case 'cat_event': {
        // 服务器下发猫咪事件
        if (msg.kind === 'spawn') {
          const c = msg.cat;
          const existing = cats.find(x => x.id === c.id);
          if (!existing) {
            const owner = c.ownerId === myPlayerId ? 'me' : 'opp';
            const cat = makeBattleCat(c.id, owner, c.paletteIdx, c.slot);
            // 服务器 spawn 时猫就是 walking_to_food 状态，客户端必须立刻同步，
            // 否则猫会一直卡在 waiting，直到收到 return 事件才被强制切到回窝。
            const eatSlot = getFreeBattleEatSlot(owner);
            if (eatSlot >= 0) {
              cat.eatSlot = eatSlot;
              cat.poolSlot = -1;
              cat.state = 'walking_to_food';
              cat.stateStart = performance.now();
              refreshBattleCatVisual(cat);
              const arr = owner === 'me' ? BATTLE_POS.myEat : BATTLE_POS.oppEat;
              const p = arr[eatSlot];
              if (p) {
                cat.el.style.left = p.x + "px";
                cat.el.style.top = p.y + "px";
              }
            }
            cats.push(cat);
          }
        } else if (msg.kind === 'return') {
          // 兜底：只有还在等待区的猫才需要被强制切到回窝。
          // 已经在走流程的猫让它自己跑完，避免视觉上从进食直接被拽到回窝。
          const cat = cats.find(x => x.id === msg.catId);
          if (cat && (cat.state === 'waiting' || cat.state === 'waiting_walk')) {
            cat.state = 'walking_to_home';
            cat.stateStart = performance.now();
            cat.eatSlot = -1;
            cat.homeSlot = getFreeBattleHomeSlot(cat.owner);
            refreshBattleCatVisual(cat);
            const pos = getHomeSlotPos(cat.owner, cat.homeSlot);
            cat.el.style.left = pos.x + "px";
            cat.el.style.top = pos.y + "px";
          }
        }
        break;
      }
      case 'event':
        if (msg.kind === 'match') {
          msg.cells.forEach(([r, c]) => {
            const el = getTileEl(r, c); if (el) el.classList.add('pop');
          });
          spawnParticles(msg.cells);
          shakeBoard();
          SoundManager.match(msg.length || 3);
          showFloatingScore(msg.gain);
        } else if (msg.kind === 'swap_result') {
          if (msg.board) board = msg.board;
          renderBoard();
          for (const ev of msg.events) {
            if (ev.kind === 'match' && ev.chain > 0) showChainBanner(ev.chain);
          }
        } else if (msg.kind === 'invalid') {
          SoundManager.invalid();
        } else if (msg.kind === 'cat_return') {
          SoundManager.returnHome();
        }
        break;
      case 'round_end': endGame(); break;
      case 'opponent_left':
        showToast('对手已离开');
        setTimeout(() => exitToMode(), 1200);
        break;
      case 'error': showToast('错误：' + msg.msg); break;
    }
  }

  function enterMode(m) {
    mode = m;
    modeSelect.classList.add('hidden');
    gameRoot.classList.remove('hidden');
    resultOverlay.classList.add('hidden');
    waitOverlay.classList.add('hidden');

    if (m === 'single') {
      topArea.className = 'singleMode';
      boardArea.className = 'singleMode';
      leftColumn.style.display = 'flex';
      const fm = document.getElementById('foodMachine');
      if (fm) fm.style.display = '';
      $('btnResultLobby').textContent = '返回模式选择';
      startSingleGame();
    } else {
      topArea.className = 'battleMode';
      boardArea.className = 'battleMode';
      leftColumn.style.display = 'flex';
      const fm = document.getElementById('foodMachine');
      if (fm) fm.style.display = 'none';
      if (m === 'battle') {
        startBattleGame(false);
      } else {
        startOnlineMatch();
      }
    }
  }

  function exitToMode() {
    gameActive = false;
    clearTimers();
    if (waitTimerId) { clearInterval(waitTimerId); waitTimerId = null; }
    if (ws && ws.readyState === 1) {
      try { sendWS({ type: 'leave_room' }); ws.close(); } catch (e) {}
    }
    ws = null; roomId = null;
    gameRoot.classList.add('hidden');
    resultOverlay.classList.add('hidden');
    waitOverlay.classList.add('hidden');
    modeSelect.classList.remove('hidden');
  }

  function startOnlineMatch() {
    waitOverlay.classList.remove('hidden');
    waitStartTime = Date.now();
    waitTimer.textContent = '00:00';
    if (waitTimerId) clearInterval(waitTimerId);
    waitTimerId = setInterval(() => {
      const sec = Math.floor((Date.now() - waitStartTime) / 1000);
      const mm = String(Math.floor(sec / 60)).padStart(2, '0');
      const ss = String(sec % 60).padStart(2, '0');
      waitTimer.textContent = `${mm}:${ss}`;
    }, 200);

    let wsUrl;
    if (location.protocol === 'file:') {
      wsUrl = 'ws://localhost:8080';
    } else {
      wsUrl = 'wss://sanxiao.onrender.com';
    }

    connectServer(wsUrl).then(() => {
      sendWS({ type: 'set_name', name: '玩家' });
      sendWS({ type: 'quick_match_human' });
    }).catch((e) => {
      showToast('无法连接服务器，请检查服务端是否运行');
      setTimeout(() => exitToMode(), 1500);
    });
  }

  document.querySelectorAll('.mode-card').forEach(card => {
    card.addEventListener('click', () => {
      SoundManager.init();
      enterMode(card.dataset.mode);
    });
  });
    const lbBtn = document.getElementById('btnLeaderboard');
  if (lbBtn) lbBtn.addEventListener('click', () => { SoundManager.init(); openLeaderboard(); });
  const lbClose = document.getElementById('btnCloseLeaderboard');
  if (lbClose) lbClose.addEventListener('click', () => {
    document.getElementById('leaderboardOverlay').classList.add('hidden');
  });
  $('btnBack').addEventListener('click', () => {
    if (confirm('确定要返回模式选择吗？当前进度会丢失。')) exitToMode();
  });
  $('btnCancelWait').addEventListener('click', () => exitToMode());
  $('btnResultLobby').addEventListener('click', () => exitToMode());
  window.addEventListener('resize', () => {
    if (mode === 'single') computeSinglePositions();
    else if (mode === 'battle' || mode === 'online') {
      computeBattlePositions();
      // 重排所有对战猫
      for (const cat of cats) {
        if (cat.state === 'waiting' || cat.state === 'waiting_walk') {
          const p = BATTLE_POS.pool[cat.poolSlot];
          if (p) { cat.el.style.left = p.x + "px"; cat.el.style.top = p.y + "px"; }
        } else if (cat.state === 'walking_to_food' || cat.state === 'eating' || cat.state === 'cleaning' || cat.state === 'happy') {
          const arr = cat.owner === 'me' ? BATTLE_POS.myEat : BATTLE_POS.oppEat;
          const p = arr[cat.eatSlot];
          if (p) { cat.el.style.left = p.x + "px"; cat.el.style.top = p.y + "px"; }
        } else if (cat.state === 'walking_to_home' || cat.state === 'sleeping') {
          const p = getHomeSlotPos(cat.owner, cat.homeSlot);
          cat.el.style.left = p.x + "px";
          cat.el.style.top = p.y + "px";
        }
      }
    }
    if (boardEl) resizeBoard();
  });

})();
</script>
